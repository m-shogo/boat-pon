name: Temporary audit N2 operability post 967ad45

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-audit-n2-operability-post-967ad45.yml

permissions:
  contents: read

concurrency:
  group: audit-n2-operability-post-967ad45
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    env:
      AUTHORITY_SHA: 967ad45d1f72b4ad17e036a25926c1e61ba4e091
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 967ad45d1f72b4ad17e036a25926c1e61ba4e091
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify canonical reviewed runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$CANONICAL_REPO" rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git -C "$CANONICAL_REPO" branch --show-current)" = main
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"
      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANONICAL_REPO"
          npm ci
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Produce sanitized operability report
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/n2-operability-post-967ad45.json"
          export REPORT
          cd "$CANONICAL_REPO"
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL_REPO" \
            node node_modules/tsx/dist/cli.mjs \
            scripts/report-n2-trifecta-private-capture-operability.ts > "$REPORT"
          REPORT_EXIT=$?
          set -e
          export REPORT_EXIT
          test "$REPORT_EXIT" -eq 0 -o "$REPORT_EXIT" -eq 3
          test -s "$REPORT"
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const violations = [];
          if (report.networkRequestCount !== 0 || report.databaseReadCount !== 0
            || report.databaseWriteCount !== 0) violations.push('AUDIT_IO_BOUNDARY_CHANGED');
          if (report.rawOddsValuesRead !== false || report.rawOddsValuesPrinted !== false
            || report.rawOddsValuesPublished !== false) violations.push('RAW_ODDS_BOUNDARY_CHANGED');
          if (report.currentBuyChanged !== false || report.lineChanged !== false
            || report.publicPublished !== false || report.automatedBettingChanged !== false
            || report.productionApplyExecuted !== false) violations.push('PROTECTED_BOUNDARY_CHANGED');
          const summary = {
            evidenceSchemaVersion: 'n2-operability-post-967ad45-v1',
            status: violations.length ? 'BLOCKED' : report.status,
            reportStatus: report.status,
            reportBlockers: report.blockers,
            violations,
            checkedAt: report.checkedAt,
            date: report.date,
            selectedVenueCode: report.selectedVenueCode,
            authoritySha: report.authoritySha,
            launchdRegistered: report.launchdRegistered,
            authorization: report.authorization,
            heartbeat: report.heartbeat,
            coverage: report.coverage,
            storage: report.storage,
            networkRequestCount: report.networkRequestCount,
            databaseReadCount: report.databaseReadCount,
            databaseWriteCount: report.databaseWriteCount,
            rawOddsValuesRead: report.rawOddsValuesRead,
            rawOddsValuesPrinted: report.rawOddsValuesPrinted,
            rawOddsValuesPublished: report.rawOddsValuesPublished,
            currentBuyChanged: report.currentBuyChanged,
            lineChanged: report.lineChanged,
            publicPublished: report.publicPublished,
            automatedBettingChanged: report.automatedBettingChanged,
            productionApplyExecuted: report.productionApplyExecuted,
          };
          console.log('SANITIZED_N2_OPERABILITY_POST_967AD45_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('SANITIZED_N2_OPERABILITY_POST_967AD45_END');
          if (violations.length) process.exit(1);
          NODE

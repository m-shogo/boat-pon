name: Apply N2 skip reserved due checkpoint fix

on:
  push:
    branches:
      - fix/n2-trifecta-skip-reserved-due-checkpoints
    paths:
      - .github/workflows/n2-skip-reserved-due-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-trifecta-skip-reserved-due-checkpoints
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reserve first unreserved due checkpoint atomically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/research-replay/n2TrifectaLocalCaptureService.ts')
          text = path.read_text()
          old = '''dueEntryCount = dueEntries.length;\nselectedEntry = dueEntries[0] ?? null;\n\nconst budgetRelative = budgetDirectoryRelativePath(date);\nconst budgetPath = resolveInside(input.dataRoot, budgetRelative);\nmkdirSync(budgetPath, { recursive: true, mode: 0o700 });\ndailyReservationCountBefore = readdirSync(budgetPath)\n  .filter((name) => name.endsWith(".json"))\n  .length;\ndailyReservationCountAfter = dailyReservationCountBefore;\n\nif (selectedEntry) {\n  const reservationKey = canonicalHash({\n    authorizationId: input.authorization.authorizationId,\n    raceIdentity: selectedEntry.raceIdentity,\n    checkpointLabel: selectedEntry.checkpointLabel,\n    targetCaptureAt: selectedEntry.targetCaptureAt,\n  });\n  reservationPath = `${budgetRelative}/${reservationKey}.json`;\n  const reservationAbsolute = resolveInside(input.dataRoot, reservationPath);\n  let reservationCreated = false;\n  if (!existsSync(reservationAbsolute)) {\n    if (dailyReservationCountBefore >= input.authorization.maxRequestsPerDay) {\n      blockers.push("DAILY_REQUEST_BUDGET_EXHAUSTED");\n    } else {\n      const reservation: N2TrifectaLocalCaptureReservation = {\n        reservationVersion: N2_TRIFECTA_LOCAL_CAPTURE_RESERVATION_VERSION,\n        authorizationId: input.authorization.authorizationId,\n        date,\n        venueCode: selectedEntry.venueCode,\n        raceIdentity: selectedEntry.raceIdentity,\n        checkpointLabel: selectedEntry.checkpointLabel,\n        targetCaptureAt: selectedEntry.targetCaptureAt,\n        reservationKey,\n        reservedAt: input.now,\n        networkRequestCeiling: 1,\n      };\n      try {\n        exclusiveWrite(\n          reservationAbsolute,\n          `${JSON.stringify(reservation, null, 2)}\n`,\n        );\n        reservationCreated = true;\n        dailyReservationCountAfter += 1;\n      } catch (error) {\n        if (!isAlreadyExistsError(error)) throw error;\n      }\n    }\n  }\n\n  if (reservationCreated) {\n'''
          new = '''dueEntryCount = dueEntries.length;\n\nconst budgetRelative = budgetDirectoryRelativePath(date);\nconst budgetPath = resolveInside(input.dataRoot, budgetRelative);\nmkdirSync(budgetPath, { recursive: true, mode: 0o700 });\ndailyReservationCountBefore = readdirSync(budgetPath)\n  .filter((name) => name.endsWith(".json"))\n  .length;\ndailyReservationCountAfter = dailyReservationCountBefore;\n\nlet reservationCreated = false;\nfor (const candidate of dueEntries) {\n  const reservationKey = canonicalHash({\n    authorizationId: input.authorization.authorizationId,\n    raceIdentity: candidate.raceIdentity,\n    checkpointLabel: candidate.checkpointLabel,\n    targetCaptureAt: candidate.targetCaptureAt,\n  });\n  const candidateReservationPath = `${budgetRelative}/${reservationKey}.json`;\n  const reservationAbsolute = resolveInside(input.dataRoot, candidateReservationPath);\n  if (existsSync(reservationAbsolute)) continue;\n  if (dailyReservationCountBefore >= input.authorization.maxRequestsPerDay) {\n    blockers.push("DAILY_REQUEST_BUDGET_EXHAUSTED");\n    break;\n  }\n  const reservation: N2TrifectaLocalCaptureReservation = {\n    reservationVersion: N2_TRIFECTA_LOCAL_CAPTURE_RESERVATION_VERSION,\n    authorizationId: input.authorization.authorizationId,\n    date,\n    venueCode: candidate.venueCode,\n    raceIdentity: candidate.raceIdentity,\n    checkpointLabel: candidate.checkpointLabel,\n    targetCaptureAt: candidate.targetCaptureAt,\n    reservationKey,\n    reservedAt: input.now,\n    networkRequestCeiling: 1,\n  };\n  try {\n    exclusiveWrite(\n      reservationAbsolute,\n      `${JSON.stringify(reservation, null, 2)}\n`,\n    );\n    selectedEntry = candidate;\n    reservationPath = candidateReservationPath;\n    reservationCreated = true;\n    dailyReservationCountAfter += 1;\n    break;\n  } catch (error) {\n    if (!isAlreadyExistsError(error)) throw error;\n    // Another local tick won the exclusive reservation race. Continue to the\n    // next unreserved due checkpoint instead of starving it for this tick.\n  }\n}\n\nif (reservationCreated && selectedEntry) {\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected reservation selection anchor once, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused tests
        run: |
          npm ci
          npm run fable:restore
          node --test --import tsx \
            src/research-replay/n2TrifectaReservedDueSelection.test.ts \
            src/research-replay/n2TrifectaLocalCaptureService.test.ts \
            src/research-replay/n2TrifectaPrivateDailyPlanIntegration.test.ts
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/n2-skip-reserved-due-apply.yml
          git add src/research-replay/n2TrifectaLocalCaptureService.ts
          git commit -m "fix(research): skip reserved due checkpoints"
          git push origin HEAD:fix/n2-trifecta-skip-reserved-due-checkpoints

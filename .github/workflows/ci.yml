name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check data files are not committed
        run: |
          if git ls-files | grep -E '^data/.*(\.sqlite|\.sqlite-wal|\.sqlite-shm|raw|normalized|logs)'; then
            echo "data files must not be committed"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

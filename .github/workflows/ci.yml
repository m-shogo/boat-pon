name: CI

# 撤退後の最小構成（2026-10-15〜）: 型チェック・テスト・画面のビルドだけを回す。
# 研究用のワークフロー（intent dispatch・N2・公開ダッシュボードのデプロイなど）は外した。
# 外す前の状態はタグ archive/before-minimal-20261015 にある。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check data files are not committed
        run: |
          if git ls-files | grep -E '^data/.*(\.sqlite|\.sqlite-wal|\.sqlite-shm|raw|normalized|logs)'; then
            echo "data files must not be committed"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

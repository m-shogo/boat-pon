name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore Fable
        run: npm run fable:restore

      - name: Install
        run: npm ci

      - name: Check data files are not committed
        run: |
          if git ls-files | grep -E '^data/.*(\.sqlite|\.sqlite-wal|\.sqlite-shm|raw|normalized|logs)'; then
            echo "data files must not be committed"
            exit 1
          fi

      - name: Verify product/public one-way boundaries
        run: node scripts/verify-product-boundaries.mjs

      - name: Verify BUY/LINE learning boundaries
        run: node scripts/verify-buy-line-learning-boundaries.mjs

      - name: Test
        run: npm test

      - name: Verify Research Replay golden fixture
        run: npm run research:golden:verify

      - name: Verify Research Replay rollout readiness
        run: |
          npm run research:approval:record -- \
            --event=grant \
            --root=/tmp/boat-pon-f0r-ci \
            --sidecar=/tmp/boat-pon-f0r-ci/tmp/research-replay-dry-run.sqlite \
            --approval-id=ci-simulated-f0r-approval \
            --scope=F0-R_START_AND_SIDECAR_ROLLOUT \
            --source=github-actions-simulated \
            --reference=ci-f0r-readiness \
            --target-stage=F0-R \
            --target-schema=f0r.2.0 \
            --target-contract=f0r-approval-v2 \
            --approved-at=2026-07-24T00:00:00.000Z \
            --approval-mode=simulated
          npm run research:rollout:dry-run -- --root=/tmp/boat-pon-f0r-ci

      - name: Build
        run: npm run build

  research-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Research governance check (schema/lineage/clean-room/holdout/separation/production-isolation)
        run: npm run research:governance-check
      - name: Secret scan (research + governance config)
        run: |
          if git grep -nE 'ghp_[0-9A-Za-z]{20}|github_pat_[0-9A-Za-z_]{20}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10}' -- 'src/research/**' 'config/research-governance/**' 'research/**' 'scripts/research-governance-check.ts'; then
            echo "::error::secret-like token found under research paths"; exit 1
          fi
          echo "no secrets under research paths"
      - name: No large DB/raw/model artifact under research
        run: |
          if git ls-files 'research/**' 'config/research-governance/**' | grep -E '\.(sqlite|sqlite-.*|duckdb|parquet|lzh|zip|bin|model)$'; then
            echo "::error::large/binary artifact tracked under research"; exit 1
          fi
          echo "no large artifacts under research"
      - name: No production/BUY connection in research code
        run: |
          # executorSdk（guard 定義本体）と test は marker 文字列を正当に含むため除外する。
          if git grep -nE 'app_settings|auto_vote|auto_purchase|production_writer|live_odds_writer' -- 'src/research/**' ':!src/research/governance/executorSdk.ts' ':!src/research/governance/executorSdk.test.ts'; then
            echo "::error::research code references production/BUY markers"; exit 1
          fi
          echo "research code has no production/BUY connection"

  temporary-live-audit-research-durable-knowledge:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/live-audit-research-durable-knowledge-6692f25'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout audited scanner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Checkout automation state branch read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/boat-pon-research
          rm -rf /tmp/boat-pon-automation-state
          git worktree add --detach /tmp/boat-pon-automation-state origin/automation/boat-pon-research
          test -z "$(git -C /tmp/boat-pon-automation-state status --porcelain)"
          echo "automation_state_sha=$(git -C /tmp/boat-pon-automation-state rev-parse HEAD)"
      - name: Audit durable knowledge without changing state
        shell: bash
        run: |
          set -euo pipefail
          before_sha="$(git -C /tmp/boat-pon-automation-state rev-parse HEAD)"
          before_status="$(git -C /tmp/boat-pon-automation-state status --porcelain)"
          set +e
          node --import tsx scripts/audit-research-durable-knowledge-completeness.ts \
            --repo-root=/tmp/boat-pon-automation-state \
            --generated-at=2026-08-07T07:05:00.000Z > /tmp/durable-audit.json
          audit_rc=$?
          set -e
          if [ "$audit_rc" -ne 0 ] && [ "$audit_rc" -ne 3 ]; then
            echo "unexpected audit exit code: $audit_rc"
            exit "$audit_rc"
          fi
          after_sha="$(git -C /tmp/boat-pon-automation-state rev-parse HEAD)"
          after_status="$(git -C /tmp/boat-pon-automation-state status --porcelain)"
          test "$before_sha" = "$after_sha"
          test "$before_status" = "$after_status"
          test -z "$after_status"
          python3 - <<'PY'
          import json
          p = '/tmp/durable-audit.json'
          d = json.load(open(p))
          summary_keys = [
              'summaryVersion','reportVersion','evidenceRole','generatedAt','status','historyFileCount','assessedRunCount',
              'passCount','conditionalCount','blockedCount','failedCount','persistedDryRunCount','durableCompleteCount',
              'strongDurableCompleteCount','incompleteCount','invalidHistoryCount','passWithDurableOutputsCount',
              'passNoChangeHistoryCount','nonPassDurableHistoryCount','missingOutputReferenceCount','invalidOutputReferenceCount',
              'mutableSupersededReferenceCount','registryOutputCount','currentOutputDigestMatchCount','earliestCompletedAt',
              'latestCompletedAt','taskTypeCounts','classificationCounts','automaticPromotionAuthorized','currentBuyConnectionAuthorized',
              'lineConnectionAuthorized','publicPublishAuthorized','databaseWriteAuthorized','automatedBettingAuthorized',
              'productionApplyAuthorized','outputDigest'
          ]
          out = {k: d.get(k) for k in summary_keys}
          out['problemRuns'] = [
              {
                  'runId': r.get('runId'),
                  'taskId': r.get('taskId'),
                  'taskType': r.get('taskType'),
                  'result': r.get('result'),
                  'classification': r.get('classification'),
                  'durableComplete': r.get('durableComplete'),
                  'strongDurableComplete': r.get('strongDurableComplete'),
                  'issues': r.get('issues'),
                  'warnings': r.get('warnings'),
                  'outputs': [
                      {
                          'relativePath': o.get('relativePath'),
                          'rootClass': o.get('rootClass'),
                          'integrity': o.get('integrity'),
                          'exists': o.get('exists'),
                          'complete': o.get('complete'),
                          'issues': o.get('issues'),
                          'warnings': o.get('warnings'),
                      }
                      for o in r.get('outputs', []) if (not o.get('complete')) or o.get('warnings')
                  ],
              }
              for r in d.get('runs', []) if (not r.get('strongDurableComplete')) or r.get('issues') or r.get('warnings')
          ]
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

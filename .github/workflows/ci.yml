# validation sync
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore Fable
        run: npm run fable:restore

      - name: Install
        run: npm ci

      - name: Check data files are not committed
        run: |
          if git ls-files | grep -E '^data/.*(\.sqlite|\.sqlite-wal|\.sqlite-shm|raw|normalized|logs)'; then
            echo "data files must not be committed"
            exit 1
          fi

      - name: Verify product/public one-way boundaries
        run: node scripts/verify-product-boundaries.mjs

      - name: Verify BUY/LINE learning boundaries
        run: node scripts/verify-buy-line-learning-boundaries.mjs

      - name: Test
        run: npm test

      - name: Verify Research Replay golden fixture
        run: npm run research:golden:verify

      - name: Verify Research Replay rollout readiness
        run: |
          npm run research:approval:record -- \
            --event=grant \
            --root=/tmp/boat-pon-f0r-ci \
            --sidecar=/tmp/boat-pon-f0r-ci/tmp/research-replay-dry-run.sqlite \
            --approval-id=ci-simulated-f0r-approval \
            --scope=F0-R_START_AND_SIDECAR_ROLLOUT \
            --source=github-actions-simulated \
            --reference=ci-f0r-readiness \
            --target-stage=F0-R \
            --target-schema=f0r.2.0 \
            --target-contract=f0r-approval-v2 \
            --approved-at=2026-07-24T00:00:00.000Z \
            --approval-mode=simulated
          npm run research:rollout:dry-run -- --root=/tmp/boat-pon-f0r-ci

      - name: Build
        run: npm run build

  research-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Research governance check (schema/lineage/clean-room/holdout/separation/production-isolation)
        run: npm run research:governance-check
      - name: Secret scan (research + governance config)
        run: |
          if git grep -nE 'ghp_[0-9A-Za-z]{20}|github_pat_[0-9A-Za-z_]{20}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10}' -- 'src/research/**' 'config/research-governance/**' 'research/**' 'scripts/research-governance-check.ts'; then
            echo "::error::secret-like token found under research paths"; exit 1
          fi
          echo "no secrets under research paths"
      - name: No large DB/raw/model artifact under research
        run: |
          if git ls-files 'research/**' 'config/research-governance/**' | grep -E '\.(sqlite|sqlite-.*|duckdb|parquet|lzh|zip|bin|model)$'; then
            echo "::error::large/binary artifact tracked under research"; exit 1
          fi
          echo "no large artifacts under research"
      - name: No production/BUY connection in research code
        run: |
          # executorSdk（guard 定義本体）と test は marker 文字列を正当に含むため除外する。
          if git grep -nE 'app_settings|auto_vote|auto_purchase|production_writer|live_odds_writer' -- 'src/research/**' ':!src/research/governance/executorSdk.ts' ':!src/research/governance/executorSdk.test.ts'; then
            echo "::error::research code references production/BUY markers"; exit 1
          fi
          echo "research code has no production/BUY connection"

  temporary-apply-immutable-run-outputs:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/research-immutable-run-outputs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: feat/research-immutable-run-outputs
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch scanner and runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/automation/researchDurableKnowledgeCompleteness.ts')
          s = scanner.read_text()
          old = '''export type ResearchDurableOutputIntegrity =
  | "REGISTRY_SELF_DIGEST_VERIFIED"
'''
          new = '''export type ResearchDurableOutputIntegrity =
  | "RETAINED_CONTENT_DIGEST_VERIFIED"
  | "REGISTRY_SELF_DIGEST_VERIFIED"
'''
          if old not in s: raise SystemExit('integrity union anchor missing')
          s = s.replace(old, new, 1)
          old = '  rootClass: "REPORT" | "REGISTRY" | "CONTROL";\n'
          new = '  rootClass: "REPORT" | "REGISTRY" | "CONTROL" | "RETAINED";\n'
          if old not in s: raise SystemExit('rootClass anchor missing')
          s = s.replace(old, new, 1)
          old = '''function outputRootClass(relativePath: string): ResearchDurableOutputAssessment["rootClass"] {
  if (relativePath.startsWith("research/registries/")) return "REGISTRY";
'''
          new = '''function outputRootClass(relativePath: string): ResearchDurableOutputAssessment["rootClass"] {
  if (relativePath.startsWith("reports/automation/retained-outputs/")) return "RETAINED";
  if (relativePath.startsWith("research/registries/")) return "REGISTRY";
'''
          if old not in s: raise SystemExit('root classifier anchor missing')
          s = s.replace(old, new, 1)
          anchor = '''  const text = readFileSync(absolutePath, "utf8");
  const contentDigest = sha256Text(text);
  if (!input.relativePath.endsWith(".json")) {
'''
          insert = '''  const text = readFileSync(absolutePath, "utf8");
  const contentDigest = sha256Text(text);
  if (rootClass === "RETAINED") {
    const retainedMatch = input.relativePath.match(
      /^reports\\/automation\\/retained-outputs\\/[0-9A-Za-z._-]+\\/([0-9a-f]{64})-[^/]+$/u,
    );
    const expectedContentDigest = retainedMatch?.[1] ?? null;
    if (expectedContentDigest == null) {
      return {
        relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true,
        bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null,
        complete: false, issues: ["DURABLE_RETAINED_PATH_INVALID"], warnings,
      };
    }
    if (expectedContentDigest !== contentDigest) {
      return {
        relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true,
        bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null,
        complete: false, issues: ["DURABLE_RETAINED_CONTENT_DIGEST_MISMATCH"], warnings,
      };
    }
    let retainedEmbeddedDigest: string | null = null;
    if (input.relativePath.endsWith(".json")) {
      try {
        const retainedValue = objectValue(JSON.parse(text) as unknown);
        if (!retainedValue) throw new Error("not object");
        retainedEmbeddedDigest = typeof retainedValue.outputDigest === "string" && SHA256_RE.test(retainedValue.outputDigest)
          ? retainedValue.outputDigest
          : null;
      } catch {
        return {
          relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true,
          bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null,
          complete: false, issues: ["DURABLE_OUTPUT_JSON_INVALID"], warnings,
        };
      }
    }
    if (retainedEmbeddedDigest != null && retainedEmbeddedDigest !== input.historyOutputDigest) {
      return {
        relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true,
        bytes: stat.size, contentDigest, embeddedDigest: retainedEmbeddedDigest, historyDigestMatchesEmbedded: false,
        complete: false, issues: ["DURABLE_RETAINED_HISTORY_DIGEST_MISMATCH"], warnings,
      };
    }
    return {
      relativePath: input.relativePath, rootClass, integrity: "RETAINED_CONTENT_DIGEST_VERIFIED",
      exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: retainedEmbeddedDigest,
      historyDigestMatchesEmbedded: retainedEmbeddedDigest == null ? null : true,
      complete: true, issues, warnings,
    };
  }
  if (!input.relativePath.endsWith(".json")) {
'''
          if anchor not in s: raise SystemExit('retained assessment anchor missing')
          s = s.replace(anchor, insert, 1)
          scanner.write_text(s)

          runner = Path('scripts/run-intent-task.ts')
          r = runner.read_text()
          import_anchor = 'import { EXECUTOR_REGISTRY_VERSION, resolveExecutor, type ExecutorResult } from "../src/automation/taskExecutors";\n'
          import_new = import_anchor + 'import { retainExecutorOutputs } from "../src/automation/researchRetainedOutputs";\n'
          if import_anchor not in r: raise SystemExit('runner import anchor missing')
          r = r.replace(import_anchor, import_new, 1)
          result_anchor = '''  const attempts = state.tasks[task.taskId]?.attemptCount ?? 1;
'''
          retention_block = '''  let historyOutputs: string[];
  try {
    historyOutputs = retainExecutorOutputs({ repoRoot: root, runId, outputPaths: exec.outputs }).historyOutputs;
  } catch {
    const retentionBlock = "DURABLE_OUTPUT_RETENTION_FAILED";
    updateState(task.taskId, { status: "BLOCKED", lastFailure: { code: retentionBlock, at: nowIso() } });
    const retentionEvidencePath = `reports/automation/history/${runId}-${task.taskId}.json`;
    writeJsonAtomic(join(HISTORY_DIR, `${runId}-${task.taskId}.json`), {
      runId, requestId: request.requestId, intentId, taskId: task.taskId, taskType: task.taskType,
      safetyLevel: request.safetyLevel, executorVersion: exec.executorVersion, executed: true, result: "BLOCKED",
      blocks: [retentionBlock], outputs: exec.outputs, outputDigest: exec.outputDigest,
      summary: { retentionStatus: "BLOCKED", executorResult: exec.result }, authoritySha: request.authoritySha,
      idempotencyKey, startedAt: new Date(startedMs).toISOString(), completedAt: nowIso(), elapsedMs: Date.now() - startedMs,
    });
    appendLedgers(intentId, request.requestId, "BLOCKED", idempotencyKey, retentionEvidencePath);
    finish("BLOCKED", 3, {
      lastRequestId: request.requestId, lastIntentId: intentId, lastTaskId: task.taskId,
      authoritySha: request.authoritySha, stateVersion: state.stateVersion, stateDigest: computeStateDigest(state),
      blocks: [retentionBlock], elapsedMs: Date.now() - startedMs, evidencePath: retentionEvidencePath,
      outputs: exec.outputs, outputDigest: exec.outputDigest, taskStatus: "BLOCKED",
      nextCandidate: pickNext(mergeCatalogAndState(catalog, state)),
    });
  }

  const attempts = state.tasks[task.taskId]?.attemptCount ?? 1;
'''
          if result_anchor not in r: raise SystemExit('runner retention insertion anchor missing')
          r = r.replace(result_anchor, retention_block, 1)
          old = '    evidenceLinks: [...new Set([...(state.tasks[task.taskId]?.evidenceLinks ?? []), evidencePath, ...exec.outputs])],\n'
          new = '    evidenceLinks: [...new Set([...(state.tasks[task.taskId]?.evidenceLinks ?? []), evidencePath, ...exec.outputs, ...historyOutputs])],\n'
          if old not in r: raise SystemExit('runner evidenceLinks anchor missing')
          r = r.replace(old, new, 1)
          old = '    executorVersion: exec.executorVersion, executed: true, result: exec.result, blocks: exec.blocks, outputs: exec.outputs,\n'
          new = '    executorVersion: exec.executorVersion, executed: true, result: exec.result, blocks: exec.blocks, outputs: historyOutputs,\n'
          if old not in r: raise SystemExit('runner history outputs anchor missing')
          r = r.replace(old, new, 1)
          old = '    blocks: exec.blocks, elapsedMs: Date.now() - startedMs, evidencePath, outputs: exec.outputs, outputDigest: exec.outputDigest,\n'
          new = '    blocks: exec.blocks, elapsedMs: Date.now() - startedMs, evidencePath, outputs: historyOutputs, outputDigest: exec.outputDigest,\n'
          if old not in r: raise SystemExit('runner finish outputs anchor missing')
          r = r.replace(old, new, 1)
          runner.write_text(r)
          PY
      - name: Verify immutable output focused tests
        run: |
          node --test --import tsx src/automation/researchRetainedOutputs.test.ts
          node --test --import tsx src/automation/researchRetainedOutputScanner.test.ts
          node --test --import tsx src/automation/researchRetainedOutputsBoundary.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompleteness.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompletenessBoundary.test.ts
          npm run typecheck
      - name: Restore standard CI and commit validated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation/researchDurableKnowledgeCompleteness.ts scripts/run-intent-task.ts .github/workflows/ci.yml
          git commit -m "feat(research): retain immutable run outputs"
          git push origin HEAD:feat/research-immutable-run-outputs

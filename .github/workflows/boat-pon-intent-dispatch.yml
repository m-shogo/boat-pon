# boat-pon intent dispatch — ChatGPT Scheduled Task の正式経路（hash 不要）。
#
# ChatGPT が automation/requests/intents/INTENT-*.json を main へ 1 件 commit すると、
# ubuntu guard が検証して canonical request を生成し、self-hosted runner が 1 task だけ実行する。
# `on.schedule` は使用しない（禁止）。workflow は自分自身を再 dispatch しない。1 dispatch = 1 task。
name: boat-pon intent dispatch (one-shot)

on:
  push:
    branches: [main]
    paths:
      - "automation/requests/intents/*.json"

permissions:
  contents: read

concurrency:
  group: boat-pon-local-research
  cancel-in-progress: false

jobs:
  guard:
    # self-hosted へ到達する前に ubuntu で actor / intent / catalog / branch-state を検証し、
    # GitHub 側で canonical request を生成する（ChatGPT に hash を作らせない）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
      intent_id: ${{ steps.guard.outputs.intent_id }}
      request_id: ${{ steps.guard.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack + install (guard needs tsx)
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false
      - id: guard
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.username }}
          COMMIT_COMMITTER: ${{ github.event.head_commit.committer.username }}
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: pnpm automation:guard-intent
      - name: Upload canonical request (artifact for runner)
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-request
          path: canonical-request.json
          retention-days: 3
          if-no-files-found: error

  run-one-task:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    permissions:
      contents: write
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize control state and dataset authority from automation branch
        id: materialize_authority
        env:
          BRANCH: automation/boat-pon-research
        run: |
          set -euo pipefail
          TRUSTED_GIT_BIN="$(command -v git)"
          TRUSTED_NODE_BIN="$(command -v node)"
          case "$TRUSTED_GIT_BIN" in /*) ;; *) echo "::error::trusted git path is not absolute"; exit 1 ;; esac
          case "$TRUSTED_NODE_BIN" in /*) ;; *) echo "::error::trusted node path is not absolute"; exit 1 ;; esac
          test -x "$TRUSTED_GIT_BIN"
          test -x "$TRUSTED_NODE_BIN"
          TRUSTED_GIT_SHA256="$(/usr/bin/shasum -a 256 "$TRUSTED_GIT_BIN" | /usr/bin/awk '{print $1}')"
          TRUSTED_NODE_SHA256="$(/usr/bin/shasum -a 256 "$TRUSTED_NODE_BIN" | /usr/bin/awk '{print $1}')"
          if ! [[ "$TRUSTED_GIT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::trusted git digest invalid"; exit 1; fi
          if ! [[ "$TRUSTED_NODE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::trusted node digest invalid"; exit 1; fi
          echo "trusted_git_bin=$TRUSTED_GIT_BIN" >> "$GITHUB_OUTPUT"
          echo "trusted_node_bin=$TRUSTED_NODE_BIN" >> "$GITHUB_OUTPUT"
          echo "trusted_git_sha256=$TRUSTED_GIT_SHA256" >> "$GITHUB_OUTPUT"
          echo "trusted_node_sha256=$TRUSTED_NODE_SHA256" >> "$GITHUB_OUTPUT"

          # post-task persistence helper は task 実行前の exact bytes/mode を step output に固定する。
          # task-writable worktree / RUNNER_TEMP を復元時の authority として信用しない。
          capture_helper() {
            key="$1"
            path="$2"
            digest="$(/usr/bin/shasum -a 256 "$path" | /usr/bin/awk '{print $1}')"
            mode="$(/usr/bin/stat -f '%Lp' "$path")"
            encoded="$(/usr/bin/base64 < "$path" | /usr/bin/tr -d '\n')"
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::trusted helper digest invalid: $path"; exit 1; fi
            if ! [[ "$mode" =~ ^[0-7]{3,4}$ ]]; then echo "::error::trusted helper mode invalid: $path"; exit 1; fi
            if [ -z "$encoded" ]; then echo "::error::trusted helper bytes missing: $path"; exit 1; fi
            echo "${key}_sha256=$digest" >> "$GITHUB_OUTPUT"
            echo "${key}_mode=$mode" >> "$GITHUB_OUTPUT"
            echo "${key}_b64=$encoded" >> "$GITHUB_OUTPUT"
          }
          capture_helper "commit_script" "scripts/automation-commit.sh"
          capture_helper "retained_gate_mjs" "scripts/check-research-retained-output-commit.mjs"
          capture_helper "retained_gate_ts" "scripts/check-research-retained-output-commit.ts"
          capture_helper "retained_gate_core" "src/automation/researchRetainedOutputCommitGate.ts"

          "$TRUSTED_GIT_BIN" fetch origin "$BRANCH" --quiet
          # CAS authority は task-writable worktree ではなく、この trusted step の output に固定する。
          BASE_SHA="$("$TRUSTED_GIT_BIN" rev-parse "origin/$BRANCH")"
          echo "branch_base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p automation/control "$RUNNER_TEMP"
          for f in task-queue-state processed-intents processed-requests current-run planner-candidates; do
            "$TRUSTED_GIT_BIN" show "origin/$BRANCH:automation/control/$f.json" > "automation/control/$f.json"
          done
          # N2-011以降はN2-010が固定したmanifest identityを入力正本として使う。
          # repo外へ置き、dirty-tree guardを緩めない。executor側でversion/digest/holdout/readOnlyを再検証する。
          "$TRUSTED_GIT_BIN" show "origin/$BRANCH:reports/n2/n2-dataset-manifest.json" > "$RUNNER_TEMP/n2-dataset-manifest.json"
          ls -1 automation/control
          test -s "$RUNNER_TEMP/n2-dataset-manifest.json"

      - name: Download canonical request
        uses: actions/download-artifact@v4
        with:
          name: canonical-request

      - name: Run exactly one task
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          INTENT_ID: ${{ needs.guard.outputs.intent_id }}
          BOAT_PON_N2_DATASET_MANIFEST_PATH: ${{ runner.temp }}/n2-dataset-manifest.json
        run: |
          set -euo pipefail
          node scripts/assert-canonical-request.mjs canonical-request.json
          pnpm automation:intent-task -- --request=canonical-request.json --intent-id="$INTENT_ID"

      - name: Show status
        if: always()
        run: cat reports/automation/current-status.json || true

      - name: Restore trusted automation commit helpers
        id: restore_commit_helper
        if: always()
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          DYLD_FALLBACK_LIBRARY_PATH: ""
          DYLD_FALLBACK_FRAMEWORK_PATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          PERL5OPT: ""
          PERL5LIB: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          COMMIT_SCRIPT_B64: ${{ steps.materialize_authority.outputs.commit_script_b64 }}
          COMMIT_SCRIPT_SHA256: ${{ steps.materialize_authority.outputs.commit_script_sha256 }}
          COMMIT_SCRIPT_MODE: ${{ steps.materialize_authority.outputs.commit_script_mode }}
          RETAINED_GATE_MJS_B64: ${{ steps.materialize_authority.outputs.retained_gate_mjs_b64 }}
          RETAINED_GATE_MJS_SHA256: ${{ steps.materialize_authority.outputs.retained_gate_mjs_sha256 }}
          RETAINED_GATE_MJS_MODE: ${{ steps.materialize_authority.outputs.retained_gate_mjs_mode }}
          RETAINED_GATE_TS_B64: ${{ steps.materialize_authority.outputs.retained_gate_ts_b64 }}
          RETAINED_GATE_TS_SHA256: ${{ steps.materialize_authority.outputs.retained_gate_ts_sha256 }}
          RETAINED_GATE_TS_MODE: ${{ steps.materialize_authority.outputs.retained_gate_ts_mode }}
          RETAINED_GATE_CORE_B64: ${{ steps.materialize_authority.outputs.retained_gate_core_b64 }}
          RETAINED_GATE_CORE_SHA256: ${{ steps.materialize_authority.outputs.retained_gate_core_sha256 }}
          RETAINED_GATE_CORE_MODE: ${{ steps.materialize_authority.outputs.retained_gate_core_mode }}
        run: |
          set -euo pipefail
          umask 077
          while IFS= read -r env_name; do
            case "$env_name" in
              GIT_*|DYLD_*) unset "$env_name" ;;
            esac
          done < <(compgen -e)
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy

          for dir in scripts src src/automation; do
            if [ ! -d "$dir" ] || [ -L "$dir" ]; then
              echo "::error::trusted helper parent is not a real directory: $dir"
              exit 1
            fi
          done

          restore_helper() {
            path="$1"
            encoded="$2"
            expected_digest="$3"
            expected_mode="$4"
            if ! [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::trusted helper digest output invalid: $path"; exit 1; fi
            if ! [[ "$expected_mode" =~ ^[0-7]{3,4}$ ]]; then echo "::error::trusted helper mode output invalid: $path"; exit 1; fi
            if [ -z "$encoded" ]; then echo "::error::trusted helper byte output missing: $path"; exit 1; fi
            tmp="$(/usr/bin/mktemp "$RUNNER_TEMP/boat-pon-helper.XXXXXX")"
            if ! printf '%s' "$encoded" | /usr/bin/base64 -D > "$tmp"; then
              /bin/rm -f "$tmp"
              echo "::error::trusted helper decode failed: $path"
              exit 1
            fi
            actual_digest="$(/usr/bin/shasum -a 256 "$tmp" | /usr/bin/awk '{print $1}')"
            if [ "$actual_digest" != "$expected_digest" ]; then
              /bin/rm -f "$tmp"
              echo "::error::trusted helper bytes changed after task execution: $path"
              exit 1
            fi
            /bin/chmod "$expected_mode" "$tmp"
            /bin/mv -f "$tmp" "$path"
          }

          restore_helper "scripts/automation-commit.sh" "$COMMIT_SCRIPT_B64" "$COMMIT_SCRIPT_SHA256" "$COMMIT_SCRIPT_MODE"
          restore_helper "scripts/check-research-retained-output-commit.mjs" "$RETAINED_GATE_MJS_B64" "$RETAINED_GATE_MJS_SHA256" "$RETAINED_GATE_MJS_MODE"
          restore_helper "scripts/check-research-retained-output-commit.ts" "$RETAINED_GATE_TS_B64" "$RETAINED_GATE_TS_SHA256" "$RETAINED_GATE_TS_MODE"
          restore_helper "src/automation/researchRetainedOutputCommitGate.ts" "$RETAINED_GATE_CORE_B64" "$RETAINED_GATE_CORE_SHA256" "$RETAINED_GATE_CORE_MODE"

      - name: Commit control state + results to automation branch
        if: always() && steps.restore_commit_helper.outcome == 'success'
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          DYLD_FALLBACK_LIBRARY_PATH: ""
          DYLD_FALLBACK_FRAMEWORK_PATH: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          PERL5OPT: ""
          PERL5LIB: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
          RUN_ID: ${{ github.run_id }}
          EXPECTED_AUTOMATION_BRANCH_BASE: ${{ steps.materialize_authority.outputs.branch_base_sha }}
          TRUSTED_GIT_BIN: ${{ steps.materialize_authority.outputs.trusted_git_bin }}
          TRUSTED_NODE_BIN: ${{ steps.materialize_authority.outputs.trusted_node_bin }}
          TRUSTED_GIT_SHA256: ${{ steps.materialize_authority.outputs.trusted_git_sha256 }}
          TRUSTED_NODE_SHA256: ${{ steps.materialize_authority.outputs.trusted_node_sha256 }}
          BOAT_PON_AUTOMATION_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_GIT_SHA256="$(/usr/bin/shasum -a 256 "$TRUSTED_GIT_BIN" | /usr/bin/awk '{print $1}')"
          CURRENT_NODE_SHA256="$(/usr/bin/shasum -a 256 "$TRUSTED_NODE_BIN" | /usr/bin/awk '{print $1}')"
          if [ "$CURRENT_GIT_SHA256" != "$TRUSTED_GIT_SHA256" ]; then echo "::error::trusted git binary changed after task execution"; exit 1; fi
          if [ "$CURRENT_NODE_SHA256" != "$TRUSTED_NODE_SHA256" ]; then echo "::error::trusted node binary changed after task execution"; exit 1; fi
          exec /bin/bash scripts/automation-commit.sh
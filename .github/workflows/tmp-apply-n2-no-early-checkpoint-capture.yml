name: Temporary apply no-early odds checkpoint capture

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-apply-n2-no-early-checkpoint-capture.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-trifecta-no-early-checkpoint-capture
          fetch-depth: 0
      - name: Apply exact constant change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/research-replay/n2TrifectaPrivateCaptureExecutor.ts')
          text = p.read_text()
          old = 'export const N2_TRIFECTA_PRIVATE_CAPTURE_EARLY_WINDOW_SECONDS = 60;'
          new = 'export const N2_TRIFECTA_PRIVATE_CAPTURE_EARLY_WINDOW_SECONDS = 0;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old constant, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/tmp-apply-n2-no-early-checkpoint-capture.yml
          git diff --check
          git diff -- src/research-replay/n2TrifectaPrivateCaptureExecutor.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research-replay/n2TrifectaPrivateCaptureExecutor.ts .github/workflows/tmp-apply-n2-no-early-checkpoint-capture.yml
          git commit -m 'fix(research): never capture odds before checkpoint target'
          git push origin HEAD:fix/n2-trifecta-no-early-checkpoint-capture

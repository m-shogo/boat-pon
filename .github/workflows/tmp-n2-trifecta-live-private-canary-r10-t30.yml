name: Temporary N2 trifecta live private canary R10 T-30

on:
  push:
    branches:
      - agent/n2-trifecta-live-private-canary-20260806-19
    paths:
      - .github/workflows/tmp-n2-trifecta-live-private-canary-r10-t30.yml
      - reports/n2/approvals/n2-trifecta-private-capture-20260806-19-r10-t30.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-n2-trifecta-live-private-canary-r10-t30.yml
      - reports/n2/approvals/n2-trifecta-private-capture-20260806-19-r10-t30.json

permissions:
  contents: read

concurrency:
  group: n2-trifecta-live-private-canary-20260806-19-r10-t30
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-live-private-canary-20260806-19
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve private root and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="$(node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const policy = JSON.parse(fs.readFileSync('config/research-automation-policy.json', 'utf8'));
          console.log(path.resolve(String(policy.dataRoot ?? policy.repoPath ?? process.cwd())));
          NODE
          )"
          echo "DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"
          echo "PLAN_PATH=$GITHUB_WORKSPACE/reports/n2/n2-trifecta-private-capture-plan-20260806-19.json" >> "$GITHUB_ENV"
          echo "APPROVAL_PATH=$GITHUB_WORKSPACE/reports/n2/approvals/n2-trifecta-private-capture-20260806-19-r10-t30.json" >> "$GITHUB_ENV"
          echo "REPORT_PATH=$RUNNER_TEMP/n2-trifecta-live-private-canary-r10-t30-report.json" >> "$GITHUB_ENV"
          echo "SUMMARY_PATH=$RUNNER_TEMP/n2-trifecta-live-private-canary-r10-t30-summary.json" >> "$GITHUB_ENV"
          echo "DB_BEFORE_PATH=$RUNNER_TEMP/n2-trifecta-live-private-canary-r10-t30-db-before.json" >> "$GITHUB_ENV"
          echo "DB_AFTER_PATH=$RUNNER_TEMP/n2-trifecta-live-private-canary-r10-t30-db-after.json" >> "$GITHUB_ENV"

      - name: Record database metadata before
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function meta(file) {
            const wal = `${file}-wal`;
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            return {
              relativePath: path.relative(process.env.DATA_ROOT, file),
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          fs.writeFileSync(process.env.DB_BEFORE_PATH, `${JSON.stringify({
            primary: meta(path.join(process.env.DATA_ROOT, 'data/boat.sqlite')),
            sidecar: meta(path.join(process.env.DATA_ROOT, 'data/research-replay.sqlite')),
          }, null, 2)}\n`);
          NODE

      - name: Wait for 下関10R T-30 and execute at most one request
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          TARGET_MS=1786011420000
          NOW_MS="$(node -e 'process.stdout.write(String(Date.now()))')"
          if [ "$NOW_MS" -lt "$TARGET_MS" ]; then
            WAIT_SECONDS="$(( (TARGET_MS - NOW_MS + 999) / 1000 ))"
            echo "Sleeping ${WAIT_SECONDS}s until 下関10R T-30"
            sleep "$WAIT_SECONDS"
          fi
          set +e
          npx tsx scripts/run-n2-trifecta-private-capture.ts \
            --execute \
            --plan "$PLAN_PATH" \
            --approval "$APPROVAL_PATH" \
            --root "$DATA_ROOT" \
            --report "$REPORT_PATH"
          CODE=$?
          set -e
          echo "executor_exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Record database metadata after
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function meta(file) {
            const wal = `${file}-wal`;
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            return {
              relativePath: path.relative(process.env.DATA_ROOT, file),
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          fs.writeFileSync(process.env.DB_AFTER_PATH, `${JSON.stringify({
            primary: meta(path.join(process.env.DATA_ROOT, 'data/boat.sqlite')),
            sidecar: meta(path.join(process.env.DATA_ROOT, 'data/research-replay.sqlite')),
          }, null, 2)}\n`);
          NODE

      - name: Build sanitized evidence and enforce boundaries
        if: always()
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          EXECUTOR_EXIT_CODE: ${{ steps.execute.outputs.executor_exit_code }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = fs.existsSync(process.env.REPORT_PATH)
            ? JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'))
            : {
                status: 'BLOCKED', blockers: ['REPORT_MISSING'], manifestDigest: '870fa890ad7ae23ed75373fb1ac096b7a2bf620ea133e74bbef3220b737bec7c',
                approvalId: 'APR-N2-TRI-ODDS-user-authorized-20260806-19-r10-t30', networkRequestCount: 0,
                capturedCount: 0, blockedEvidenceCount: 0, entryResults: [], databaseWriteCount: 0,
                primaryDbWriteCount: 0, sidecarWriteCount: 0, currentBuyChanged: false, lineChanged: false,
                publicPublished: false, automatedBettingChanged: false, productionApplyExecuted: false,
              };
          const before = JSON.parse(fs.readFileSync(process.env.DB_BEFORE_PATH, 'utf8'));
          const after = JSON.parse(fs.readFileSync(process.env.DB_AFTER_PATH, 'utf8'));
          const root = path.resolve(process.env.DATA_ROOT);

          function privateEvidenceFor(raceNo, checkpointLabel) {
            const result = report.entryResults?.find((entry) =>
              entry.raceIdentity === `20260806-19-${String(raceNo).padStart(2, '0')}`
              && entry.checkpointLabel === checkpointLabel) ?? null;
            let envelopeRelativePath = result?.envelopeRelativePath ?? null;
            const markerRelativePath = `data/raw/research/trifecta-market/2026-08-06/19/${String(raceNo).padStart(2, '0')}/${checkpointLabel}/accepted.json`;
            const markerPath = path.resolve(root, markerRelativePath);
            let marker = null;
            if (!envelopeRelativePath && markerPath.startsWith(`${root}${path.sep}`) && fs.existsSync(markerPath)) {
              marker = JSON.parse(fs.readFileSync(markerPath, 'utf8'));
              envelopeRelativePath = marker.envelopeRelativePath ?? null;
            }
            if (!envelopeRelativePath) return { result: result?.result ?? null, marker, evidence: null };
            const envelopePath = path.resolve(root, envelopeRelativePath);
            if (!envelopePath.startsWith(`${root}${path.sep}`)) throw new Error('ENVELOPE_PATH_ESCAPES_PRIVATE_ROOT');
            const envelope = JSON.parse(fs.readFileSync(envelopePath, 'utf8'));
            return {
              result: result?.result ?? (marker ? 'ALREADY_ACCEPTED' : null),
              marker,
              evidence: {
                rawRelativePath: envelope.rawRelativePath,
                envelopeRelativePath: envelope.envelopeRelativePath,
                rawByteLength: envelope.response?.rawByteLength ?? null,
                rawSha256: envelope.response?.rawSha256 ?? null,
                fetchedAt: envelope.response?.fetchedAt ?? null,
                contentType: envelope.response?.contentType ?? null,
                sourceDisplayedUpdate: envelope.sourceDisplayedUpdate ?? null,
                parsedSelectionCount: envelope.parsedSelectionCount ?? null,
                unavailableSelectionCount: envelope.unavailableSelectionCount ?? null,
                rawDocumentId: envelope.rawDocumentId ?? null,
                parseRunId: envelope.parseRunId ?? null,
                proposedObservationId: envelope.proposedObservationId ?? null,
                snapshotAuditStatus: envelope.snapshotAudit?.status ?? null,
                pitStatus: envelope.snapshotAudit?.pit?.status ?? null,
                envelopeStatus: envelope.status,
                envelopeBlockers: envelope.blockers ?? [],
              },
            };
          }

          const prior9 = privateEvidenceFor(9, 'T-30');
          const target10 = privateEvidenceFor(10, 'T-30');
          const dbMetadataUnchanged = JSON.stringify(before) === JSON.stringify(after);
          const summary = {
            evidenceSchemaVersion: 'n2-trifecta-live-private-canary-r10-t30-v1',
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            validatedCommit: process.env.GITHUB_SHA,
            executorExitCode: Number(process.env.EXECUTOR_EXIT_CODE ?? -1),
            status: report.status,
            blockers: report.blockers ?? [],
            planDigest: report.manifestDigest,
            approvalId: report.approvalId,
            networkRequestCount: report.networkRequestCount,
            capturedCount: report.capturedCount,
            blockedEvidenceCount: report.blockedEvidenceCount,
            prior9RT30: prior9,
            target10RT30: target10,
            database: {
              before, after, metadataUnchanged: dbMetadataUnchanged,
              databaseWriteCount: report.databaseWriteCount,
              primaryDbWriteCount: report.primaryDbWriteCount,
              sidecarWriteCount: report.sidecarWriteCount,
            },
            currentBuyChanged: report.currentBuyChanged,
            lineChanged: report.lineChanged,
            publicPublished: report.publicPublished,
            automatedBettingChanged: report.automatedBettingChanged,
            productionApplyExecuted: report.productionApplyExecuted,
            rawUploadedAsArtifact: false,
          };
          fs.writeFileSync(process.env.SUMMARY_PATH, `${JSON.stringify(summary, null, 2)}\n`);
          const violations = [];
          if (report.networkRequestCount > 1) violations.push('NETWORK_REQUEST_CEILING_EXCEEDED');
          if (report.capturedCount > 1) violations.push('CAPTURE_COUNT_CEILING_EXCEEDED');
          if (!dbMetadataUnchanged) violations.push('DATABASE_METADATA_CHANGED');
          if (report.databaseWriteCount !== 0 || report.primaryDbWriteCount !== 0 || report.sidecarWriteCount !== 0) violations.push('DATABASE_WRITE_COUNT_NONZERO');
          if (report.currentBuyChanged || report.lineChanged || report.publicPublished || report.automatedBettingChanged || report.productionApplyExecuted) violations.push('PROTECTED_BOUNDARY_CHANGED');
          if (violations.length > 0) throw new Error(violations.join(','));
          NODE

      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-trifecta-live-private-canary-r10-t30-sanitized
          path: |
            ${{ runner.temp }}/n2-trifecta-live-private-canary-r10-t30-report.json
            ${{ runner.temp }}/n2-trifecta-live-private-canary-r10-t30-summary.json
            ${{ runner.temp }}/n2-trifecta-live-private-canary-r10-t30-db-before.json
            ${{ runner.temp }}/n2-trifecta-live-private-canary-r10-t30-db-after.json
          if-no-files-found: error
          retention-days: 7

      - name: Print sanitized disposition
        if: always()
        shell: bash
        run: cat "$SUMMARY_PATH"

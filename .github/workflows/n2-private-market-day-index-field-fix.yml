name: Normalize N2 private day index source-read boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/n2-private-market-day-index-field-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/n2-trifecta-private-market-feature-day-index
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Normalize boundary field naming
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.ts')
          text = path.read_text()
          old_type = '  rawOddsValuesRead: false;\n'
          old_core = '    rawOddsValuesRead: false as const,\n'
          if text.count(old_type) != 1 or text.count(old_core) != 1:
              raise SystemExit('expected raw source read fields exactly once')
          text = text.replace(old_type, '  rawCaptureEvidenceRead: false;\n', 1)
          text = text.replace(old_core, '    rawCaptureEvidenceRead: false as const,\n', 1)
          path.write_text(text)
          PY
      - name: Verify focused index tests
        run: |
          npm ci
          node --test --import tsx \
            src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.test.ts \
            src/automation/n2PrivateMarketFeatureDayIndexCliBoundary.test.ts
          npm run typecheck
      - name: Commit validated normalization and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/n2-private-market-day-index-field-fix.yml
          git add src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.ts
          git commit -m "fix(research): name day-index raw source boundary precisely"
          git push origin HEAD:feat/n2-trifecta-private-market-feature-day-index

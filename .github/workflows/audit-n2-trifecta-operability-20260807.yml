name: Audit N2 trifecta operability 20260807

on:
  push:
    branches:
      - ops/audit-n2-trifecta-operability-20260807
    paths:
      - .github/workflows/audit-n2-trifecta-operability-20260807.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/audit-n2-trifecta-operability-20260807.yml

permissions:
  contents: read

concurrency:
  group: audit-n2-trifecta-operability-20260807
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/audit-n2-trifecta-operability-20260807
      - name: Run metadata-only private capture operability audit
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="/Users/m-shogo/Developer/personal/boat-pon"
          cd "$GITHUB_WORKSPACE"
          npm ci --silent >/dev/null
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL" node --import tsx \
            scripts/report-n2-trifecta-private-capture-operability.ts \
            --date 2026-08-07 \
            > "$RUNNER_TEMP/n2-operability.json"
          cli_status=$?
          set -e
          [ "$cli_status" -eq 0 ] || [ "$cli_status" -eq 3 ]
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "n2-operability.json")
          data = json.load(open(p))
          for key, expected in {
              "networkRequestCount": 0,
              "databaseReadCount": 0,
              "databaseWriteCount": 0,
              "rawOddsValuesRead": False,
              "rawOddsValuesPrinted": False,
              "rawOddsValuesPublished": False,
              "currentBuyChanged": False,
              "lineChanged": False,
              "publicPublished": False,
              "automatedBettingChanged": False,
              "productionApplyExecuted": False,
          }.items():
              assert data[key] == expected, (key, data[key])
          states = {}
          by_label = {}
          exception_checkpoints = []
          for item in data["checkpoints"]:
              states[item["state"]] = states.get(item["state"], 0) + 1
              label = item["checkpointLabel"]
              bucket = by_label.setdefault(label, {})
              bucket[item["state"]] = bucket.get(item["state"], 0) + 1
              if item["state"] in ("MISSED_NO_RESERVATION", "BLOCKED_EVIDENCE", "RESERVED_NO_ACCEPTED_EVIDENCE"):
                  exception_checkpoints.append({
                      "raceIdentity": item["raceIdentity"],
                      "checkpointLabel": item["checkpointLabel"],
                      "targetCaptureAt": item["targetCaptureAt"],
                      "state": item["state"],
                      "blockerCodes": item["blockerCodes"],
                  })
          print(json.dumps({
              "status": data["status"],
              "blockers": data["blockers"],
              "checkedAt": data["checkedAt"],
              "date": data["date"],
              "selectedVenueCode": data["selectedVenueCode"],
              "authoritySha": data["authoritySha"],
              "launchdRegistered": data["launchdRegistered"],
              "authorization": data["authorization"],
              "heartbeat": data["heartbeat"],
              "coverage": data["coverage"],
              "stateCounts": states,
              "stateCountsByCheckpointLabel": by_label,
              "exceptionCheckpoints": exception_checkpoints,
              "storage": data["storage"],
              "outputDigest": data["outputDigest"],
          }, indent=2, sort_keys=True))
          PY

      - name: Prove real daily-plan overlap around post-migration 5R T-5 miss
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          root = "/Users/m-shogo/Developer/personal/boat-pon"
          plan_path = os.path.join(root, "data/private/trifecta-capture/plans/2026-08-07.json")
          plan = json.load(open(plan_path))
          window_start = "2026-08-07T01:10:00.000Z"
          window_end = "2026-08-07T01:16:00.000Z"
          reservations = []
          for path in glob.glob(os.path.join(root, "data/private/trifecta-capture/reservations/2026-08-07/*.json")):
              try:
                  reservations.append(json.load(open(path)))
              except Exception:
                  pass
          entries = []
          for e in plan["plan"]["entries"]:
              if window_start <= e["targetCaptureAt"] <= window_end:
                  reservation = next(({
                      "reservedAt": r.get("reservedAt"),
                      "targetCaptureAt": r.get("targetCaptureAt"),
                  } for r in reservations if r.get("raceIdentity") == e["raceIdentity"] and r.get("checkpointLabel") == e["checkpointLabel"]), None)
                  entries.append({
                      "raceIdentity": e["raceIdentity"],
                      "checkpointLabel": e["checkpointLabel"],
                      "targetCaptureAt": e["targetCaptureAt"],
                      "reservation": reservation,
                  })
          print(json.dumps({
              "windowStart": window_start,
              "windowEnd": window_end,
              "entries": entries,
              "reservationMetadataOnly": True,
              "rawOddsValuesRead": False,
              "databaseReadCount": 0,
              "networkRequestCount": 0,
          }, indent=2, sort_keys=True))
          PY

      - name: Inspect launchd summary log around post-migration miss
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          root = "/Users/m-shogo/Developer/personal/boat-pon/data/private/trifecta-capture/logs"
          stdout_path = os.path.join(root, "stdout.log")
          stderr_path = os.path.join(root, "stderr.log")
          start = "2026-08-07T01:09:00.000Z"
          end = "2026-08-07T01:17:00.000Z"

          def decode_stream(text):
              decoder = json.JSONDecoder()
              pos = 0
              values = []
              while pos < len(text):
                  while pos < len(text) and text[pos].isspace():
                      pos += 1
                  if pos >= len(text):
                      break
                  try:
                      value, next_pos = decoder.raw_decode(text, pos)
                  except Exception:
                      pos += 1
                      continue
                  if isinstance(value, dict):
                      values.append(value)
                  pos = next_pos
              return values

          summaries = []
          if os.path.exists(stdout_path):
              for value in decode_stream(open(stdout_path, errors="replace").read()):
                  now = value.get("now")
                  if not isinstance(now, str) or not (start <= now <= end):
                      continue
                  summaries.append({
                      "now": now,
                      "status": value.get("status"),
                      "blockers": value.get("blockers", []),
                      "selectedRaceIdentity": value.get("selectedRaceIdentity"),
                      "selectedCheckpointLabel": value.get("selectedCheckpointLabel"),
                      "dueEntryCount": value.get("dueEntryCount"),
                      "networkRequestCount": value.get("networkRequestCount"),
                      "capturedCount": value.get("capturedCount"),
                      "blockedEvidenceCount": value.get("blockedEvidenceCount"),
                      "runtimeAuthorityStatus": value.get("runtimeAuthorityStatus"),
                  })
          stderr_bytes = os.path.getsize(stderr_path) if os.path.exists(stderr_path) else 0
          print(json.dumps({
              "windowStart": start,
              "windowEnd": end,
              "stdoutEventSummaries": summaries,
              "stderrBytesTotal": stderr_bytes,
              "rawOddsValuesRead": False,
              "databaseReadCount": 0,
              "networkRequestCount": 0,
          }, indent=2, sort_keys=True))
          PY

      - name: Inspect system sleep and launchd evidence for 10:09-10:17 JST
        shell: bash
        run: |
          set -euo pipefail
          PMSET="$RUNNER_TEMP/pmset.log"
          /usr/bin/pmset -g log > "$PMSET" || true
          python3 - <<'PY'
          import json, os, re, subprocess
          p = os.path.join(os.environ["RUNNER_TEMP"], "pmset.log")
          sleep_events = []
          if os.path.exists(p):
              for line in open(p, errors="replace"):
                  if not line.startswith("2026-08-07 10:"):
                      continue
                  minute_match = re.match(r"2026-08-07 10:(\d\d):", line)
                  if not minute_match:
                      continue
                  minute = int(minute_match.group(1))
                  if minute < 9 or minute > 17:
                      continue
                  lowered = line.lower()
                  kind = None
                  if "darkwake" in lowered:
                      kind = "DARKWAKE"
                  elif "wake" in lowered:
                      kind = "WAKE"
                  elif "sleep" in lowered:
                      kind = "SLEEP"
                  if kind:
                      sleep_events.append({"timestamp": line[:25].strip(), "kind": kind})

          launchd_events = []
          cmd = [
              "/usr/bin/log", "show",
              "--start", "2026-08-07 10:09:00+09:00",
              "--end", "2026-08-07 10:17:00+09:00",
              "--style", "json",
              "--predicate", 'eventMessage CONTAINS[c] "com.boatpon.trifecta-private-capture"',
          ]
          try:
              completed = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
              for line in completed.stdout.splitlines():
                  try:
                      obj = json.loads(line)
                  except Exception:
                      continue
                  msg = str(obj.get("eventMessage", ""))
                  lower = msg.lower()
                  classification = "OTHER"
                  if "spawn" in lower or "launch" in lower or "started" in lower:
                      classification = "START"
                  elif "exit" in lower or "terminated" in lower or "stopped" in lower:
                      classification = "EXIT"
                  launchd_events.append({
                      "timestamp": obj.get("timestamp"),
                      "classification": classification,
                  })
          except Exception:
              pass
          print(json.dumps({
              "windowJst": "2026-08-07 10:09:00..10:17:00+09:00",
              "sleepWakeEvents": sleep_events,
              "launchdEventCount": len(launchd_events),
              "launchdEvents": launchd_events,
              "systemLogMessageBodiesPublished": False,
              "rawOddsValuesRead": False,
              "databaseReadCount": 0,
              "networkRequestCount": 0,
          }, indent=2, sort_keys=True))
          PY

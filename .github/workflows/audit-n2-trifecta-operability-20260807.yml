name: Audit N2 trifecta operability 20260807

on:
  push:
    branches:
      - ops/audit-n2-trifecta-operability-20260807
    paths:
      - .github/workflows/audit-n2-trifecta-operability-20260807.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/audit-n2-trifecta-operability-20260807.yml

permissions:
  contents: read

concurrency:
  group: audit-n2-trifecta-operability-20260807
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/audit-n2-trifecta-operability-20260807
      - name: Run metadata-only private capture operability audit
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="/Users/m-shogo/Developer/personal/boat-pon"
          cd "$GITHUB_WORKSPACE"
          npm ci --silent >/dev/null
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL" node --import tsx \
            scripts/report-n2-trifecta-private-capture-operability.ts \
            --date 2026-08-07 \
            > "$RUNNER_TEMP/n2-operability.json"
          cli_status=$?
          set -e
          [ "$cli_status" -eq 0 ] || [ "$cli_status" -eq 3 ]
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "n2-operability.json")
          data = json.load(open(p))
          assert data["networkRequestCount"] == 0
          assert data["databaseReadCount"] == 0
          assert data["databaseWriteCount"] == 0
          assert data["rawOddsValuesRead"] is False
          assert data["rawOddsValuesPrinted"] is False
          assert data["rawOddsValuesPublished"] is False
          assert data["currentBuyChanged"] is False
          assert data["lineChanged"] is False
          assert data["publicPublished"] is False
          assert data["automatedBettingChanged"] is False
          assert data["productionApplyExecuted"] is False
          states = {}
          by_label = {}
          exception_checkpoints = []
          for item in data["checkpoints"]:
              states[item["state"]] = states.get(item["state"], 0) + 1
              label = item["checkpointLabel"]
              bucket = by_label.setdefault(label, {})
              bucket[item["state"]] = bucket.get(item["state"], 0) + 1
              if item["state"] in ("MISSED_NO_RESERVATION", "BLOCKED_EVIDENCE", "RESERVED_NO_ACCEPTED_EVIDENCE"):
                  exception_checkpoints.append({
                      "raceIdentity": item["raceIdentity"],
                      "checkpointLabel": item["checkpointLabel"],
                      "targetCaptureAt": item["targetCaptureAt"],
                      "state": item["state"],
                      "blockerCodes": item["blockerCodes"],
                  })
          summary = {
              "status": data["status"],
              "blockers": data["blockers"],
              "checkedAt": data["checkedAt"],
              "date": data["date"],
              "selectedVenueCode": data["selectedVenueCode"],
              "authoritySha": data["authoritySha"],
              "launchdRegistered": data["launchdRegistered"],
              "authorization": data["authorization"],
              "heartbeat": data["heartbeat"],
              "coverage": data["coverage"],
              "stateCounts": states,
              "stateCountsByCheckpointLabel": by_label,
              "exceptionCheckpoints": exception_checkpoints,
              "storage": data["storage"],
              "networkRequestCount": 0,
              "databaseReadCount": 0,
              "databaseWriteCount": 0,
              "rawOddsValuesRead": False,
              "rawOddsValuesPublished": False,
              "currentBuyChanged": False,
              "lineChanged": False,
              "publicPublished": False,
              "automatedBettingChanged": False,
              "outputDigest": data["outputDigest"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Inspect sanitized tick timeline around post-migration 5R T-5 miss
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          root = "/Users/m-shogo/Developer/personal/boat-pon"
          report_dir = os.path.join(root, "data/private/trifecta-capture/reports/2026-08-07")
          start = "2026-08-07T01:09:00.000Z"
          end = "2026-08-07T01:17:00.000Z"
          timeline = []
          for path in sorted(glob.glob(os.path.join(report_dir, "*.json"))):
              try:
                  r = json.load(open(path))
              except Exception:
                  continue
              now = r.get("now") or r.get("startedAt") or ""
              if not (start <= now <= end):
                  continue
              selected = r.get("selectedEntry") or None
              executor = r.get("executorReport") or None
              executor_summary = None
              if isinstance(executor, dict):
                  executor_summary = {
                      "status": executor.get("status"),
                      "dueEntryCount": executor.get("dueEntryCount"),
                      "networkRequestCount": executor.get("networkRequestCount"),
                      "capturedCount": executor.get("capturedCount"),
                      "blockedEvidenceCount": executor.get("blockedEvidenceCount"),
                      "entryResults": [
                          {
                              "raceIdentity": e.get("raceIdentity"),
                              "checkpointLabel": e.get("checkpointLabel"),
                              "result": e.get("result"),
                              "blockers": e.get("blockers", []),
                          }
                          for e in executor.get("entryResults", [])
                      ],
                  }
              timeline.append({
                  "now": r.get("now"),
                  "startedAt": r.get("startedAt"),
                  "completedAt": r.get("completedAt"),
                  "status": r.get("status"),
                  "blockers": r.get("blockers", []),
                  "selectedVenueCode": r.get("selectedVenueCode"),
                  "selectedRaceCount": r.get("selectedRaceCount"),
                  "dailyReservationCountBefore": r.get("dailyReservationCountBefore"),
                  "dailyReservationCountAfter": r.get("dailyReservationCountAfter"),
                  "dueEntryCount": r.get("dueEntryCount"),
                  "selectedEntry": None if not isinstance(selected, dict) else {
                      "raceIdentity": selected.get("raceIdentity"),
                      "checkpointLabel": selected.get("checkpointLabel"),
                      "targetCaptureAt": selected.get("targetCaptureAt"),
                  },
                  "executorReport": executor_summary,
                  "primaryDbMetadataUnchanged": r.get("primaryDbMetadataUnchanged"),
                  "databaseWriteCount": r.get("databaseWriteCount"),
                  "currentBuyChanged": r.get("currentBuyChanged"),
                  "lineChanged": r.get("lineChanged"),
                  "publicPublished": r.get("publicPublished"),
                  "automatedBettingChanged": r.get("automatedBettingChanged"),
              })
          print(json.dumps({
              "windowStart": start,
              "windowEnd": end,
              "reportCount": len(timeline),
              "timeline": timeline,
              "rawOddsValuesRead": False,
              "databaseReadCount": 0,
              "networkRequestCount": 0,
          }, indent=2, sort_keys=True))
          PY

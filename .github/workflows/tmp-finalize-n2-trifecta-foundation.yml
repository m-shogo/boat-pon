name: temporary finalize N2 trifecta foundation authority

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: tmp-finalize-n2-trifecta-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-authority:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-market-readonly-foundation
          fetch-depth: 0

      - name: Sync latest main and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --quiet
          git merge --no-edit origin/main
          rm -f \
            .github/workflows/tmp-n2-trifecta-market-foundation-mac.yml \
            .github/workflows/tmp-n2-trifecta-report-diagnostic.yml \
            .github/workflows/tmp-finalize-n2-trifecta-foundation.yml

      - name: Record final fail-closed authority evidence
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = json.loads(Path('reports/n2/n2-trifecta-market-foundation.json').read_text())
          mac = json.loads(Path('reports/automation/validation/n2-trifecta-market-foundation-mac.json').read_text())
          required = {
              'reportStatus': report.get('status') == 'BLOCKED_NOT_READY_FOR_CANARY',
              'dataStatus': report.get('dataStatus') == 'NO_SOURCE_ROWS',
              'macValidation': mac.get('result') == 'PASS',
              'sourceRowsZero': report['inventory']['totalRows'] == 0,
              'manifestEntriesZero': report['foundation']['canaryManifest']['entryCount'] == 0,
              'observationsZero': report['existingState']['trifectaMarketObservationCount'] == 0,
              'writeDisabled': report['writeAuthorized'] is False,
              'approvalAbsent': report['approvalCreated'] is False and report['existingState']['approvalPresent'] is False,
              'productionApplyAbsent': report['productionApplyExecuted'] is False,
              'dbWritesZero': report['primaryDbWriteCount'] == 0 and report['sidecarWriteCount'] == 0,
              'dbMetadataUnchanged': report['dbMetadataUnchanged'] is True,
              'shadowWriteOff': report['existingState']['shadowWriteEnabled'] is False,
          }
          errors = [name for name, ok in required.items() if not ok]
          evidence = {
              'evidenceSchemaVersion': 'n2-trifecta-market-foundation-final-authority-v1',
              'workflowRunId': int(os.environ['WORKFLOW_RUN_ID']),
              'validatedBranchHeadBeforeCommit': os.popen('git rev-parse HEAD').read().strip(),
              'executionLocation': 'GitHub-hosted authority finalization',
              'result': 'PASS' if not errors else 'BLOCKED',
              'errors': errors,
              'foundationState': 'BLOCKED_NOT_READY_FOR_CANARY',
              'dataStatus': 'NO_SOURCE_ROWS',
              'latestSuccessfulMacValidationRunId': mac['workflowRunId'],
              'latestSuccessfulMacValidationCommit': mac['validatedCommit'],
              'transientWalBlockedRuns': [31082678987, 31083857785],
              'recoveredReadOnlyRuns': [31082994311, mac['workflowRunId']],
              'failureClassification': 'TRANSIENT_PRIMARY_WAL_CONTENTION_FAIL_CLOSED',
              'retryDecision': 'NO_IMMEDIATE_DB_RETRY; preserve blocked state until a separately scheduled quiescent preflight',
              'taskAttemptConsumed': False,
              'writeAuthorized': False,
              'approvalCreated': False,
              'productionApplyExecuted': False,
              'primaryDbWriteCount': 0,
              'sidecarWriteCount': 0,
              'trifectaMarketObservationCount': 0,
              'manifestEntryCount': 0,
              'checks': required,
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('reports/automation/validation/n2-trifecta-market-foundation-final-authority.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n'
          )
          if errors:
              raise SystemExit(';'.join(errors))
          PY

      - name: Commit synchronized final authority
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'test: finalize trifecta foundation authority'
          git push origin HEAD:agent/n2-trifecta-market-readonly-foundation

name: Temporary fix hardening plist input

on:
  push:
    branches:
      - fix/n2-trifecta-local-capture-hardening
    paths:
      - .github/workflows/tmp-fix-hardening-plist-input.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fix-hardening-plist-input.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-trifecta-local-capture-hardening
          fetch-depth: 0

      - name: Remove unsupported plist property and self-delete
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/install-n2-trifecta-local-capture-agent.ts')
          source = path.read_text()
          old = '''  workingDirectory: repoRoot,
  canonicalRepoRoot,
  dataRoot,'''
          new = '''  workingDirectory: repoRoot,
  dataRoot,'''
          if source.count(old) != 1:
              raise SystemExit(f'exact replacement count must be 1, got {source.count(old)}')
          path.write_text(source.replace(old, new))
          Path('.github/workflows/tmp-fix-hardening-plist-input.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install-n2-trifecta-local-capture-agent.ts \
            .github/workflows/tmp-fix-hardening-plist-input.yml
          git commit -m "fix(research): keep canonical root outside plist input"
          git push origin HEAD:fix/n2-trifecta-local-capture-hardening

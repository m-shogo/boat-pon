name: N2 market baseline readiness (post-run)

on:
  workflow_run:
    workflows: ["boat-pon local research (one-shot)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: boat-pon-n2-market-baseline-readiness
  cancel-in-progress: false

jobs:
  readiness:
    # Private evidence stays on the canonical Mac data root. This workflow only
    # emits sanitized counts/status and never mutates queue state or private data.
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login == 'm-shogo'
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 10
    steps:
      - name: Checkout main readiness authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Inspect N2 market baseline readiness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --import tsx scripts/report-n2-market-baseline-readiness.ts \
            > /tmp/n2-market-baseline-readiness.json
          RC=$?
          set -e

          test -s /tmp/n2-market-baseline-readiness.json || {
            echo "::error::market baseline readiness produced no sanitized summary"
            exit 1
          }
          cat /tmp/n2-market-baseline-readiness.json

          RC="$RC" node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('/tmp/n2-market-baseline-readiness.json', 'utf8'));
          if (d.n2TaskId !== 'TASK-N2-020') throw new Error('unexpected task id');
          if (typeof d.n2TaskReady !== 'boolean') throw new Error('n2TaskReady must be boolean');
          if (!Number.isSafeInteger(d.acceptedT5RaceCount) || d.acceptedT5RaceCount < 0) throw new Error('accepted count invalid');
          if (!Number.isSafeInteger(d.settledAcceptedT5RaceCount) || d.settledAcceptedT5RaceCount < 0) throw new Error('settled count invalid');
          if (d.settledAcceptedT5RaceCount > d.acceptedT5RaceCount) throw new Error('settled count exceeds accepted count');
          for (const key of [
            'automaticPromotionAuthorized',
            'currentBuyConnectionAuthorized',
            'lineConnectionAuthorized',
            'publicPublishAuthorized',
            'automatedBettingAuthorized',
            'productionApplyAuthorized',
          ]) {
            if (d[key] !== false) throw new Error(`protected authority changed: ${key}`);
          }
          if (d.databaseWriteCount !== 0 || d.networkRequestCount !== 0) throw new Error('readiness widened IO authority');
          if (d.rawOddsValuesRead !== false || d.rawOddsValuesPrinted !== false || d.rawOddsValuesPublished !== false) {
            throw new Error('raw odds privacy boundary changed');
          }
          if (d.status === 'BLOCKED' && d.n2TaskReady !== false) throw new Error('blocked readiness cannot unlock N2-020');
          console.log(`readiness_status=${d.status} n2_020_ready=${d.n2TaskReady}`);
          NODE

          # RC=3 is a fail-closed readiness result (for example active WAL or
          # evidence-integrity blocker), not a failure of the already-finished
          # research task. Unexpected execution failures still fail this job.
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 3 ]; then
            echo "::error::market baseline readiness execution failed rc=$RC"
            exit "$RC"
          fi

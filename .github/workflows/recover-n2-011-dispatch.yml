name: Recover N2-011 merged intent

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recover-n2-011-dispatch.yml"

permissions:
  contents: write

concurrency:
  group: boat-pon-local-research
  cancel-in-progress: false

jobs:
  replay-merged-intent:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Assert immutable merged event
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "45dda41061bbbc7d648140845743d0ded7521946"
          test "$(git rev-parse HEAD^)" = "56a0a0ff0445674a77956bfe8569d6a8a1915c30"
          test -f automation/requests/intents/INTENT-20260805-m7p3v9k2qx.json

      - id: guard
        name: Replay the canonical push guard
        env:
          ACTOR: m-shogo
          REPO: m-shogo/boat-pon
          EVENT: push
          BEFORE_SHA: 56a0a0ff0445674a77956bfe8569d6a8a1915c30
          AFTER_SHA: 45dda41061bbbc7d648140845743d0ded7521946
          COMMIT_AUTHOR: m-shogo
          COMMIT_COMMITTER: web-flow
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: pnpm automation:guard-intent

      - name: Materialize control state and dataset authority
        if: steps.guard.outputs.ok == 'true'
        env:
          BRANCH: automation/boat-pon-research
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          git rev-parse "origin/$BRANCH" > .automation-branch-base
          mkdir -p automation/control reports/n2
          for f in task-queue-state processed-intents processed-requests current-run planner-candidates; do
            git show "origin/$BRANCH:automation/control/$f.json" > "automation/control/$f.json"
          done
          git show "origin/$BRANCH:reports/n2/n2-dataset-manifest.json" > reports/n2/n2-dataset-manifest.json
          test -s reports/n2/n2-dataset-manifest.json

      - name: Run exactly one N2-011 task
        if: steps.guard.outputs.ok == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          INTENT_ID: ${{ steps.guard.outputs.intent_id }}
        run: |
          set -euo pipefail
          node scripts/assert-canonical-request.mjs canonical-request.json
          pnpm automation:intent-task -- --request=canonical-request.json --intent-id="$INTENT_ID"

      - name: Show status
        if: always()
        run: cat reports/automation/current-status.json || true

      - name: Commit control state and evidence to automation branch
        if: steps.guard.outputs.ok == 'true' && always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/automation-commit.sh

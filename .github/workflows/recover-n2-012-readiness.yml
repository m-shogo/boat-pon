name: Recover TASK-N2-012 readiness intent

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recover-n2-012-readiness.yml"

permissions:
  contents: write

concurrency:
  group: boat-pon-local-research
  cancel-in-progress: false

jobs:
  replay-merged-intent:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Assert immutable merged event
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e7930da54905eeb1c24e8dcdfc44a98a05ee775b"
          test "$(git rev-parse HEAD^)" = "cf2250e488fe4df1f18289712b18022ae0c4d0b0"
          test -f automation/requests/intents/INTENT-20260805-z4m8q2v6kn.json

      - id: guard
        name: Replay canonical push guard
        env:
          ACTOR: m-shogo
          REPO: m-shogo/boat-pon
          EVENT: push
          BEFORE_SHA: cf2250e488fe4df1f18289712b18022ae0c4d0b0
          AFTER_SHA: e7930da54905eeb1c24e8dcdfc44a98a05ee775b
          COMMIT_AUTHOR: m-shogo
          COMMIT_COMMITTER: web-flow
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: pnpm automation:guard-intent

      - name: Materialize control state and dataset authority
        if: steps.guard.outputs.ok == 'true'
        env:
          BRANCH: automation/boat-pon-research
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          git rev-parse "origin/$BRANCH" > .automation-branch-base
          mkdir -p automation/control "$RUNNER_TEMP"
          for f in task-queue-state processed-intents processed-requests current-run planner-candidates; do
            git show "origin/$BRANCH:automation/control/$f.json" > "automation/control/$f.json"
          done
          git show "origin/$BRANCH:reports/n2/n2-dataset-manifest.json" > "$RUNNER_TEMP/n2-dataset-manifest.json"
          test -s "$RUNNER_TEMP/n2-dataset-manifest.json"

      - name: Run exactly one TASK-N2-012
        if: steps.guard.outputs.ok == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          INTENT_ID: ${{ steps.guard.outputs.intent_id }}
          BOAT_PON_N2_DATASET_MANIFEST_PATH: ${{ runner.temp }}/n2-dataset-manifest.json
        run: |
          set -euo pipefail
          node scripts/assert-canonical-request.mjs canonical-request.json
          pnpm automation:intent-task -- --request=canonical-request.json --intent-id="$INTENT_ID"

      - name: Show status
        if: always()
        run: cat reports/automation/current-status.json || true

      - name: Commit control state and evidence to automation branch
        if: steps.guard.outputs.ok == 'true' && always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/automation-commit.sh

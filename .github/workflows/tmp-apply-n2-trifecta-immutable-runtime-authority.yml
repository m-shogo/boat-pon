import test from "node:test";

import {
  N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION,
  auditN2TrifectaRuntimeAuthority,
  type N2TrifectaLocalCaptureRuntimeAuthority,
} from "./n2TrifectaRuntimeAuthority.js";

const SHA = "0123456789abcdef0123456789abcdef01234567";
const ROOT = "/Users/test/Library/Application Support/BoatPon/trifecta-private-capture/releases/0123456789abcdef0123456789abcdef01234567";

function observed(overrides: Partial<N2TrifectaLocalCaptureRuntimeAuthority> = {}): N2TrifectaLocalCaptureRuntimeAuthority {
  return {
    authorityVersion: N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION,
    actualAuthoritySha: SHA,
    actualRuntimeRoot: ROOT,
    detachedHead: true,
    trackedWorktreeClean: true,
    ...overrides,
  };
}

test("exact detached clean runtime authority passes", () => {
  assert.deepEqual(auditN2TrifectaRuntimeAuthority({
    expectedAuthoritySha: SHA,
    expectedRuntimeRoot: ROOT,
    observed: observed(),
  }), {
    status: "PASS",
    blockers: [],
    authorityMatched: true,
    runtimeRootMatched: true,
    detachedHead: true,
    trackedWorktreeClean: true,
  });
});

test("SHA, root, attached branch and tracked dirt each fail closed", () => {
  const cases: Array<[Partial<N2TrifectaLocalCaptureRuntimeAuthority>, string]> = [
    [{ actualAuthoritySha: "f".repeat(40) }, "AUTHORITY_SHA_MISMATCH"],
    [{ actualRuntimeRoot: "/tmp/other-runtime" }, "RUNTIME_ROOT_MISMATCH"],
    [{ detachedHead: false }, "RUNTIME_HEAD_NOT_DETACHED"],
    [{ trackedWorktreeClean: false }, "RUNTIME_TRACKED_WORKTREE_DIRTY"],
  ];
  for (const [override, blocker] of cases) {
    const result = auditN2TrifectaRuntimeAuthority({
      expectedAuthoritySha: SHA,
      expectedRuntimeRoot: ROOT,
      observed: observed(override),
    });
    assert.equal(result.status, "BLOCKED");
    assert.ok(result.blockers.includes(blocker));
  }
});

test("invalid or missing SHA never becomes authority", () => {
  const result = auditN2TrifectaRuntimeAuthority({
    expectedAuthoritySha: "main",
    expectedRuntimeRoot: ROOT,
    observed: observed({ actualAuthoritySha: null }),
  });
  assert.equal(result.status, "BLOCKED");
  assert.ok(result.blockers.includes("EXPECTED_AUTHORITY_SHA_INVALID"));
  assert.ok(result.blockers.includes("ACTUAL_AUTHORITY_SHA_INVALID"));
  assert.equal(result.authorityMatched, false);
});
''')


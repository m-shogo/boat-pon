name: Temporary apply N2 trifecta immutable runtime authority

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-apply-n2-trifecta-immutable-runtime-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def must_replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          Path("src/research-replay/n2TrifectaRuntimeAuthority.ts").write_text(r'''import { resolve } from "node:path";

export const N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION =
  "n2-trifecta-runtime-authority-v1" as const;

export type N2TrifectaLocalCaptureRuntimeAuthority = {
  authorityVersion: typeof N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION;
  actualAuthoritySha: string | null;
  actualRuntimeRoot: string;
  detachedHead: boolean;
  trackedWorktreeClean: boolean;
};

export type N2TrifectaRuntimeAuthorityAudit = {
  status: "PASS" | "BLOCKED";
  blockers: string[];
  authorityMatched: boolean;
  runtimeRootMatched: boolean;
  detachedHead: boolean;
  trackedWorktreeClean: boolean;
};

const SHA_RE = /^[0-9a-f]{40}$/u;

function unique(values: string[]): string[] {
  return [...new Set(values)].sort();
}

export function auditN2TrifectaRuntimeAuthority(input: {
  expectedAuthoritySha: string;
  expectedRuntimeRoot: string;
  observed: N2TrifectaLocalCaptureRuntimeAuthority;
}): N2TrifectaRuntimeAuthorityAudit {
  const blockers: string[] = [];
  const expectedSha = input.expectedAuthoritySha.trim();
  const actualSha = input.observed.actualAuthoritySha?.trim() ?? null;
  const expectedRoot = input.expectedRuntimeRoot.trim();
  const actualRoot = input.observed.actualRuntimeRoot.trim();

  if (input.observed.authorityVersion !== N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION) {
    blockers.push("RUNTIME_AUTHORITY_VERSION_MISMATCH");
  }
  if (!SHA_RE.test(expectedSha)) blockers.push("EXPECTED_AUTHORITY_SHA_INVALID");
  if (actualSha == null || !SHA_RE.test(actualSha)) {
    blockers.push("ACTUAL_AUTHORITY_SHA_INVALID");
  } else if (actualSha !== expectedSha) {
    blockers.push("AUTHORITY_SHA_MISMATCH");
  }
  if (!expectedRoot) blockers.push("EXPECTED_RUNTIME_ROOT_INVALID");
  if (!actualRoot) blockers.push("ACTUAL_RUNTIME_ROOT_INVALID");
  if (expectedRoot && actualRoot && resolve(expectedRoot) !== resolve(actualRoot)) {
    blockers.push("RUNTIME_ROOT_MISMATCH");
  }
  if (!input.observed.detachedHead) blockers.push("RUNTIME_HEAD_NOT_DETACHED");
  if (!input.observed.trackedWorktreeClean) blockers.push("RUNTIME_TRACKED_WORKTREE_DIRTY");

  const normalized = unique(blockers);
  return {
    status: normalized.length === 0 ? "PASS" : "BLOCKED",
    blockers: normalized,
    authorityMatched: actualSha != null && actualSha === expectedSha,
    runtimeRootMatched: Boolean(expectedRoot && actualRoot)
      && resolve(expectedRoot) === resolve(actualRoot),
    detachedHead: input.observed.detachedHead,
    trackedWorktreeClean: input.observed.trackedWorktreeClean,
  };
}
''')


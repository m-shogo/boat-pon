          Path("scripts/run-n2-trifecta-local-capture-tick.ts").write_text(r'''import { spawnSync } from "node:child_process";
import {
  existsSync,
  lstatSync,
  readFileSync,
  statSync,
} from "node:fs";
import { join, resolve } from "node:path";

import {
  runN2TrifectaLocalCaptureTick,
  type N2TrifectaLocalCaptureAuthorization,
  type N2TrifectaLocalCaptureRuntimeAuthority,
} from "../src/research-replay/n2TrifectaLocalCaptureService";
import { N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION } from "../src/research-replay/n2TrifectaRuntimeAuthority";

const repoRoot = resolve(process.cwd());
const policy = JSON.parse(
  readFileSync(join(repoRoot, "config/research-automation-policy.json"), "utf8"),
) as Record<string, unknown>;
const dataRoot = resolve(
  process.env.BOAT_PON_DATA_ROOT?.trim()
    || String(policy.dataRoot ?? policy.repoPath ?? repoRoot),
);
const primaryDbPath = resolve(
  process.env.BOAT_PON_PRIMARY_DB_PATH?.trim()
    || join(dataRoot, "data/boat.sqlite"),
);
const authorizationPath = resolve(
  process.env.BOAT_PON_LOCAL_CAPTURE_AUTH_PATH?.trim()
    || join(dataRoot, "data/private/trifecta-capture/authorization.json"),
);
const now = process.env.BOAT_PON_LOCAL_CAPTURE_NOW?.trim()
  || new Date().toISOString();
const forceJson = process.argv.includes("--json")
  || process.env.BOAT_PON_LOCAL_CAPTURE_VERBOSE === "1";

function readAuthorization(path: string): N2TrifectaLocalCaptureAuthorization {
  if (!existsSync(path)) throw new Error("LOCAL_CAPTURE_AUTHORIZATION_NOT_FOUND");
  if (lstatSync(path).isSymbolicLink()) {
    throw new Error("LOCAL_CAPTURE_AUTHORIZATION_SYMLINK_NOT_ALLOWED");
  }
  const stat = statSync(path);
  if (!stat.isFile() || stat.size <= 0 || stat.size > 100_000) {
    throw new Error("LOCAL_CAPTURE_AUTHORIZATION_SIZE_OR_TYPE_INVALID");
  }
  let parsed: unknown;
  try {
    parsed = JSON.parse(readFileSync(path, "utf8"));
  } catch {
    throw new Error("LOCAL_CAPTURE_AUTHORIZATION_INVALID_JSON");
  }
  return parsed as N2TrifectaLocalCaptureAuthorization;
}

function git(args: string[]): { status: number | null; stdout: string } {
  const result = spawnSync("git", ["-C", repoRoot, ...args], {
    encoding: "utf8",
    stdio: ["ignore", "pipe", "ignore"],
  });
  return { status: result.status, stdout: result.stdout.trim() };
}

function probeRuntimeAuthority(): N2TrifectaLocalCaptureRuntimeAuthority {
  const head = git(["rev-parse", "HEAD"]);
  const symbolic = git(["symbolic-ref", "-q", "HEAD"]);
  const trackedStatus = git(["status", "--porcelain", "--untracked-files=no"]);
  return {
    authorityVersion: N2_TRIFECTA_RUNTIME_AUTHORITY_VERSION,
    actualAuthoritySha: head.status === 0 ? head.stdout : null,
    actualRuntimeRoot: repoRoot,
    detachedHead: symbolic.status === 1,
    trackedWorktreeClean: trackedStatus.status === 0 && trackedStatus.stdout === "",
  };
}

const authorization = readAuthorization(authorizationPath);
const report = await runN2TrifectaLocalCaptureTick({
  dataRoot,
  primaryDbPath,
  authorization,
  runtimeAuthority: probeRuntimeAuthority(),
  now,
});

const summary = {
  reportVersion: report.reportVersion,
  status: report.status,
  blockers: report.blockers,
  now: report.now,
  dateJst: report.dateJst,
  selectedVenueCode: report.selectedVenueCode,
  selectedRaceCount: report.selectedRaceCount,
  dueEntryCount: report.dueEntryCount,
  selectedRaceIdentity: report.selectedEntry?.raceIdentity ?? null,
  selectedCheckpointLabel: report.selectedEntry?.checkpointLabel ?? null,
  networkRequestCount: report.executorReport?.networkRequestCount ?? 0,
  capturedCount: report.executorReport?.capturedCount ?? 0,
  blockedEvidenceCount: report.executorReport?.blockedEvidenceCount ?? 0,
  authoritySha: authorization.authoritySha ?? null,
  runtimeRoot: authorization.runtimeRoot ?? null,
  eventDigest: report.eventDigest,
  eventChanged: report.eventChanged,
  reportRelativePath: report.reportRelativePath,
  latestStatusRelativePath: report.latestStatusRelativePath,
  databaseWriteCount: report.databaseWriteCount,
  primaryDbWriteCount: report.primaryDbWriteCount,
  sidecarWriteCount: report.sidecarWriteCount,
  currentBuyChanged: report.currentBuyChanged,
  lineChanged: report.lineChanged,
  publicPublished: report.publicPublished,
  automatedBettingChanged: report.automatedBettingChanged,
  productionApplyExecuted: report.productionApplyExecuted,
};

if (forceJson || report.eventChanged || report.executorReport != null) {
  console.log(JSON.stringify(summary, null, 2));
}

if (report.status === "BLOCKED") process.exitCode = 3;
''')

          Path("scripts/install-n2-trifecta-local-capture-agent.ts").write_text(r'''import { spawnSync } from "node:child_process";
import {
  chmodSync,
  existsSync,
  lstatSync,
  mkdirSync,
  readFileSync,
  rmSync,
  writeFileSync,
} from "node:fs";
import { homedir } from "node:os";
import { dirname, join, resolve } from "node:path";

import {
  N2_TRIFECTA_LOCAL_CAPTURE_LAUNCH_AGENT_LABEL,
  assertN2TrifectaCanonicalInstallRoot,
  buildN2TrifectaImmutableRuntimeRoot,
  buildN2TrifectaLocalCaptureAuthorization,
  buildN2TrifectaLocalCaptureLaunchAgentPlist,
} from "../src/research-replay/n2TrifectaLocalCaptureLaunchAgent";
import {
  N2_TRIFECTA_LOCAL_CAPTURE_AUTHORIZATION_VERSION,
  type N2TrifectaLocalCaptureAuthorization,
} from "../src/research-replay/n2TrifectaLocalCaptureService";

const repoRoot = resolve(process.cwd());
const policy = JSON.parse(
  readFileSync(join(repoRoot, "config/research-automation-policy.json"), "utf8"),
) as Record<string, unknown>;
const dataRoot = resolve(
  process.env.BOAT_PON_DATA_ROOT?.trim()
    || String(policy.dataRoot ?? policy.repoPath ?? repoRoot),
);
const privateRoot = join(dataRoot, "data/private/trifecta-capture");
const authorizationPath = join(privateRoot, "authorization.json");
const logsPath = join(privateRoot, "logs");
const launchAgentsPath = join(homedir(), "Library/LaunchAgents");
const plistPath = join(
  launchAgentsPath,
  `${N2_TRIFECTA_LOCAL_CAPTURE_LAUNCH_AGENT_LABEL}.plist`,
);
const printOnly = process.argv.includes("--print-only");
const uninstall = process.argv.includes("--uninstall");
const authorize = process.argv.includes("--authorize");
const renew = process.argv.includes("--renew");
const authorizationDays = Number(argument("days") ?? "30");
const canonicalRepoRoot = resolve(String(policy.repoPath ?? repoRoot));
const releasesRoot = resolve(
  argument("runtime-releases-root")
    ?? join(homedir(), "Library/Application Support/BoatPon/trifecta-private-capture/releases"),
);

assertN2TrifectaCanonicalInstallRoot({
  currentRepoRoot: repoRoot,
  configuredRepoRoot: canonicalRepoRoot,
  printOnly,
});

function argument(name: string): string | null {
  const inline = process.argv.find((value) => value.startsWith(`--${name}=`));
  if (inline) return inline.slice(name.length + 3);
  const index = process.argv.indexOf(`--${name}`);
  return index >= 0 ? process.argv[index + 1] ?? null : null;
}

function run(command: string, args: string[], options: {
  cwd?: string;
  allowFailure?: boolean;
  capture?: boolean;
} = {}): { status: number | null; stdout: string } {
  const result = spawnSync(command, args, {
    cwd: options.cwd,
    encoding: "utf8",
    stdio: options.capture || options.allowFailure ? ["ignore", "pipe", "pipe"] : "inherit",
  });
  if (!options.allowFailure && result.status !== 0) {
    throw new Error(`${command} ${args.join(" ")} failed with ${result.status}`);
  }
  return { status: result.status, stdout: result.stdout?.trim() ?? "" };
}

function git(args: string[], options: { cwd?: string; allowFailure?: boolean } = {}) {
  return run("git", args, { ...options, capture: true });
}

function runLaunchctl(args: string[], allowFailure = false): void {
  run("/bin/launchctl", args, { allowFailure });
}

function readExistingAuthorization(): N2TrifectaLocalCaptureAuthorization | null {
  if (!existsSync(authorizationPath)) return null;
  if (lstatSync(authorizationPath).isSymbolicLink()) {
    throw new Error("AUTHORIZATION_SYMLINK_NOT_ALLOWED");
  }
  return JSON.parse(readFileSync(authorizationPath, "utf8")) as N2TrifectaLocalCaptureAuthorization;
}

function writePrivate(path: string, content: string): void {
  mkdirSync(dirname(path), { recursive: true, mode: 0o700 });
  writeFileSync(path, content, { encoding: "utf8", mode: 0o600 });
  chmodSync(path, 0o600);
}

function verifyImmutableRuntime(runtimeRoot: string, authoritySha: string): void {
  if (!existsSync(runtimeRoot)) throw new Error("IMMUTABLE_RUNTIME_NOT_FOUND");
  if (lstatSync(runtimeRoot).isSymbolicLink()) throw new Error("IMMUTABLE_RUNTIME_SYMLINK_NOT_ALLOWED");
  const head = git(["rev-parse", "HEAD"], { cwd: runtimeRoot });
  if (head.stdout !== authoritySha) throw new Error("IMMUTABLE_RUNTIME_SHA_MISMATCH");
  const symbolic = git(["symbolic-ref", "-q", "HEAD"], {
    cwd: runtimeRoot,
    allowFailure: true,
  });
  if (symbolic.status !== 1) throw new Error("IMMUTABLE_RUNTIME_MUST_BE_DETACHED");
  const status = git(["status", "--porcelain", "--untracked-files=no"], { cwd: runtimeRoot });
  if (status.stdout) throw new Error("IMMUTABLE_RUNTIME_TRACKED_FILES_DIRTY");
}

if (uninstall) {
  if (process.platform !== "darwin" && !printOnly) {
    throw new Error("UNINSTALL_REQUIRES_MACOS");
  }
  if (!printOnly) {
    runLaunchctl(["bootout", `gui/${process.getuid?.() ?? 0}`, plistPath], true);
    rmSync(plistPath, { force: true });
  }
  console.log(JSON.stringify({
    status: "UNINSTALLED",
    label: N2_TRIFECTA_LOCAL_CAPTURE_LAUNCH_AGENT_LABEL,
    plistRemoved: !printOnly,
    authorizationPreserved: true,
    immutableRuntimePreserved: true,
    rawEvidencePreserved: true,
    dataRoot,
  }, null, 2));
  process.exit(0);
}

if (process.platform !== "darwin" && !printOnly) {
  throw new Error("INSTALL_REQUIRES_MACOS");
}
if (!printOnly) {
  const branch = git(["branch", "--show-current"], { cwd: repoRoot });
  if (branch.stdout !== "main") throw new Error("INSTALL_REQUIRES_MAIN_BRANCH");
  const status = git(["status", "--porcelain"], { cwd: repoRoot });
  if (status.stdout) throw new Error("INSTALL_REQUIRES_CLEAN_WORKTREE");
}

const authoritySha = git(["rev-parse", "HEAD"], { cwd: repoRoot }).stdout;
const runtimeRoot = buildN2TrifectaImmutableRuntimeRoot({
  releasesRoot,
  authoritySha,
  canonicalRepoRoot,
});
const runtimeTsxCliPath = join(runtimeRoot, "node_modules/tsx/dist/cli.mjs");
const runtimeTickScriptPath = join(runtimeRoot, "scripts/run-n2-trifecta-local-capture-tick.ts");
const existingAuthorization = readExistingAuthorization();

if (existingAuthorization && !renew) {
  if (
    existingAuthorization.authorizationVersion !== N2_TRIFECTA_LOCAL_CAPTURE_AUTHORIZATION_VERSION
    || existingAuthorization.authoritySha !== authoritySha
    || resolve(existingAuthorization.runtimeRoot ?? "") !== runtimeRoot
  ) {
    throw new Error("EXISTING_AUTHORIZATION_REQUIRES_EXPLICIT_RENEWAL_FOR_RUNTIME_AUTHORITY");
  }
}

if (!printOnly) {
  mkdirSync(releasesRoot, { recursive: true, mode: 0o700 });
  if (!existsSync(runtimeRoot)) {
    git(["worktree", "add", "--detach", runtimeRoot, authoritySha], { cwd: repoRoot });
  }
  verifyImmutableRuntime(runtimeRoot, authoritySha);
  run("npm", ["ci"], { cwd: runtimeRoot });
  verifyImmutableRuntime(runtimeRoot, authoritySha);
}

if (!printOnly && !existsSync(runtimeTsxCliPath)) {
  throw new Error("IMMUTABLE_RUNTIME_TSX_CLI_NOT_FOUND");
}
if (!printOnly && !existsSync(runtimeTickScriptPath)) {
  throw new Error("IMMUTABLE_RUNTIME_TICK_SCRIPT_NOT_FOUND");
}

let authorization = existingAuthorization;
if (!existingAuthorization) {
  if (!authorize) throw new Error("NEW_INSTALL_REQUIRES_EXPLICIT_--authorize");
  authorization = buildN2TrifectaLocalCaptureAuthorization({
    now: new Date().toISOString(),
    authorizationDays,
    authoritySha,
    runtimeRoot,
  });
} else if (renew) {
  if (!authorize) throw new Error("RENEW_REQUIRES_EXPLICIT_--authorize");
  authorization = buildN2TrifectaLocalCaptureAuthorization({
    now: new Date().toISOString(),
    authorizationDays,
    authoritySha,
    runtimeRoot,
  });
}
if (!authorization) throw new Error("AUTHORIZATION_UNRESOLVED");

mkdirSync(privateRoot, { recursive: true, mode: 0o700 });
mkdirSync(logsPath, { recursive: true, mode: 0o700 });
const plist = buildN2TrifectaLocalCaptureLaunchAgentPlist({
  nodePath: process.execPath,
  tsxCliPath: runtimeTsxCliPath,
  tickScriptPath: runtimeTickScriptPath,
  workingDirectory: runtimeRoot,
  authoritySha,
  runtimeRoot,
  dataRoot,
  authorizationPath,
  stdoutPath: join(logsPath, "stdout.log"),
  stderrPath: join(logsPath, "stderr.log"),
});

if (!printOnly) {
  if (!existingAuthorization || renew) {
    writePrivate(authorizationPath, `${JSON.stringify(authorization, null, 2)}\n`);
  }
  mkdirSync(launchAgentsPath, { recursive: true });
  writeFileSync(plistPath, plist, { encoding: "utf8", mode: 0o644 });
  chmodSync(plistPath, 0o644);
  const domain = `gui/${process.getuid?.() ?? 0}`;
  runLaunchctl(["bootout", domain, plistPath], true);
  runLaunchctl(["bootstrap", domain, plistPath]);
  runLaunchctl(["kickstart", "-k", `${domain}/${N2_TRIFECTA_LOCAL_CAPTURE_LAUNCH_AGENT_LABEL}`]);
}

console.log(JSON.stringify({
  status: printOnly ? "PRINT_ONLY" : "INSTALLED",
  label: N2_TRIFECTA_LOCAL_CAPTURE_LAUNCH_AGENT_LABEL,
  authorizationId: authorization.authorizationId,
  authorizationIssuedAt: authorization.issuedAt,
  authorizationExpiresAt: authorization.expiresAt,
  authoritySha: authorization.authoritySha,
  runtimeRoot: authorization.runtimeRoot,
  runtimeDetached: true,
  runtimeTrackedWorktreeClean: true,
  stage: authorization.stage,
  maxRequestsPerDay: authorization.maxRequestsPerDay,
  checkpoints: authorization.checkpointLabels,
  startIntervalSeconds: 30,
  privateResearchOnly: authorization.privateResearchOnly,
  databaseWriteAuthorized: authorization.databaseWriteAuthorized,
  currentBuyConnectionAuthorized: authorization.currentBuyConnectionAuthorized,
  lineConnectionAuthorized: authorization.lineConnectionAuthorized,
  automatedBettingAuthorized: authorization.automatedBettingAuthorized,
  dataRoot,
  authorizationPath,
  plistPath,
  oldRuntimeCleanupExecuted: false,
  rawEvidenceUploadedOrPublished: false,
}, null, 2));

if (printOnly) console.log(plist);
''')


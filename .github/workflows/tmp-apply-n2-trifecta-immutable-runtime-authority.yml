## Immutable runtime authority (v2)

The LaunchAgent must not execute from mutable `main` or from a GitHub Actions `_work` checkout.
Installation creates a detached worktree at:

`~/Library/Application Support/BoatPon/trifecta-private-capture/releases/<40-char-sha>`

Authorization v2 binds both the exact commit SHA and the resolved runtime root. Every tick probes
`git rev-parse HEAD`, detached-HEAD state, tracked-file cleanliness, and the current working directory.
Any mismatch is recorded through the existing event-deduplicated BLOCKED path before plan selection,
reservation, network access, raw persistence, or any protected surface. Normal development can advance
`main` without changing the running collector. Moving the collector to a new SHA requires an explicit
`--renew --authorize` installation. Old runtime releases and private raw evidence are preserved by default.
''')


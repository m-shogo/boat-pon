name: Prepare N2 PIT audit v4 contract

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/prepare-n2-pit-audit-v4-contract.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/n2-pit-audit-v4-contract'
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact contract updates
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const replaceOnce = (path, before, after) => {
            const current = readFileSync(path, "utf8");
            const occurrences = current.split(before).length - 1;
            if (occurrences !== 1) throw new Error(`${path}: expected one replacement, got ${occurrences}: ${before}`);
            writeFileSync(path, current.replace(before, after));
          };

          const catalogPath = "automation/task-catalog.json";
          const catalog = JSON.parse(readFileSync(catalogPath, "utf8"));
          if (catalog.catalogVersion !== "2026-08-06-n2-governance-v7") throw new Error("CATALOG_VERSION_PRECONDITION");
          const task = catalog.tasks.find((candidate) => candidate.taskId === "TASK-N2-011");
          if (!task || task.taskDefinitionVersion !== 3 || task.executor !== "pit-audit") throw new Error("N2_011_DEFINITION_PRECONDITION");
          catalog.catalogVersion = "2026-08-06-n2-governance-v8";
          catalog.updatedAt = new Date().toISOString();
          task.taskDefinitionVersion = 4;
          task.expectedInputs = [
            "N2-010 n2-dataset-manifest-v2 core summary digest from automation authority",
            "strictly validated SDK PIT envelope outside the producer core digest",
            "read-only primary boat.sqlite with venue-label or canonical venue-code official-program identity",
            "read-only research-replay.sqlite containing the verified 20-race official-program production canary",
            "n2-pit-audit-reader-v2 dual-identity cutoff resolution",
            "official_program and trifecta_market observation lineage",
          ];
          task.invalidationCondition = "PIT audit executor contract、manifest core-digest/PIT-envelope boundary、reader-v2 identity/cutoff query、dataset identity、verified official-program canary、またはofficial_program/trifecta_market timing semanticsが変わったら再定義";
          task.objective = "N2-010 manifestのcore digestとSDK PIT envelopeを別々に検証し、reader-v2で実primaryの会場名/会場コードidentityを厳格解決した上で、検証済みofficial-program canaryと利用可能なlive-market feature joinのpoint-in-time、same-race leakage、lineage、ambiguous timingをread-onlyで再検証";
          writeFileSync(catalogPath, `${JSON.stringify(catalog, null, 2)}\n`);

          replaceOnce(
            "src/automation/n2PitAuditExecutor.ts",
            'export const N2_PIT_AUDIT_EXECUTOR_VERSION = "n2-pit-audit-executor-v2";',
            'export const N2_PIT_AUDIT_EXECUTOR_VERSION = "n2-pit-audit-executor-v3";',
          );
          replaceOnce(
            "src/automation/n2PitAuditExecutor.test.ts",
            '.run("20240601-01-01", "2024-06-01", "01", 1, "10:00");',
            '.run("20240601-桐生-01", "2024-06-01", "桐生", 1, "10:00");',
          );
          replaceOnce(
            "src/automation/n2PitAuditExecutor.test.ts",
            'assert.equal(report.executorContractVersion, "n2-pit-audit-executor-v2");',
            'assert.equal(report.executorContractVersion, "n2-pit-audit-executor-v3");',
          );
          replaceOnce(
            "src/automation/n2PitAuditIntegration.test.ts",
            'assert.equal(catalog.catalogVersion, "2026-08-06-n2-governance-v7");',
            'assert.equal(catalog.catalogVersion, "2026-08-06-n2-governance-v8");',
          );
          replaceOnce(
            "src/automation/n2PitAuditIntegration.test.ts",
            'assert.equal(task.taskDefinitionVersion, 3);',
            'assert.equal(task.taskDefinitionVersion, 4);',
          );
          replaceOnce(
            "src/automation/n2PitAuditIntegration.test.ts",
            'assert.match(String(task.invalidationCondition), /core-digest\\/PIT-envelope/);',
            'assert.match(String(task.invalidationCondition), /core-digest\\/PIT-envelope/);\n  assert.match(String(task.invalidationCondition), /reader-v2/);\n  assert.match(JSON.stringify(task.expectedInputs), /verified 20-race official-program production canary/);',
          );

          const docsPath = "docs/architecture/n2-pit-audit-executor.md";
          let docs = readFileSync(docsPath, "utf8");
          docs = docs.replace(
            "Status: registered; two guarded BLOCK records retained; manifest digest contract v3 under validation",
            "Status: production official-program canary verified; reader-v2 validated; final task definition v4 ready for one guarded audit",
          );
          docs = docs.replace(
            "The N2-011 task definition advances independently to v3 for the corrected manifest-consumer contract.",
            "The N2-011 task definition advances to v4 and executor contract to v3 after the verified 20-race production official-program canary and reader-v2 primary identity correction.",
          );
          docs = docs.replace(
            "primary race ID: YYYYMMDD-venue-zeroPaddedRaceNo",
            "primary race ID: YYYYMMDD-venueLabel-zeroPaddedRaceNo or legacy YYYYMMDD-venueCode-zeroPaddedRaceNo",
          );
          docs += `\n## Verified production observation foundation (2026-08-06)\n\n- exact manifest digest: \`151c34786e29ca80838da0fe3b2eb3326ee343d0a3656e8f20666af14d1b3a85\`;\n- official-program observations: 20 unique selected races;\n- capture attempts and joined parse/raw lineage: 20;\n- idempotent replay: 0 inserts / 20 reuses;\n- SQLite quick check: ok;\n- exact production approval: granted once and revoked, current resolution \`APPROVAL_REVOKED\`;\n- global shadow write: OFF;\n- primary selected rows: 20/20 hash-verified after WAL cleared;\n- trifecta-market observations: 0, therefore the final audit may PASS the observed official-program cohort while recording zero checked odds checkpoints.\n\nReader v2 resolves both production venue-label IDs and legacy canonical venue-code IDs. Missing, malformed, conflicting or duplicate identities remain fail-closed as ambiguous timing.\n`;
          writeFileSync(docsPath, docs);
          NODE

      - name: Commit prepared contract
        run: |
          set -euo pipefail
          git config user.name "boat-pon-research-bot"
          git config user.email "boat-pon-research-bot@users.noreply.github.com"
          git add automation/task-catalog.json src/automation/n2PitAuditExecutor.ts src/automation/n2PitAuditExecutor.test.ts src/automation/n2PitAuditIntegration.test.ts docs/architecture/n2-pit-audit-executor.md
          git commit -m "feat(research): advance N2 PIT audit contract to v4"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: temporary N2 trifecta market foundation Mac validation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: tmp-n2-trifecta-market-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-market-readonly-foundation
          fetch-depth: 0

      - name: Prevent evidence commit recursion
        id: gate
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = "test: record trifecta market real-data foundation" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert isolated change boundary
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git diff --name-only origin/main...HEAD | tee /tmp/trifecta-foundation-files.txt
          for path in \
            docs/architecture/n2-trifecta-market-readonly-foundation.md \
            scripts/report-n2-trifecta-market-foundation.ts \
            src/research-replay/n2TrifectaMarketFoundation.ts \
            src/research-replay/n2TrifectaMarketFoundation.test.ts \
            src/research-replay/n2TrifectaMarketSourceInventoryReader.ts \
            src/research-replay/n2TrifectaMarketSourceInventoryReader.test.ts; do
            grep -Fxq "$path" /tmp/trifecta-foundation-files.txt
          done
          if grep -E '^(src/(domain|decision|app_settings|production|sidecar)/|data/|backups/)' /tmp/trifecta-foundation-files.txt; then
            echo '::error::forbidden production/data path changed'
            exit 1
          fi

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Typecheck and targeted tests
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm run typecheck
          node --import tsx --test \
            src/research-replay/n2TrifectaMarketFoundation.test.ts \
            src/research-replay/n2TrifectaMarketSourceInventoryReader.test.ts

      - name: Full repository tests
        if: steps.gate.outputs.skip != 'true'
        run: npm test

      - name: Governance and product boundaries
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm run research:governance-check
          node scripts/verify-product-boundaries.mjs
          node scripts/verify-buy-line-learning-boundaries.mjs
          npm run research:golden:verify
          npm run build

      - name: Run immutable real-data foundation report
        if: steps.gate.outputs.skip != 'true'
        id: report
        run: |
          set +e
          npx tsx scripts/report-n2-trifecta-market-foundation.ts
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -f reports/n2/n2-trifecta-market-foundation.json

      - name: Validate fail-closed real-data result and write evidence
        if: steps.gate.outputs.skip != 'true' && always()
        env:
          REPORT_EXIT_CODE: ${{ steps.report.outputs.exit_code }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p reports/automation/validation
          export VALIDATED_COMMIT="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path('reports/n2/n2-trifecta-market-foundation.json')
          if not report_path.exists():
              raise SystemExit('real-data foundation report was not produced')
          report = json.loads(report_path.read_text())
          foundation = report['foundation']
          manifest = foundation['canaryManifest']
          inventory = report['inventory']
          existing = report['existingState']

          errors = []
          if int(os.environ.get('REPORT_EXIT_CODE') or 1) != 0:
              errors.append('REPORT_COMMAND_FAILED')
          if report['status'] != 'BLOCKED_NOT_READY_FOR_CANARY':
              errors.append('FOUNDATION_MUST_REMAIN_BLOCKED_WITHOUT_RAW_CANDIDATES')
          if manifest['entryCount'] != 0 or report['sourceCandidatesMaterialized'] != 0:
              errors.append('UNREVIEWED_CANDIDATES_OR_MANIFEST_ENTRIES_PRESENT')
          if report['writeAuthorized'] is not False or foundation['writeAuthorized'] is not False:
              errors.append('WRITE_AUTHORIZED')
          if report['approvalCreated'] is not False or foundation['autoCreateApproval'] is not False:
              errors.append('APPROVAL_CREATED_OR_AUTO_APPROVAL_ENABLED')
          if report['productionApplyExecuted'] is not False or foundation['productionApplyExecuted'] is not False:
              errors.append('PRODUCTION_APPLY_EXECUTED')
          if report['primaryDbWriteCount'] != 0 or report['sidecarWriteCount'] != 0:
              errors.append('DB_WRITE_COUNT_NONZERO')
          if report['dbMetadataUnchanged'] is not True:
              errors.append('DB_METADATA_CHANGED')
          if existing['trifectaMarketObservationCount'] != 0:
              errors.append('TRIFECTA_MARKET_OBSERVATION_COUNT_NOT_ZERO')
          if existing['shadowWriteEnabled'] is not False or existing['operationalGcEnabled'] is not False:
              errors.append('SHADOW_WRITE_OR_GC_ENABLED')
          if existing['approvalPresent'] is not False:
              errors.append('TRIFECTA_APPROVAL_PRESENT')
          if manifest['approvalScope'] != 'N2_TRIFECTA_MARKET_OBSERVATION_CANARY':
              errors.append('APPROVAL_SCOPE_MISMATCH')

          evidence = {
              'evidenceSchemaVersion': 'n2-trifecta-market-foundation-mac-validation-v1',
              'workflowRunId': int(os.environ['WORKFLOW_RUN_ID']),
              'workflowRunAttempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'validatedCommit': os.environ['VALIDATED_COMMIT'],
              'executionLocation': 'Mac self-hosted',
              'runner': {
                  'name': os.environ['RUNNER_NAME_VALUE'],
                  'os': os.environ['RUNNER_OS_VALUE'],
                  'arch': os.environ['RUNNER_ARCH_VALUE'],
              },
              'result': 'PASS' if not errors else 'BLOCKED',
              'errors': errors,
              'reportStatus': report['status'],
              'dataStatus': report['dataStatus'],
              'sourceTable': inventory['sourceTable'],
              'sourceRows': inventory['totalRows'],
              'sourceRaces': inventory['raceCount'],
              'checkpointCount': inventory['checkpointCount'],
              'completeSnapshotCount': inventory['completeSnapshotCount'],
              'inventoryBlockers': foundation['inventoryBlockers'],
              'candidateCount': foundation['candidateCount'],
              'safeCandidateCount': foundation['safeCandidateCount'],
              'manifestEntryCount': manifest['entryCount'],
              'manifestDigest': manifest['manifestDigest'],
              'reviewBundleDigest': foundation['reviewBundleDigest'],
              'trifectaMarketObservationCount': existing['trifectaMarketObservationCount'],
              'captureAttemptCount': existing['captureAttemptCount'],
              'writeAuthorized': False,
              'approvalCreated': False,
              'productionApplyExecuted': False,
              'primaryDbWriteCount': 0,
              'sidecarWriteCount': 0,
              'dbMetadataUnchanged': report['dbMetadataUnchanged'],
              'checks': {
                  'typecheck': 'PASS',
                  'targetedTests': 'PASS',
                  'fullRepositoryTests': 'PASS',
                  'researchGovernance': 'PASS',
                  'productBoundary': 'PASS',
                  'buyLineBoundary': 'PASS',
                  'researchReplayGolden': 'PASS',
                  'productionBuild': 'PASS',
                  'immutableRealDataInventory': 'PASS',
                  'fixtureOnlyProductionPassRejected': 'PASS',
              },
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('reports/automation/validation/n2-trifecta-market-foundation-mac.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n'
          )
          if errors:
              raise SystemExit(';'.join(errors))
          PY

      - name: Commit append-only report and validation evidence
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            reports/n2/n2-trifecta-market-foundation.json \
            reports/automation/validation/n2-trifecta-market-foundation-mac.json
          git diff --cached --check
          git commit -m 'test: record trifecta market real-data foundation'
          git push origin HEAD:agent/n2-trifecta-market-readonly-foundation

name: N2-012 intent guard validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-012-intent-guard-validation.yml"
      - "automation/requests/intents/INTENT-20260805-z4m8q2v6kn.json"

permissions:
  contents: read

concurrency:
  group: n2-012-intent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-guard:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Replay prospective push guard only
        env:
          ACTOR: m-shogo
          REPO: m-shogo/boat-pon
          EVENT: push
          BEFORE_SHA: cf2250e488fe4df1f18289712b18022ae0c4d0b0
          AFTER_SHA: 210786f7d0c966eeb2e48d3f7951988676e53e59
          COMMIT_AUTHOR: m-shogo
          COMMIT_COMMITTER: web-flow
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: |
          set -euo pipefail
          pnpm automation:guard-intent
          node scripts/assert-canonical-request.mjs canonical-request.json
          node -e 'const r=require("./canonical-request.json"); if(r.taskId!=="TASK-N2-012"||r.requestId!=="REQ-20260805-z4m8q2v6kn"||r.safetyLevel!=="L0") process.exit(1)'

name: Validate N2 PIT audit v4 contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-n2-pit-audit-v4-contract.yml"
      - "automation/task-catalog.json"
      - "src/automation/n2PitAuditExecutor.ts"
      - "src/automation/n2PitAuditExecutor.test.ts"
      - "src/automation/n2PitAuditIntegration.test.ts"
      - "docs/architecture/n2-pit-audit-executor.md"

permissions:
  contents: read

concurrency:
  group: n2-pit-audit-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted N2 PIT tests
        run: node --test --import tsx src/research-replay/n2PitAudit.test.ts src/research-replay/n2PitAuditReader.test.ts src/automation/n2PitAuditExecutor.test.ts src/automation/n2PitAuditIntegration.test.ts src/automation/n2PitAuditExternalManifest.test.ts

      - name: Validate catalog and production observations read-only
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { buildN2PitAuditSummary } from "./src/research-replay/n2PitAudit.ts";
          import { readN2PitAuditObservations, N2_PIT_AUDIT_READER_VERSION } from "./src/research-replay/n2PitAuditReader.ts";
          import { N2_PIT_AUDIT_EXECUTOR_VERSION } from "./src/automation/n2PitAuditExecutor.ts";

          const catalog = JSON.parse(readFileSync("automation/task-catalog.json", "utf8"));
          const task = catalog.tasks.find((item) => item.taskId === "TASK-N2-011");
          if (catalog.catalogVersion !== "2026-08-06-n2-governance-v8"
            || task?.taskDefinitionVersion !== 4
            || N2_PIT_AUDIT_READER_VERSION !== "n2-pit-audit-reader-v2"
            || N2_PIT_AUDIT_EXECUTOR_VERSION !== "n2-pit-audit-executor-v3") {
            throw new Error("N2_PIT_V4_CONTRACT_MISMATCH");
          }
          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const primary = join(policy.dataRoot, "data", "boat.sqlite");
          const sidecar = join(policy.dataRoot, "data", "research-replay.sqlite");
          for (const path of [primary, sidecar]) {
            const wal = `${path}-wal`;
            if (existsSync(wal) && statSync(wal).size > 0) throw new Error(`ACTIVE_WAL:${wal}`);
          }
          const read = readN2PitAuditObservations({ primaryDbPath: primary, sidecarDbPath: sidecar });
          const audit = buildN2PitAuditSummary(read.observations);
          const result = {
            catalogVersion: catalog.catalogVersion,
            taskDefinitionVersion: task.taskDefinitionVersion,
            readerVersion: N2_PIT_AUDIT_READER_VERSION,
            executorVersion: N2_PIT_AUDIT_EXECUTOR_VERSION,
            returnedObservationCount: read.returnedObservationCount,
            truncated: read.truncated,
            audit,
          };
          console.log(JSON.stringify(result, null, 2));
          if (read.returnedObservationCount !== 20
            || read.truncated
            || audit.status !== "PASS"
            || audit.dataStatus !== "REAL_DATA"
            || audit.verifiedSafeCount !== 20
            || audit.checkedFeatureCount !== 20
            || audit.checkedOddsCount !== 0
            || audit.sameRaceViolationCount !== 0
            || audit.futureViolationCount !== 0
            || audit.ambiguousTimingCount !== 0) {
            throw new Error("N2_PIT_V4_REAL_DATA_VALIDATION_FAILED");
          }
          NODE

      - name: Research governance
        run: pnpm research:governance-check

      - name: Full repository tests
        run: pnpm test

      - name: Production build
        run: pnpm build

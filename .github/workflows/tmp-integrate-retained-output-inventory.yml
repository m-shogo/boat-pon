name: Temporary integrate retained output inventory

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/research-retained-output-inventory-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/research-retained-output-inventory-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Integrate inventory into completeness, legacy and snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/automation/researchDurableKnowledgeCompleteness.ts')
          s = scanner.read_text()
          inv_import = 'import { inventoryResearchRetainedOutputs } from "./researchRetainedOutputInventory";\n'
          if inv_import not in s:
              anchor = 'import { contractDigest } from "../research/governance/contracts";\n'
              if anchor not in s: raise SystemExit('scanner import anchor missing')
              s = s.replace(anchor, anchor + inv_import, 1)
          type_anchor = '  currentOutputDigestMatchCount: number;\n'
          type_fields = '''  currentOutputDigestMatchCount: number;
            retainedOutputFileCount: number;
            retainedOutputBytes: number;
            referencedRetainedOutputCount: number;
            orphanRetainedOutputCount: number;
            invalidRetainedOutputCount: number;
          '''
          if '  retainedOutputFileCount: number;\n' not in s:
              if type_anchor not in s: raise SystemExit('scanner report type anchor missing')
              s = s.replace(type_anchor, type_fields, 1)
          generated_anchor = '  const generatedAt = new Date(generatedAtMs).toISOString();\n'
          if 'const retainedInventory = inventoryResearchRetainedOutputs' not in s:
              if generated_anchor not in s: raise SystemExit('scanner generatedAt anchor missing')
              s = s.replace(generated_anchor, generated_anchor + '  const retainedInventory = inventoryResearchRetainedOutputs({ repoRoot: input.repoRoot });\n', 1)
          nohist_status = '      status: "NO_HISTORY" as const,\n'
          nohist_new = '      status: (retainedInventory.invalidFileCount > 0 || retainedInventory.entries.length > 0 ? "BLOCKED" : "NO_HISTORY") as "BLOCKED" | "NO_HISTORY",\n'
          if nohist_status in s:
              s = s.replace(nohist_status, nohist_new, 1)
          elif nohist_new not in s: raise SystemExit('scanner no-history status anchor missing')
          nohist_count_anchor = '      currentOutputDigestMatchCount: 0,\n'
          nohist_counts = '''      currentOutputDigestMatchCount: 0,
            retainedOutputFileCount: retainedInventory.fileCount,
            retainedOutputBytes: retainedInventory.totalBytes,
            referencedRetainedOutputCount: 0,
            orphanRetainedOutputCount: retainedInventory.entries.length,
            invalidRetainedOutputCount: retainedInventory.invalidFileCount,
          '''
          if '      retainedOutputFileCount: retainedInventory.fileCount,\n' not in s:
              if nohist_count_anchor not in s: raise SystemExit('scanner no-history count anchor missing')
              s = s.replace(nohist_count_anchor, nohist_counts, 1)
          stats_anchor = '  const mutableSupersededReferenceCount = runs.reduce((sum, run) => sum + run.mutableSupersededReferenceCount, 0);\n'
          inventory_stats = '''  const mutableSupersededReferenceCount = runs.reduce((sum, run) => sum + run.mutableSupersededReferenceCount, 0);
            const retainedReferencePaths = new Set(
              runs.flatMap((run) => run.outputs)
                .filter((output) => output.rootClass === "RETAINED")
                .map((output) => output.relativePath),
            );
            const retainedInventoryPaths = new Set(retainedInventory.entries.map((entry) => entry.relativePath));
            const referencedRetainedOutputCount = [...retainedReferencePaths]
              .filter((relativePath) => retainedInventoryPaths.has(relativePath)).length;
            const orphanRetainedOutputCount = retainedInventory.entries
              .filter((entry) => !retainedReferencePaths.has(entry.relativePath)).length;
            const invalidRetainedOutputCount = retainedInventory.invalidFileCount;
          '''
          if 'const retainedReferencePaths = new Set(' not in s:
              if stats_anchor not in s: raise SystemExit('scanner inventory stats anchor missing')
              s = s.replace(stats_anchor, inventory_stats, 1)
          blocked_old = '  const blockedStructural = invalidHistoryCount > 0 || persistedDryRunCount > 0 || invalidOutputReferenceCount > 0;\n'
          blocked_new = '''  const blockedStructural = invalidHistoryCount > 0
            || persistedDryRunCount > 0
            || invalidOutputReferenceCount > 0
            || invalidRetainedOutputCount > 0
            || orphanRetainedOutputCount > 0;
          '''
          if blocked_old in s:
              s = s.replace(blocked_old, blocked_new, 1)
          elif '|| orphanRetainedOutputCount > 0;' not in s: raise SystemExit('scanner blocked structural anchor missing')
          status_old = '''  const status = runs.length === 0
            ? "NO_HISTORY" as const
            : blockedStructural
              ? "BLOCKED" as const
              : degraded
                ? "DEGRADED" as const
                : "PASS" as const;'''
          status_new = '''  const status = blockedStructural
            ? "BLOCKED" as const
            : runs.length === 0
              ? "NO_HISTORY" as const
              : degraded
                ? "DEGRADED" as const
                : "PASS" as const;'''
          if status_old in s:
              s = s.replace(status_old, status_new, 1)
          elif status_new not in s: raise SystemExit('scanner status anchor missing')
          core_anchor = '''    currentOutputDigestMatchCount: runs.flatMap((run) => run.outputs)
              .filter((output) => output.integrity === "CURRENT_OUTPUT_DIGEST_MATCH").length,
          '''
          core_counts = '''    currentOutputDigestMatchCount: runs.flatMap((run) => run.outputs)
              .filter((output) => output.integrity === "CURRENT_OUTPUT_DIGEST_MATCH").length,
            retainedOutputFileCount: retainedInventory.fileCount,
            retainedOutputBytes: retainedInventory.totalBytes,
            referencedRetainedOutputCount,
            orphanRetainedOutputCount,
            invalidRetainedOutputCount,
          '''
          if '    retainedOutputFileCount: retainedInventory.fileCount,\n' not in s[s.find('  const core = {', s.find('const blockedStructural')):]:
              if core_anchor not in s: raise SystemExit('scanner core count anchor missing')
              s = s.replace(core_anchor, core_counts, 1)
          scanner.write_text(s)

          legacy = Path('src/automation/researchDurableKnowledgeLegacyCompatibility.ts')
          l = legacy.read_text()
          legacy_block_old = '  const blockedStructural = invalidHistoryCount > 0 || persistedDryRunCount > 0 || invalidOutputReferenceCount > 0;\n'
          legacy_block_new = '''  const blockedStructural = invalidHistoryCount > 0
            || persistedDryRunCount > 0
            || invalidOutputReferenceCount > 0
            || strict.invalidRetainedOutputCount > 0
            || strict.orphanRetainedOutputCount > 0;
          '''
          if legacy_block_old in l:
              l = l.replace(legacy_block_old, legacy_block_new, 1)
          elif 'strict.orphanRetainedOutputCount > 0' not in l: raise SystemExit('legacy blocked anchor missing')
          legacy_status_old = '''  const status = runs.length === 0
            ? "NO_HISTORY" as const
            : blockedStructural
              ? "BLOCKED" as const
              : degraded
                ? "DEGRADED" as const
                : "PASS" as const;'''
          legacy_status_new = '''  const status = blockedStructural
            ? "BLOCKED" as const
            : runs.length === 0
              ? "NO_HISTORY" as const
              : degraded
                ? "DEGRADED" as const
                : "PASS" as const;'''
          if legacy_status_old in l:
              l = l.replace(legacy_status_old, legacy_status_new, 1)
          elif legacy_status_new not in l: raise SystemExit('legacy status anchor missing')
          legacy.write_text(l)

          snapshot = Path('src/automation/researchDurableRetentionSnapshot.ts')
          t = snapshot.read_text()
          snap_type_anchor = '  mutableSupersededReferenceCount: number;\n'
          snap_type_fields = '''  mutableSupersededReferenceCount: number;
            retainedOutputFileCount: number;
            retainedOutputBytes: number;
            referencedRetainedOutputCount: number;
            orphanRetainedOutputCount: number;
            invalidRetainedOutputCount: number;
          '''
          if '  retainedOutputFileCount: number;\n' not in t:
              if snap_type_anchor not in t: raise SystemExit('snapshot type anchor missing')
              t = t.replace(snap_type_anchor, snap_type_fields, 1)
          semantic_anchor = '    currentOutputDigestMatchCount: report.currentOutputDigestMatchCount,\n'
          semantic_fields = '''    currentOutputDigestMatchCount: report.currentOutputDigestMatchCount,
            retainedOutputFileCount: report.retainedOutputFileCount,
            retainedOutputBytes: report.retainedOutputBytes,
            referencedRetainedOutputCount: report.referencedRetainedOutputCount,
            orphanRetainedOutputCount: report.orphanRetainedOutputCount,
            invalidRetainedOutputCount: report.invalidRetainedOutputCount,
          '''
          if '    retainedOutputFileCount: report.retainedOutputFileCount,\n' not in t:
              if semantic_anchor not in t: raise SystemExit('snapshot semantic anchor missing')
              t = t.replace(semantic_anchor, semantic_fields, 1)
          build_anchor = '    mutableSupersededReferenceCount: input.report.mutableSupersededReferenceCount,\n'
          build_fields = '''    mutableSupersededReferenceCount: input.report.mutableSupersededReferenceCount,
            retainedOutputFileCount: input.report.retainedOutputFileCount,
            retainedOutputBytes: input.report.retainedOutputBytes,
            referencedRetainedOutputCount: input.report.referencedRetainedOutputCount,
            orphanRetainedOutputCount: input.report.orphanRetainedOutputCount,
            invalidRetainedOutputCount: input.report.invalidRetainedOutputCount,
          '''
          if '    retainedOutputFileCount: input.report.retainedOutputFileCount,\n' not in t:
              if build_anchor not in t: raise SystemExit('snapshot build anchor missing')
              t = t.replace(build_anchor, build_fields, 1)
          snapshot.write_text(t)

          audit_cli = Path('scripts/audit-research-durable-knowledge-completeness.ts')
          a = audit_cli.read_text()
          audit_anchor = '  currentOutputDigestMatchCount: report.currentOutputDigestMatchCount,\n'
          audit_fields = '''  currentOutputDigestMatchCount: report.currentOutputDigestMatchCount,
            retainedOutputFileCount: report.retainedOutputFileCount,
            retainedOutputBytes: report.retainedOutputBytes,
            referencedRetainedOutputCount: report.referencedRetainedOutputCount,
            orphanRetainedOutputCount: report.orphanRetainedOutputCount,
            invalidRetainedOutputCount: report.invalidRetainedOutputCount,
          '''
          if '  retainedOutputFileCount: report.retainedOutputFileCount,\n' not in a:
              if audit_anchor not in a: raise SystemExit('audit CLI anchor missing')
              a = a.replace(audit_anchor, audit_fields, 1)
          audit_cli.write_text(a)

          persist_cli = Path('scripts/persist-research-durable-retention-snapshot.ts')
          pc = persist_cli.read_text()
          persist_anchor = '  mutableSupersededReferenceCount: persisted.snapshot.mutableSupersededReferenceCount,\n'
          persist_fields = '''  mutableSupersededReferenceCount: persisted.snapshot.mutableSupersededReferenceCount,
            retainedOutputFileCount: persisted.snapshot.retainedOutputFileCount,
            retainedOutputBytes: persisted.snapshot.retainedOutputBytes,
            referencedRetainedOutputCount: persisted.snapshot.referencedRetainedOutputCount,
            orphanRetainedOutputCount: persisted.snapshot.orphanRetainedOutputCount,
            invalidRetainedOutputCount: persisted.snapshot.invalidRetainedOutputCount,
          '''
          if '  retainedOutputFileCount: persisted.snapshot.retainedOutputFileCount,\n' not in pc:
              if persist_anchor not in pc: raise SystemExit('persist CLI anchor missing')
              pc = pc.replace(persist_anchor, persist_fields, 1)
          persist_cli.write_text(pc)

          snap_test = Path('src/automation/researchDurableRetentionSnapshot.test.ts')
          st = snap_test.read_text()
          fixture_anchor = '    currentOutputDigestMatchCount: 1,\n'
          fixture_fields = '''    currentOutputDigestMatchCount: 1,
            retainedOutputFileCount: 0,
            retainedOutputBytes: 0,
            referencedRetainedOutputCount: 0,
            orphanRetainedOutputCount: 0,
            invalidRetainedOutputCount: 0,
          '''
          if '    retainedOutputFileCount: 0,\n' not in st:
              if fixture_anchor not in st: raise SystemExit('snapshot test fixture anchor missing')
              st = st.replace(fixture_anchor, fixture_fields, 1)
          digest_test_anchor = '''test("snapshot path is JST-day plus semantic evidence digest", () => {'''
          new_test = '''test("semantic evidence digest changes when retained inventory changes", () => {
            const first = report();
            const second = report({ retainedOutputFileCount: 1, retainedOutputBytes: 100, referencedRetainedOutputCount: 1 });
            assert.notEqual(
              computeResearchDurableRetentionEvidenceDigest(first),
              computeResearchDurableRetentionEvidenceDigest(second),
            );
          });

          '''
          if 'semantic evidence digest changes when retained inventory changes' not in st:
              if digest_test_anchor not in st: raise SystemExit('snapshot test insertion anchor missing')
              st = st.replace(digest_test_anchor, new_test + digest_test_anchor, 1)
          snap_test.write_text(st)
          PY
      - name: Verify inventory integration
        run: |
          node --test --import tsx src/automation/researchRetainedOutputInventory.test.ts
          node --test --import tsx src/automation/researchRetainedOutputInventoryIntegration.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompleteness.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeLegacyCompatibility.test.ts
          node --test --import tsx src/automation/researchDurableRetentionSnapshot.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompletenessBoundary.test.ts
          node --test --import tsx src/automation/researchDurableRetentionSnapshotBoundary.test.ts
          npm run typecheck
      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/automation/researchDurableKnowledgeCompleteness.ts \
            src/automation/researchDurableKnowledgeLegacyCompatibility.ts \
            src/automation/researchDurableRetentionSnapshot.ts \
            scripts/audit-research-durable-knowledge-completeness.ts \
            scripts/persist-research-durable-retention-snapshot.ts \
            src/automation/researchDurableRetentionSnapshot.test.ts
          git commit -m 'feat(research): audit retained output inventory'
          git push origin HEAD:feat/research-retained-output-inventory-audit

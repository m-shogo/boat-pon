name: Diagnose N2 observation rollout state

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-n2-observation-availability.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-n2-observation-availability
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assert canonical authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b8d7104483f3299a7b13a26e5d53c57f7bfe3334"
          test -z "$(git status --porcelain)"

      - name: Read rollout state and production wiring
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          import { DatabaseSync } from "node:sqlite";
          import { execFileSync } from "node:child_process";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const sidecarPath = `${policy.dataRoot}/data/research-replay.sqlite`;
          const wal = `${sidecarPath}-wal`;
          if (!existsSync(sidecarPath) || (existsSync(wal) && statSync(wal).size > 0)) {
            console.log(JSON.stringify({ status: "BLOCKED", reason: !existsSync(sidecarPath) ? "SIDECAR_NOT_FOUND" : "SIDECAR_ACTIVE_WAL" }, null, 2));
            process.exit(2);
          }
          const db = new DatabaseSync(`${pathToFileURL(sidecarPath).href}?immutable=1`, { readOnly: true });
          db.exec("PRAGMA query_only=ON; PRAGMA busy_timeout=5000;");
          try {
            const latestConfig = db.prepare(`
              SELECT shadow_write_enabled, operational_gc_enabled, kill_switch_engaged,
                     queue_capacity, max_retries, storage_quota_bytes, disk_low_water_bytes,
                     reason, occurred_at
              FROM rollout_config_events
              ORDER BY occurred_at DESC, rowid DESC LIMIT 1
            `).get() ?? null;
            const approvalScopes = db.prepare(`
              SELECT approval_scope value, COUNT(*) n
              FROM rollout_approval_events GROUP BY approval_scope ORDER BY value
            `).all().map((row) => ({ value: String(row.value), count: Number(row.n) }));
            const grantScopes = db.prepare(`
              SELECT approval_scope value, target_stage, approval_mode, COUNT(*) n
              FROM rollout_approval_grants_v2
              GROUP BY approval_scope, target_stage, approval_mode
              ORDER BY approval_scope, target_stage, approval_mode
            `).all().map((row) => ({
              scope: String(row.value),
              targetStage: String(row.target_stage),
              approvalMode: String(row.approval_mode),
              count: Number(row.n),
            }));
            const queueCounts = {
              outbox: Number(db.prepare("SELECT COUNT(*) n FROM shadow_outbox_messages").get().n),
              deliveryAttempts: Number(db.prepare("SELECT COUNT(*) n FROM shadow_delivery_attempts").get().n),
              captureAttempts: Number(db.prepare("SELECT COUNT(*) n FROM capture_attempts").get().n),
            };
            const gitFiles = (pattern) => {
              try {
                return execFileSync("git", ["grep", "-l", pattern, "--", "src", "scripts", "server", "package.json"], { encoding: "utf8" })
                  .trim().split("\n").filter(Boolean).filter((path) => !/\.test\./.test(path));
              } catch {
                return [];
              }
            };
            const officialCaptureFiles = gitFiles("captureOfficialProgramObservation");
            const officialShadowFiles = gitFiles("runPrimaryWithOfficialProgramShadow");
            const trifectaWriterFiles = gitFiles("trifecta_market").filter((path) => !/n2PitAudit|n2FeatureSourceAdapter/.test(path));
            console.log("N2_OBSERVATION_ROLLOUT_DIAGNOSTIC");
            console.log(JSON.stringify({
              status: "PASS_READ_ONLY_DIAGNOSTIC",
              readOnly: true,
              queryOnly: true,
              writesExecuted: 0,
              latestConfig,
              approvalScopes,
              grantScopes,
              queueCounts,
              productionWiring: {
                officialCaptureFiles,
                officialShadowFiles,
                trifectaWriterFiles,
                officialCaptureProductionCallerCount: officialCaptureFiles.filter((path) => !path.endsWith("n2OfficialProgramObservation.ts")).length,
                officialShadowProductionCallerCount: officialShadowFiles.filter((path) => !path.endsWith("n2OfficialProgramShadow.ts")).length,
                trifectaWriterProductionCallerCount: trifectaWriterFiles.length,
              },
            }, null, 2));
          } finally {
            db.close();
          }
          NODE

      - name: Confirm no repository mutation
        run: test -z "$(git status --porcelain)"

name: N2-013 intent guard validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-013-intent-guard-validation.yml"
      - "automation/requests/intents/INTENT-20260806-k8v3m7q2rx.json"

permissions:
  contents: read

concurrency:
  group: n2-013-intent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-guard:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Replay prospective push guard only
        env:
          ACTOR: m-shogo
          REPO: m-shogo/boat-pon
          EVENT: push
          BEFORE_SHA: cf4545b77998c196a9cc337ca66801b6d4607753
          AFTER_SHA: 0bfef89baf2714ff557d7aed6e91eee0fff9909f
          COMMIT_AUTHOR: m-shogo
          COMMIT_COMMITTER: web-flow
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: |
          set -euo pipefail
          pnpm automation:guard-intent
          node scripts/assert-canonical-request.mjs canonical-request.json
          node -e 'const r=require("./canonical-request.json"); if(r.taskId!=="TASK-N2-013"||r.requestId!=="REQ-20260806-k8v3m7q2rx"||r.safetyLevel!=="L0") process.exit(1)'

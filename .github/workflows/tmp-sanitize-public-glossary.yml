name: temporary sanitize public glossary

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: tmp-sanitize-public-glossary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-dashboard-deploy-preview
          fetch-depth: 0

      - name: Remove exact private storage filename from public copy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/presentation/glossary.ts')
          source = path.read_text()
          old = '9GBのresearch-replay.sqliteをMacでimmutable read'
          new = 'Mac上の研究用sidecarをimmutable read'
          if source.count(old) != 1:
              raise SystemExit(f'expected exact public glossary copy once, got {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- src/presentation/glossary.ts

      - name: Verify public boundaries and artifact tests
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-product-boundaries.mjs
          npm run typecheck
          node --import tsx --test \
            src/presentation/publicDeployBundle.test.ts \
            src/presentation/publicDashboard.test.ts

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/presentation/glossary.ts
          git diff --cached --check
          git commit -m 'fix(public): remove private storage filename from glossary'
          git push origin HEAD:agent/public-dashboard-deploy-preview

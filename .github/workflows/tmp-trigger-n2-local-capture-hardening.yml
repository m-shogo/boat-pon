name: Temporary trigger N2 local capture hardening

on:
  push:
    branches:
      - fix/n2-trifecta-local-capture-hardening
    paths:
      - .github/workflows/tmp-trigger-n2-local-capture-hardening.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-trigger-n2-local-capture-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-trifecta-local-capture-hardening
          fetch-depth: 0

      - name: Extract and execute reviewed patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-apply-n2-local-capture-hardening.yml')
          lines = workflow.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-hardening.py').write_text('\n'.join(script_lines) + '\n')
          PY
          python3 /tmp/apply-hardening.py
          rm -f .github/workflows/tmp-trigger-n2-local-capture-hardening.yml

      - name: Commit applied hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(research): harden local odds capture lifecycle"
          git push origin HEAD:fix/n2-trifecta-local-capture-hardening

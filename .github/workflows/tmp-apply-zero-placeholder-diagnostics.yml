name: Temporary apply zero-placeholder diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/n2-zero-placeholder-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/n2-zero-placeholder-diagnostics
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch zero-placeholder diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('src/domain/oddsParser.ts')
          p = parser.read_text()
          zero_helper = '''function isZeroOddsText(text: string): boolean {
            const normalized = text.trim().replace(/,/g, "").replace(/倍$/u, "").trim();
            if (!/^[0-9]+(?:\\.[0-9]+)?$/u.test(normalized)) return false;
            const value = Number(normalized);
            return Number.isFinite(value) && value === 0;
          }

          '''
          if 'function isZeroOddsText' not in p:
              marker = '''function isUnavailableOddsText(text: string): boolean {
            const trimmed = text.trim();
            return /^(?:-|欠場|返還)$/u.test(trimmed);
          }

          '''
              if marker not in p:
                  raise SystemExit('isUnavailableOddsText anchor not found')
              p = p.replace(marker, marker + zero_helper, 1)

          zero_counter = '''/**
           * 公式グループ表で数値の `0` / `0.0` として残っている未価格プレースホルダ数を返す。
           * `parseAllTrifectaOdds` はこれらを有効オッズとして取り込まない。診断専用であり、
           * 0 を利用可能値へ昇格させるものではない。
           */
          export function countZeroTrifectaSelections(html: string): number {
            const $ = cheerio.load(html);
            const zeroSelections = new Set<string>();

            for (const table of $("table").toArray()) {
              const $table = $(table);
              if ($table.find(".oddsPoint").length === 0) continue;

              const headerGrid = buildTableGrid($, $table.find("thead tr").toArray());
              const bodyGrid = buildTableGrid($, $table.find("tbody tr").toArray());
              if (headerGrid.length === 0 || bodyGrid.length === 0) continue;

              const firstPlaceColumns: Array<{ firstPlace: number; column: number }> = [];
              for (const row of headerGrid) {
                for (let column = 0; column < row.length; column += 1) {
                  const value = Number(row[column]?.text.trim());
                  if (Number.isInteger(value) && value >= 1 && value <= 6) {
                    firstPlaceColumns.push({ firstPlace: value, column });
                  }
                }
              }

              for (const group of firstPlaceColumns) {
                for (const row of bodyGrid) {
                  const secondCell = row[group.column];
                  const thirdCell = row[group.column + 1];
                  const oddsCell = row[group.column + 2];
                  if (!secondCell || !thirdCell || !oddsCell) continue;
                  const second = Number(secondCell.text.trim());
                  const third = Number(thirdCell.text.trim());
                  if (!Number.isInteger(second) || second < 1 || second > 6) continue;
                  if (!Number.isInteger(third) || third < 1 || third > 6) continue;
                  if (group.firstPlace === second || group.firstPlace === third || second === third) continue;
                  if (isZeroOddsText(oddsCell.text)) {
                    zeroSelections.add(`${group.firstPlace}-${second}-${third}`);
                  }
                }
              }
            }

            return zeroSelections.size;
          }

          '''
          if 'export function countZeroTrifectaSelections' not in p:
              marker = '\nfunction normalizeSelectionText(text: string) {'
              if marker not in p:
                  raise SystemExit('normalizeSelectionText anchor not found')
              p = p.replace(marker, '\n' + zero_counter + 'function normalizeSelectionText(text: string) {', 1)
          parser.write_text(p)

          canary = Path('src/research-replay/n2TrifectaRawCaptureCanary.ts')
          c = canary.read_text()
          if 'countZeroTrifectaSelections,' not in c:
              anchor = '''import {
            countUnavailableTrifectaSelections,
            parseAllTrifectaOdds,
          } from "../domain/oddsParser";'''
              replacement = '''import {
            countUnavailableTrifectaSelections,
            countZeroTrifectaSelections,
            parseAllTrifectaOdds,
          } from "../domain/oddsParser";'''
              if anchor not in c:
                  raise SystemExit('canary oddsParser import anchor not found')
              c = c.replace(anchor, replacement, 1)
          if 'zeroOddsPlaceholderCount: number;' not in c:
              anchor = '  unavailableSelectionCount: number;\n'
              if anchor not in c:
                  raise SystemExit('envelope type anchor not found')
              c = c.replace(anchor, anchor + '  zeroOddsPlaceholderCount: number;\n', 1)
          if 'const zeroOddsPlaceholderCount = countZeroTrifectaSelections(html);' not in c:
              anchor = '''  const parsedOdds = parseAllTrifectaOdds(html);
            const unavailableSelectionCount = countUnavailableTrifectaSelections(html);
            if (parsedOdds.size !== 120) blockers.push("PARSED_SELECTION_COUNT_NOT_120");'''
              replacement = '''  const parsedOdds = parseAllTrifectaOdds(html);
            const unavailableSelectionCount = countUnavailableTrifectaSelections(html);
            const zeroOddsPlaceholderCount = countZeroTrifectaSelections(html);
            if (parsedOdds.size !== 120) blockers.push("PARSED_SELECTION_COUNT_NOT_120");
            if (zeroOddsPlaceholderCount > 0) blockers.push("ZERO_ODDS_PLACEHOLDERS_PRESENT");'''
              if anchor not in c:
                  raise SystemExit('canary diagnostic anchor not found')
              c = c.replace(anchor, replacement, 1)
          if '    zeroOddsPlaceholderCount,\n' not in c:
              anchor = '    unavailableSelectionCount,\n'
              if anchor not in c:
                  raise SystemExit('canary return anchor not found')
              c = c.replace(anchor, anchor + '    zeroOddsPlaceholderCount,\n', 1)
          canary.write_text(c)
          PY
      - name: Verify diagnostics without changing parsing semantics
        run: |
          node --test --import tsx src/research-replay/n2TrifectaZeroPlaceholderDiagnostics.test.ts
          node --test --import tsx src/domain/oddsParser.test.ts
          node --test --import tsx src/research-replay/n2TrifectaRawCaptureCanary.test.ts
          npm run typecheck
      - name: Commit validated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/oddsParser.ts src/research-replay/n2TrifectaRawCaptureCanary.ts
          git commit -m 'feat(research): diagnose zero odds placeholders'
          git push origin HEAD:feat/n2-zero-placeholder-diagnostics

name: Temporary build N2 private market feature day a06ae77

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-build-n2-market-feature-day-a06ae77.yml

permissions:
  contents: read

concurrency:
  group: build-n2-market-feature-day-a06ae77
  cancel-in-progress: false

jobs:
  build-private-features:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    env:
      MAIN_SHA: a06ae77e44f42d42237e595980e8c28ed02fc79c
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
      CAPTURE_RUNTIME_SHA: 967ad45d1f72b4ad17e036a25926c1e61ba4e091
      FEATURE_DATE: '2026-08-07'
      VENUE_CODE: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a06ae77e44f42d42237e595980e8c28ed02fc79c
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fast-forward canonical main without moving immutable collector runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$CANONICAL_REPO" branch --show-current)" = main
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"
          BINDING="$CANONICAL_REPO/data/private/trifecta-capture/runtime-authority.json"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$BINDING','utf8')).authoritySha")" = "$CAPTURE_RUNTIME_SHA"
          git -C "$CANONICAL_REPO" fetch origin main
          git -C "$CANONICAL_REPO" merge --ff-only "$MAIN_SHA"
          test "$(git -C "$CANONICAL_REPO" rev-parse HEAD)" = "$MAIN_SHA"
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$BINDING','utf8')).authoritySha")" = "$CAPTURE_RUNTIME_SHA"
      - name: Install local analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANONICAL_REPO"
          npm ci
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build and verify sanitized private feature batch
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/n2-private-market-feature-day.json"
          export REPORT
          cd "$CANONICAL_REPO"
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL_REPO" \
            node node_modules/tsx/dist/cli.mjs \
            scripts/build-n2-trifecta-private-market-feature-day.ts \
            --date "$FEATURE_DATE" --venue "$VENUE_CODE" --write-private > "$REPORT"
          REPORT_EXIT=$?
          set -e
          export REPORT_EXIT
          test -s "$REPORT"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const r = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const violations = [];
          if (r.summaryVersion !== 'n2-trifecta-private-market-feature-day-summary-v1') violations.push('SUMMARY_VERSION');
          if (r.date !== process.env.FEATURE_DATE || r.venueCode !== process.env.VENUE_CODE || r.raceCount !== 12) violations.push('SCOPE');
          if (r.status === 'BLOCKED' || r.blockedCount !== 0 || Number(process.env.REPORT_EXIT) !== 0) violations.push('BATCH_BLOCKED');
          if (r.networkRequestCount !== 0 || r.databaseReadCount !== 0 || r.databaseWriteCount !== 0) violations.push('IO_BOUNDARY');
          if (r.rawOddsValuesPrinted !== false || r.rawOddsValuesPublished !== false) violations.push('RAW_PUBLICATION_BOUNDARY');
          if (r.currentBuyChanged !== false || r.lineChanged !== false || r.publicPublished !== false
            || r.automatedBettingChanged !== false || r.productionApplyExecuted !== false) violations.push('PROTECTED_BOUNDARY');
          if (!Array.isArray(r.races) || r.races.length !== 12) violations.push('RACE_COUNT');

          const expectedPrefix = `data/private/trifecta-market-features/${process.env.FEATURE_DATE}/${process.env.VENUE_CODE}/`;
          for (const race of r.races ?? []) {
            const hasData = race.status === 'PASS' || race.status === 'PARTIAL';
            if (hasData && !race.privateArtifact) {
              violations.push(`R${race.raceNo}_ARTIFACT_MISSING`);
              continue;
            }
            if (!hasData && race.privateArtifact) violations.push(`R${race.raceNo}_UNEXPECTED_ARTIFACT`);
            if (!race.privateArtifact) continue;
            const rel = race.privateArtifact.relativePath;
            if (typeof rel !== 'string' || !rel.startsWith(expectedPrefix) || path.isAbsolute(rel) || rel.includes('..')) {
              violations.push(`R${race.raceNo}_ARTIFACT_PATH`);
              continue;
            }
            const absolute = path.join(process.env.CANONICAL_REPO, rel);
            const lst = fs.lstatSync(absolute);
            const stat = fs.statSync(absolute);
            if (lst.isSymbolicLink() || !stat.isFile() || (stat.mode & 0o777) !== 0o600) {
              violations.push(`R${race.raceNo}_ARTIFACT_MODE`);
              continue;
            }
            const artifact = JSON.parse(fs.readFileSync(absolute, 'utf8'));
            if (artifact.featureArtifactVersion !== 'n2-trifecta-private-market-feature-artifact-v2'
              || artifact.raceIdentity !== race.raceIdentity
              || artifact.status !== race.status
              || artifact.sourceLoadDigest !== race.sourceLoadDigest
              || artifact.privateResearchOnly !== true
              || artifact.publicPublishAuthorized !== false
              || artifact.databaseWriteAuthorized !== false
              || artifact.currentBuyConnectionAuthorized !== false
              || artifact.lineConnectionAuthorized !== false
              || artifact.automatedBettingAuthorized !== false
              || typeof artifact.artifactDigest !== 'string'
              || !/^[0-9a-f]{64}$/.test(artifact.artifactDigest)) {
              violations.push(`R${race.raceNo}_ARTIFACT_BOUNDARY`);
            }
          }

          const summary = {
            evidenceSchemaVersion: 'n2-private-market-feature-day-live-v1',
            status: violations.length ? 'BLOCKED' : r.status,
            violations,
            date: r.date,
            venueCode: r.venueCode,
            passCount: r.passCount,
            partialCount: r.partialCount,
            noDataCount: r.noDataCount,
            blockedCount: r.blockedCount,
            loadedSnapshotCount: r.loadedSnapshotCount,
            transitionCount: r.transitionCount,
            artifactChangedCount: r.artifactChangedCount,
            artifactReusedCount: r.artifactReusedCount,
            artifactReplacedExistingCount: r.artifactReplacedExistingCount,
            races: (r.races ?? []).map((race) => ({
              raceNo: race.raceNo,
              status: race.status,
              acceptedMarkerCount: race.acceptedMarkerCount,
              loadedSnapshotCount: race.loadedSnapshotCount,
              availableCheckpoints: race.availableCheckpoints,
              missingCheckpoints: race.missingCheckpoints,
              transitionCount: race.transitionCount,
              artifactChanged: race.privateArtifact?.changed ?? false,
              artifactReplacedExisting: race.privateArtifact?.replacedExisting ?? false,
            })),
            captureRuntimeAuthorityUnchanged: process.env.CAPTURE_RUNTIME_SHA,
            networkRequestCount: r.networkRequestCount,
            databaseReadCount: r.databaseReadCount,
            databaseWriteCount: r.databaseWriteCount,
            rawOddsValuesReadPrivately: r.rawOddsValuesReadPrivately,
            rawOddsValuesPrinted: r.rawOddsValuesPrinted,
            rawOddsValuesPublished: r.rawOddsValuesPublished,
            currentBuyChanged: r.currentBuyChanged,
            lineChanged: r.lineChanged,
            publicPublished: r.publicPublished,
            automatedBettingChanged: r.automatedBettingChanged,
            productionApplyExecuted: r.productionApplyExecuted,
          };
          console.log('SANITIZED_N2_PRIVATE_MARKET_FEATURE_DAY_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('SANITIZED_N2_PRIVATE_MARKET_FEATURE_DAY_END');
          if (violations.length) process.exit(1);
          NODE

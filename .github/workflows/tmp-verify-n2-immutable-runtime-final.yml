name: Temporary verify N2 immutable runtime final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-verify-n2-immutable-runtime-final.yml

permissions:
  contents: read

concurrency:
  group: verify-n2-immutable-runtime-final-20260807
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      AUTHORITY_SHA: 8d99eab54a7ff243491d46bb4e94f255fd47274b
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
      AGENT_LABEL: com.boatpon.trifecta-private-capture
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d99eab54a7ff243491d46bb4e94f255fd47274b
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify installed immutable runtime without reinstalling
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AUTH_PATH="$CANONICAL_REPO/data/private/trifecta-capture/authorization.json"
          BINDING_PATH="$CANONICAL_REPO/data/private/trifecta-capture/runtime-authority.json"
          PLIST_PATH="$HOME/Library/LaunchAgents/$AGENT_LABEL.plist"
          BEFORE="$RUNNER_TEMP/n2-immutable-final-before.json"
          TICK="$RUNNER_TEMP/n2-immutable-final-tick.json"
          export AUTH_PATH BINDING_PATH PLIST_PATH BEFORE TICK

          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git -C "$CANONICAL_REPO" rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git -C "$CANONICAL_REPO" branch --show-current)" = main
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"
          test "$(stat -f '%Lp' "$AUTH_PATH")" = 600
          test "$(stat -f '%Lp' "$BINDING_PATH")" = 600
          test "$(stat -f '%Lp' "$PLIST_PATH")" = 644

          RUNTIME_ROOT="$(node -p "JSON.parse(require('fs').readFileSync(process.env.BINDING_PATH,'utf8')).runtimeRoot")"
          BOUND_SHA="$(node -p "JSON.parse(require('fs').readFileSync(process.env.BINDING_PATH,'utf8')).authoritySha")"
          export RUNTIME_ROOT
          test "$BOUND_SHA" = "$AUTHORITY_SHA"
          test -d "$RUNTIME_ROOT"
          test ! -L "$RUNTIME_ROOT"
          test "$(git -C "$RUNTIME_ROOT" rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -z "$(git -C "$RUNTIME_ROOT" status --porcelain --untracked-files=no)"
          ! git -C "$RUNTIME_ROOT" symbolic-ref -q HEAD >/dev/null 2>&1
          case "$RUNTIME_ROOT" in
            "$CANONICAL_REPO"|"$CANONICAL_REPO"/*|*actions-runner-*|*/_work/*) exit 1 ;;
          esac
          grep -Fq "$RUNTIME_ROOT" "$PLIST_PATH"
          grep -Fq "$AUTHORITY_SHA" "$PLIST_PATH"
          grep -Fq "$BINDING_PATH" "$PLIST_PATH"
          ! grep -Fq '/actions-runner-' "$PLIST_PATH"
          /bin/launchctl print "gui/$(id -u)/$AGENT_LABEL" >/dev/null

          node - <<'NODE' > "$BEFORE"
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const s = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return { exists: Boolean(s), bytes: s?.size ?? null, modifiedMs: s?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0 };
          }
          console.log(JSON.stringify({ primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')) }));
          NODE

          cd "$RUNTIME_ROOT"
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL_REPO" \
          BOAT_PON_LOCAL_CAPTURE_AUTH_PATH="$AUTH_PATH" \
          BOAT_PON_LOCAL_CAPTURE_RUNTIME_AUTH_PATH="$BINDING_PATH" \
          BOAT_PON_LOCAL_CAPTURE_AUTHORITY_SHA="$AUTHORITY_SHA" \
          BOAT_PON_LOCAL_CAPTURE_RUNTIME_ROOT="$RUNTIME_ROOT" \
          node "$RUNTIME_ROOT/node_modules/tsx/dist/cli.mjs" \
            "$RUNTIME_ROOT/scripts/run-n2-trifecta-local-capture-tick.ts" --json > "$TICK"
          TICK_EXIT=$?
          set -e
          export TICK_EXIT
          test -s "$TICK"

          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const s = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return { exists: Boolean(s), bytes: s?.size ?? null, modifiedMs: s?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0 };
          }
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          const after = { primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')) };
          const auth = JSON.parse(fs.readFileSync(process.env.AUTH_PATH, 'utf8'));
          const binding = JSON.parse(fs.readFileSync(process.env.BINDING_PATH, 'utf8'));
          const tick = JSON.parse(fs.readFileSync(process.env.TICK, 'utf8'));
          const days = (Date.parse(auth.expiresAt) - Date.parse(auth.issuedAt)) / 86400000;
          const violations = [];
          if (!(days > 29.9 && days <= 30.01) || auth.stage !== 'ONE_VENUE_REVIEW'
            || auth.maxRequestsPerDay !== 48) violations.push('AUTH_SCOPE_INVALID');
          if (binding.authorizationId !== auth.authorizationId || binding.issuedAt !== auth.issuedAt
            || binding.expiresAt !== auth.expiresAt || binding.authoritySha !== process.env.AUTHORITY_SHA
            || binding.runtimeRoot !== process.env.RUNTIME_ROOT) violations.push('BINDING_MISMATCH');
          if (binding.privateResearchOnly !== true || binding.databaseWriteAuthorized !== false
            || binding.currentBuyConnectionAuthorized !== false || binding.lineConnectionAuthorized !== false
            || binding.publicPublishAuthorized !== false || binding.automatedBettingAuthorized !== false) {
            violations.push('BINDING_BOUNDARY_WIDENED');
          }
          if (tick.runtimeAuthorityStatus !== 'PASS' || tick.authoritySha !== process.env.AUTHORITY_SHA
            || tick.runtimeRoot !== process.env.RUNTIME_ROOT) violations.push('TICK_RUNTIME_MISMATCH');
          if (tick.databaseWriteCount !== 0 || tick.primaryDbWriteCount !== 0 || tick.sidecarWriteCount !== 0
            || tick.currentBuyChanged !== false || tick.lineChanged !== false || tick.publicPublished !== false
            || tick.automatedBettingChanged !== false || tick.productionApplyExecuted !== false) {
            violations.push('PROTECTED_BOUNDARY_CHANGED');
          }
          if (JSON.stringify(before) !== JSON.stringify(after)) violations.push('DATABASE_METADATA_CHANGED');
          const summary = {
            evidenceSchemaVersion: 'n2-trifecta-immutable-runtime-final-verification-v1',
            status: violations.length ? 'BLOCKED' : 'PASS', violations,
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID), authoritySha: process.env.AUTHORITY_SHA,
            runtimeRoot: process.env.RUNTIME_ROOT, detachedHead: true, trackedWorktreeClean: true,
            launchdRegistered: true, plistUsesImmutableRuntime: true, plistUsesRunnerWorkspace: false,
            authorization: { issuedAt: auth.issuedAt, expiresAt: auth.expiresAt, validityDays: days,
              stage: auth.stage, maxRequestsPerDay: auth.maxRequestsPerDay,
              checkpoints: auth.checkpointLabels },
            runtimeBinding: { version: binding.authorityVersion, authorizationMatched: true,
              intervalMatched: true, authorityShaMatched: true, runtimeRootMatched: true,
              privateResearchOnly: binding.privateResearchOnly,
              databaseWriteAuthorized: binding.databaseWriteAuthorized,
              currentBuyConnectionAuthorized: binding.currentBuyConnectionAuthorized,
              lineConnectionAuthorized: binding.lineConnectionAuthorized,
              publicPublishAuthorized: binding.publicPublishAuthorized,
              automatedBettingAuthorized: binding.automatedBettingAuthorized },
            verificationTick: { exitCode: Number(process.env.TICK_EXIT), status: tick.status,
              blockers: tick.blockers, dateJst: tick.dateJst,
              runtimeAuthorityStatus: tick.runtimeAuthorityStatus,
              selectedVenueCode: tick.selectedVenueCode, selectedRaceCount: tick.selectedRaceCount,
              dueEntryCount: tick.dueEntryCount, networkRequestCount: tick.networkRequestCount,
              capturedCount: tick.capturedCount, blockedEvidenceCount: tick.blockedEvidenceCount },
            databaseMetadataUnchanged: JSON.stringify(before) === JSON.stringify(after),
            databaseWriteCount: tick.databaseWriteCount, primaryDbWriteCount: tick.primaryDbWriteCount,
            sidecarWriteCount: tick.sidecarWriteCount, currentBuyChanged: tick.currentBuyChanged,
            lineChanged: tick.lineChanged, publicPublished: tick.publicPublished,
            automatedBettingChanged: tick.automatedBettingChanged,
            productionApplyExecuted: tick.productionApplyExecuted,
            oldRuntimeCleanupExecuted: false, rawUploadedOrPublished: false,
          };
          console.log('SANITIZED_IMMUTABLE_RUNTIME_FINAL_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('SANITIZED_IMMUTABLE_RUNTIME_FINAL_END');
          if (violations.length) process.exit(1);
          NODE

name: Apply N2 reserved due checkpoint hardening v3

on:
  push:
    branches:
      - fix/n2-trifecta-skip-reserved-due-v3
    paths:
      - .github/workflows/n2-skip-reserved-due-v3.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/n2-skip-reserved-due-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-trifecta-skip-reserved-due-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install test dependencies
        run: |
          npm ci
          npm run fable:restore
      - name: Apply first-unreserved selection fix
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/research-replay/n2TrifectaLocalCaptureService.ts')
          text = path.read_text()
          pattern = re.compile(
              r'dueEntryCount = dueEntries\.length;\n'
              r'selectedEntry = dueEntries\[0\] \?\? null;\n\n'
              r'const budgetRelative = budgetDirectoryRelativePath\(date\);.*?'
              r'\n  if \(reservationCreated\) \{',
              re.S,
          )
          replacement = '''dueEntryCount = dueEntries.length;

const budgetRelative = budgetDirectoryRelativePath(date);
const budgetPath = resolveInside(input.dataRoot, budgetRelative);
mkdirSync(budgetPath, { recursive: true, mode: 0o700 });
dailyReservationCountBefore = readdirSync(budgetPath)
  .filter((name) => name.endsWith(".json"))
  .length;
dailyReservationCountAfter = dailyReservationCountBefore;

let reservationCreated = false;
for (const candidate of dueEntries) {
  const reservationKey = canonicalHash({
    authorizationId: input.authorization.authorizationId,
    raceIdentity: candidate.raceIdentity,
    checkpointLabel: candidate.checkpointLabel,
    targetCaptureAt: candidate.targetCaptureAt,
  });
  const candidateReservationPath = `${budgetRelative}/${reservationKey}.json`;
  const reservationAbsolute = resolveInside(input.dataRoot, candidateReservationPath);
  if (existsSync(reservationAbsolute)) continue;
  if (dailyReservationCountBefore >= input.authorization.maxRequestsPerDay) {
    blockers.push("DAILY_REQUEST_BUDGET_EXHAUSTED");
    break;
  }
  const reservation: N2TrifectaLocalCaptureReservation = {
    reservationVersion: N2_TRIFECTA_LOCAL_CAPTURE_RESERVATION_VERSION,
    authorizationId: input.authorization.authorizationId,
    date,
    venueCode: candidate.venueCode,
    raceIdentity: candidate.raceIdentity,
    checkpointLabel: candidate.checkpointLabel,
    targetCaptureAt: candidate.targetCaptureAt,
    reservationKey,
    reservedAt: input.now,
    networkRequestCeiling: 1,
  };
  try {
    exclusiveWrite(
      reservationAbsolute,
      `${JSON.stringify(reservation, null, 2)}\n`,
    );
    selectedEntry = candidate;
    reservationPath = candidateReservationPath;
    reservationCreated = true;
    dailyReservationCountAfter += 1;
    break;
  } catch (error) {
    if (!isAlreadyExistsError(error)) throw error;
  }
}

if (selectedEntry) {
  if (reservationCreated) {'''
          patched, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected reservation selection range once, found {count}')
          path.write_text(patched)
          PY
      - name: Test reserved-due regression
        run: node --test --import tsx src/research-replay/n2TrifectaReservedDueSelection.test.ts
      - name: Test existing local capture service
        run: node --test --import tsx src/research-replay/n2TrifectaLocalCaptureService.test.ts
      - name: Test daily-plan WAL integration
        run: node --test --import tsx src/research-replay/n2TrifectaPrivateDailyPlanIntegration.test.ts
      - name: Commit validated patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/n2-skip-reserved-due-v3.yml
          git add src/research-replay/n2TrifectaLocalCaptureService.ts
          git commit -m "fix(research): skip reserved due checkpoints"
          git push origin HEAD:fix/n2-trifecta-skip-reserved-due-v3

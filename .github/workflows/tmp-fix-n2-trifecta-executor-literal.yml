name: Temporary fix N2 trifecta executor literal

on:
  push:
    branches:
      - agent/n2-trifecta-private-capture-executor
    paths:
      - .github/workflows/tmp-fix-n2-trifecta-executor-literal.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-private-capture-executor
          fetch-depth: 0

      - name: Apply exact literal fix and remove temporary workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/research-replay/n2TrifectaPrivateCaptureExecutor.ts")
          source = path.read_text()
          old = '''export const N2_TRIFECTA_PRIVATE_CAPTURE_EXECUTOR_VERSION =
            "n2-trifecta-private-capture-executor-v1";'''
          new = '''export const N2_TRIFECTA_PRIVATE_CAPTURE_EXECUTOR_VERSION =
            "n2-trifecta-private-capture-executor-v1" as const;'''
          if source.count(old) != 1:
              raise SystemExit(f"exact replacement count must be 1, got {source.count(old)}")
          path.write_text(source.replace(old, new))
          Path(".github/workflows/tmp-fix-n2-trifecta-executor-literal.yml").unlink()
          PY

      - name: Commit exact fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research-replay/n2TrifectaPrivateCaptureExecutor.ts \
            .github/workflows/tmp-fix-n2-trifecta-executor-literal.yml
          git commit -m "fix(research): preserve executor version literal"
          git push origin HEAD:agent/n2-trifecta-private-capture-executor

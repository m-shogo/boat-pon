name: N2 official-program production canary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-official-program-production-canary.yml"

permissions:
  contents: write

concurrency:
  group: boat-pon-local-research
  cancel-in-progress: false

jobs:
  apply-bounded-canary:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 240
    steps:
      - name: Checkout exact reviewed code
        uses: actions/checkout@v4
        with:
          ref: 81e46cc9e39690652120b84aac1fa9c331f7129f
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Materialize reviewed v2 bundle
        env:
          BRANCH: automation/boat-pon-research
          BUNDLE_PATH: ${{ runner.temp }}/n2-official-program-canary-review-bundle.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81e46cc9e39690652120b84aac1fa9c331f7129f"
          git fetch origin "$BRANCH" --quiet
          git show "origin/$BRANCH:reports/n2/n2-official-program-canary-review-bundle.json" > "$BUNDLE_PATH"
          test -s "$BUNDLE_PATH"

      - name: Backup, approve, apply, verify and revoke
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          REVIEW_BUNDLE_PATH: ${{ runner.temp }}/n2-official-program-canary-review-bundle.json
          REPORT_PATH: ${{ runner.temp }}/n2-official-program-canary-apply.json
          SEALED_SHA: 81e46cc9e39690652120b84aac1fa9c331f7129f
          USER_APPROVED_AT: 2026-08-05T23:43:00.000Z
          USER_APPROVAL_REFERENCE: chatgpt:boat-pon:user-confirmation:2026-08-06T08:43+09:00
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import {
            existsSync,
            mkdirSync,
            readFileSync,
            statfsSync,
            statSync,
            writeFileSync,
          } from "node:fs";
          import { basename, join, relative } from "node:path";
          import { execFileSync } from "node:child_process";
          import {
            recordApprovalGrant,
            recordApprovalLifecycle,
          } from "./src/research-replay/approval.ts";
          import { canonicalHash } from "./src/research-replay/canonical.ts";
          import {
            applyOfficialProgramCanary,
            buildOfficialProgramCanaryManifest,
            officialProgramCanaryApprovalTarget,
            resolveOfficialProgramCanaryGate,
          } from "./src/research-replay/n2OfficialProgramCanary.ts";
          import { readOfficialProgramCanarySource } from "./src/research-replay/n2OfficialProgramCanaryReader.ts";
          import { assertOfficialProgramCanaryReviewBundle } from "./src/research-replay/n2OfficialProgramCanaryReviewBundle.ts";
          import { buildN2ObservationIngestReadiness } from "./src/research-replay/n2ObservationIngestReadiness.ts";
          import { readN2ObservationIngestReadiness } from "./src/research-replay/n2ObservationIngestReadinessReader.ts";
          import { RawStore } from "./src/research-replay/rawStore.ts";
          import { ResearchReplayRepository } from "./src/research-replay/repository.ts";
          import { backupSidecar } from "./src/research-replay/rollout.ts";
          import { openRolloutDatabase, verifyRolloutSchema } from "./src/research-replay/schema.ts";

          const GiB = 1024 * 1024 * 1024;
          const count = (db, table, where = "") => Number(
            db.prepare(`SELECT COUNT(*) n FROM ${table}${where}`).get().n,
          );
          const checkoutSha = execFileSync("git", ["rev-parse", "HEAD"], {
            encoding: "utf8",
          }).trim();
          if (checkoutSha !== process.env.SEALED_SHA) {
            throw new Error(`SEALED_SHA_MISMATCH:${checkoutSha}`);
          }

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const dataRoot = policy.dataRoot;
          const primaryPath = join(dataRoot, "data", "boat.sqlite");
          const sidecarPath = join(dataRoot, "data", "research-replay.sqlite");
          const rawRoot = join(dataRoot, "data", "research-replay-raw");
          const bundle = JSON.parse(readFileSync(process.env.REVIEW_BUNDLE_PATH, "utf8"));
          assertOfficialProgramCanaryReviewBundle(bundle);

          if (bundle.bundleVersion !== "n2-official-program-canary-review-bundle-v2") {
            throw new Error("REVIEW_BUNDLE_NOT_V2");
          }
          if (bundle.status !== "READY_FOR_HUMAN_REVIEW" || bundle.reviewBlocks.length !== 0) {
            throw new Error("REVIEW_BUNDLE_NOT_READY");
          }
          if (bundle.binding.authoritySha !== checkoutSha
            || bundle.binding.manifestCodeGitSha !== checkoutSha
            || bundle.binding.executionContract.requiredCheckoutSha !== checkoutSha) {
            throw new Error("REVIEW_BUNDLE_SHA_NOT_SEALED");
          }
          if (bundle.manifest.generatedAt !== bundle.generatedAt
            || bundle.binding.manifestGeneratedAt !== bundle.generatedAt
            || Date.parse(bundle.generatedAt) > Date.now() + 1000) {
            throw new Error("REVIEW_BUNDLE_GENERATION_TIME_INVALID");
          }
          if (bundle.manifest.binding.items.length !== 20
            || bundle.writeAuthorized !== false
            || bundle.productionApplyExecuted !== false
            || bundle.humanApprovalCreated !== false
            || bundle.binding.executionContract.productionApplyAuthorized !== false) {
            throw new Error("REVIEW_BUNDLE_WRITE_BOUNDARY_INVALID");
          }
          if (bundle.binding.currentOfficialProgramObservationCount !== 0
            || bundle.binding.currentTrifectaMarketObservationCount !== 0
            || bundle.binding.currentGlobalShadowWriteEnabled !== false
            || bundle.binding.currentKillSwitchEngaged !== false
            || bundle.binding.approvalPreview.approved !== false) {
            throw new Error("REVIEW_BUNDLE_RUNTIME_PRECONDITION_INVALID");
          }

          for (const [label, path] of [["PRIMARY", primaryPath], ["SIDECAR", sidecarPath]]) {
            if (!existsSync(path)) throw new Error(`${label}_DB_NOT_FOUND`);
            const walPath = `${path}-wal`;
            if (existsSync(walPath) && statSync(walPath).size > 0) {
              throw new Error(`${label}_ACTIVE_WAL`);
            }
          }

          const primaryBefore = statSync(primaryPath);
          const sidecarBefore = statSync(sidecarPath);
          const fs = statfsSync(dataRoot);
          const diskFreeBytes = Number(fs.bavail) * Number(fs.bsize);
          const backupRequiredBytes = sidecarBefore.size + 2 * GiB;
          if (!Number.isSafeInteger(diskFreeBytes) || diskFreeBytes < backupRequiredBytes) {
            throw new Error(`INSUFFICIENT_DISK_FOR_BACKUP:${diskFreeBytes}:${backupRequiredBytes}`);
          }

          const source = readOfficialProgramCanarySource({ primaryDbPath: primaryPath });
          if (source.readOnly !== true || source.queryOnly !== true || source.truncated === true) {
            throw new Error("PRIMARY_READER_NOT_IMMUTABLE");
          }
          const freshManifest = buildOfficialProgramCanaryManifest({
            rows: source.rows,
            cohort: source.cohort,
            sourceReadTruncated: source.truncated,
            maxRaces: 20,
            codeGitSha: checkoutSha,
            generatedAt: bundle.manifest.generatedAt,
          });
          if (canonicalHash(freshManifest) !== canonicalHash(bundle.manifest)
            || freshManifest.manifestDigest !== bundle.manifest.manifestDigest) {
            throw new Error("PRIMARY_SOURCE_UNIVERSE_DRIFTED_SINCE_REVIEW");
          }

          const readinessRead = readN2ObservationIngestReadiness({
            primaryDbPath: primaryPath,
            sidecarDbPath: sidecarPath,
          });
          const readiness = buildN2ObservationIngestReadiness(readinessRead.input);
          if (readiness.sidecar.officialProgramObservationCount !== 0
            || readiness.sidecar.trifectaMarketObservationCount !== 0
            || readiness.rollout.shadowWriteEnabled !== false
            || readiness.rollout.killSwitchEngaged !== false) {
            throw new Error("CURRENT_RUNTIME_STATE_CHANGED_SINCE_REVIEW");
          }

          mkdirSync(join(dataRoot, "data", "backups"), {
            recursive: true,
            mode: 0o700,
          });
          const backupPath = join(
            dataRoot,
            "data",
            "backups",
            `n2-official-program-canary-${process.env.GITHUB_RUN_ID}-${Date.now()}.sqlite`,
          );
          const digestPrefix = bundle.manifest.manifestDigest.slice(0, 12);
          const approvalId = `APR-N2-OP-${digestPrefix}-${process.env.GITHUB_RUN_ID}`;
          const lifecycleId = `LIF-N2-OP-${digestPrefix}-${process.env.GITHUB_RUN_ID}`;
          const approvalTarget = officialProgramCanaryApprovalTarget(bundle.manifest.manifestDigest);
          if (canonicalHash(approvalTarget) !== canonicalHash(bundle.binding.approvalTarget)) {
            throw new Error("APPROVAL_TARGET_DRIFT");
          }

          const db = openRolloutDatabase(sidecarPath);
          let approvalGranted = false;
          let approvalRevoked = false;
          let report;
          try {
            if (!verifyRolloutSchema(db).ok) throw new Error("SIDECAR_SCHEMA_INVALID");
            const before = {
              officialProgramObservations: count(
                db,
                "domain_observations",
                " WHERE observation_type='official_program'",
              ),
              trifectaMarketObservations: count(
                db,
                "domain_observations",
                " WHERE observation_type='trifecta_market'",
              ),
              captureAttempts: count(db, "capture_attempts"),
              approvalGrants: count(db, "rollout_approval_grants_v2"),
              approvalLifecycleEvents: count(db, "rollout_approval_lifecycle_events_v2"),
            };
            if (before.officialProgramObservations !== 0
              || before.trifectaMarketObservations !== 0) {
              throw new Error("OBSERVATION_COUNTS_NOT_ZERO_BEFORE_CANARY");
            }

            const gateState = {
              codeGitSha: checkoutSha,
              hasActiveWal: false,
              diskFreeBytes,
              neededBytes: 64 * 1024 * 1024,
              shadowWriteEnabled: false,
              killSwitchEngaged: false,
            };
            const preGate = resolveOfficialProgramCanaryGate(db, {
              manifest: bundle.manifest,
              executionMode: "production",
              rolloutStartedAt: new Date().toISOString(),
              onDisk: gateState,
            });
            if (preGate.approved) {
              throw new Error("EXACT_APPROVAL_ALREADY_ACTIVE_BEFORE_GRANT");
            }

            const backup = backupSidecar(db, backupPath);
            if (backup.quickCheck !== "ok" || backup.schemaOk !== true || backup.bytes <= 0) {
              throw new Error("BACKUP_VERIFICATION_FAILED");
            }

            const rolloutStartedAt = new Date().toISOString();
            recordApprovalGrant(db, {
              approvalId,
              ...approvalTarget,
              approvalSource: "chatgpt-interactive-human",
              approvalReference: `${process.env.USER_APPROVAL_REFERENCE};workflow-run:${process.env.GITHUB_RUN_ID}`,
              approvedAt: process.env.USER_APPROVED_AT,
              approvalMode: "production",
            }, rolloutStartedAt);
            approvalGranted = true;

            const repository = new ResearchReplayRepository(db, new RawStore(rawRoot));
            const gateInput = {
              executionMode: "production",
              rolloutStartedAt,
              approvalGrantId: approvalId,
              onDisk: gateState,
            };
            const firstApply = applyOfficialProgramCanary({
              db,
              repository,
              manifest: bundle.manifest,
              primaryRows: source.rows,
              gateInput,
            });
            if (firstApply.selectedCount !== 20
              || firstApply.insertedCount !== 20
              || firstApply.reusedCount !== 0
              || firstApply.primaryWriteCount !== 0
              || firstApply.globalShadowWriteEnabled !== false) {
              throw new Error(`FIRST_APPLY_RESULT_INVALID:${JSON.stringify(firstApply)}`);
            }

            const replay = applyOfficialProgramCanary({
              db,
              repository,
              manifest: bundle.manifest,
              primaryRows: source.rows,
              gateInput,
            });
            if (replay.selectedCount !== 20
              || replay.insertedCount !== 0
              || replay.reusedCount !== 20) {
              throw new Error(`IDEMPOTENT_REPLAY_INVALID:${JSON.stringify(replay)}`);
            }

            const afterApply = {
              officialProgramObservations: count(
                db,
                "domain_observations",
                " WHERE observation_type='official_program'",
              ),
              trifectaMarketObservations: count(
                db,
                "domain_observations",
                " WHERE observation_type='trifecta_market'",
              ),
              captureAttempts: count(db, "capture_attempts"),
              approvalGrants: count(db, "rollout_approval_grants_v2"),
              approvalLifecycleEvents: count(db, "rollout_approval_lifecycle_events_v2"),
              quickCheck: db.prepare("PRAGMA quick_check").get().quick_check,
            };
            if (afterApply.officialProgramObservations !== 20
              || afterApply.trifectaMarketObservations !== 0
              || afterApply.captureAttempts - before.captureAttempts !== 20
              || afterApply.approvalGrants - before.approvalGrants !== 1
              || afterApply.approvalLifecycleEvents !== before.approvalLifecycleEvents
              || afterApply.quickCheck !== "ok") {
              throw new Error(`POST_APPLY_VERIFICATION_FAILED:${JSON.stringify({ before, afterApply })}`);
            }

            const completedAt = new Date().toISOString();
            recordApprovalLifecycle(db, {
              lifecycleEventId: lifecycleId,
              eventKind: "revoked",
              subjectApprovalId: approvalId,
              replacementApprovalId: null,
              reason: "one-shot bounded official-program canary completed; approval reuse forbidden",
              source: "chatgpt-interactive-human",
              reference: `${process.env.USER_APPROVAL_REFERENCE};workflow-run:${process.env.GITHUB_RUN_ID}`,
              occurredAt: completedAt,
            }, completedAt);
            approvalRevoked = true;

            const afterRevoke = {
              approvalGrants: count(db, "rollout_approval_grants_v2"),
              approvalLifecycleEvents: count(db, "rollout_approval_lifecycle_events_v2"),
            };
            if (afterRevoke.approvalGrants - before.approvalGrants !== 1
              || afterRevoke.approvalLifecycleEvents - before.approvalLifecycleEvents !== 1) {
              throw new Error(`APPROVAL_LIFECYCLE_COUNT_INVALID:${JSON.stringify({ before, afterRevoke })}`);
            }

            const postRevokeGate = resolveOfficialProgramCanaryGate(db, {
              manifest: bundle.manifest,
              executionMode: "production",
              rolloutStartedAt: completedAt,
              approvalGrantId: approvalId,
              onDisk: gateState,
            });
            if (postRevokeGate.approved
              || postRevokeGate.approval.code !== "APPROVAL_REVOKED") {
              throw new Error(`ONE_SHOT_APPROVAL_REMAINS_USABLE:${JSON.stringify(postRevokeGate.approval)}`);
            }

            const primaryAfter = statSync(primaryPath);
            report = {
              reportVersion: "n2-official-program-production-canary-v1",
              status: "PASS",
              executedAt: completedAt,
              sourceCheckoutSha: checkoutSha,
              reviewBundleVersion: bundle.bundleVersion,
              reviewBundleDigest: bundle.bundleDigest,
              manifestDigest: bundle.manifest.manifestDigest,
              selectedRaceCount: 20,
              approval: {
                approvalId,
                approvedAt: process.env.USER_APPROVED_AT,
                source: "chatgpt-interactive-human",
                lifecycleEventId: lifecycleId,
                revokedAfterOneShot: true,
                postRevokeCode: postRevokeGate.approval.code,
              },
              backup: {
                path: relative(dataRoot, backup.path),
                fileName: basename(backup.path),
                sha256: backup.sha256,
                bytes: backup.bytes,
                quickCheck: backup.quickCheck,
                schemaOk: backup.schemaOk,
                retained: true,
              },
              before,
              afterApply,
              afterRevoke,
              firstApply,
              idempotentReplay: replay,
              primaryDatabase: {
                readOnlyReader: true,
                queryOnlyReader: true,
                writeCount: 0,
                sizeBytesBefore: primaryBefore.size,
                sizeBytesAfter: primaryAfter.size,
                modifiedMsBefore: primaryBefore.mtimeMs,
                modifiedMsAfter: primaryAfter.mtimeMs,
                metadataChangedDuringRun: primaryBefore.size !== primaryAfter.size
                  || primaryBefore.mtimeMs !== primaryAfter.mtimeMs,
              },
              sidecarDatabase: {
                sizeBytesBefore: sidecarBefore.size,
                sizeBytesAfter: statSync(sidecarPath).size,
                officialProgramObservationCount: afterApply.officialProgramObservations,
                trifectaMarketObservationCount: afterApply.trifectaMarketObservations,
              },
              globalShadowWriteEnabled: false,
              killSwitchEngaged: false,
              n2PitAuditRetried: false,
              currentBuyChanged: false,
              lineChanged: false,
              automaticBettingChanged: false,
              selectedCanonicalRaceKeys: bundle.manifest.binding.items.map(
                (item) => item.canonicalRaceKey,
              ),
            };
          } catch (error) {
            if (approvalGranted && !approvalRevoked) {
              const failedAt = new Date().toISOString();
              try {
                recordApprovalLifecycle(db, {
                  lifecycleEventId: `${lifecycleId}-FAIL`,
                  eventKind: "revoked",
                  subjectApprovalId: approvalId,
                  replacementApprovalId: null,
                  reason: `one-shot canary failed; approval revoked: ${error instanceof Error ? error.message.slice(0, 240) : "unknown"}`,
                  source: "automation-fail-closed",
                  reference: `workflow-run:${process.env.GITHUB_RUN_ID}`,
                  occurredAt: failedAt,
                }, failedAt);
              } catch (revokeError) {
                console.error("APPROVAL_REVOCATION_FAILED", revokeError);
              }
            }
            throw error;
          } finally {
            db.close();
          }

          writeFileSync(
            process.env.REPORT_PATH,
            `${JSON.stringify(report, null, 2)}\n`,
            { mode: 0o600 },
          );
          console.log("N2_OFFICIAL_PROGRAM_PRODUCTION_CANARY_PASS");
          console.log(JSON.stringify({
            manifestDigest: report.manifestDigest,
            selectedRaceCount: report.selectedRaceCount,
            insertedCount: report.firstApply.insertedCount,
            replayReusedCount: report.idempotentReplay.reusedCount,
            approvalRevoked: report.approval.revokedAfterOneShot,
            postRevokeCode: report.approval.postRevokeCode,
            backupSha256: report.backup.sha256,
          }, null, 2));
          NODE

      - name: Show sanitized result
        env:
          REPORT_PATH: ${{ runner.temp }}/n2-official-program-canary-apply.json
        run: |
          set -euo pipefail
          cat "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist sanitized evidence to automation authority
        env:
          BRANCH: automation/boat-pon-research
          REPORT_PATH: ${{ runner.temp }}/n2-official-program-canary-apply.json
          EVIDENCE_PATH: reports/n2/n2-official-program-canary-apply.json
        run: |
          set -euo pipefail
          success=false
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH" --quiet
            base="$(git rev-parse "origin/$BRANCH")"
            work="$RUNNER_TEMP/n2-canary-evidence-$attempt"
            rm -rf "$work"
            git worktree add --detach "$work" "$base" >/dev/null
            mkdir -p "$work/$(dirname "$EVIDENCE_PATH")"
            cp "$REPORT_PATH" "$work/$EVIDENCE_PATH"
            (
              cd "$work"
              git config user.name "boat-pon-research-bot"
              git config user.email "boat-pon-research-bot@users.noreply.github.com"
              git add "$EVIDENCE_PATH"
              git commit -m "evidence(n2): record official-program production canary" >/dev/null
              git push --force-with-lease="refs/heads/$BRANCH:$base" origin "HEAD:$BRANCH"
            ) && success=true || true
            git worktree remove --force "$work" >/dev/null 2>&1 || true
            if [ "$success" = true ]; then break; fi
          done
          test "$success" = true

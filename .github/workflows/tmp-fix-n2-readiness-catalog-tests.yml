name: Fix N2 readiness catalog focused tests

on:
  push:
    branches:
      - feat/n2-private-market-readiness-catalog
    paths:
      - .github/workflows/tmp-fix-n2-readiness-catalog-tests.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-n2-readiness-catalog-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/n2-private-market-readiness-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix focused catalog fixtures and boundary assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('src/research-replay/n2TrifectaPrivateMarketReadinessCatalog.test.ts')
          text = test_path.read_text()
          anchor = '    heartbeatPlanStatus: "PASS" as const,\n    automaticFreezeAuthorized: false as const,'
          replacement = '    heartbeatPlanStatus: "PASS" as const,\n    privateResearchOnly: true as const,\n    automaticFreezeAuthorized: false as const,'
          if text.count(anchor) != 1:
              raise SystemExit(f'fixture anchor count={text.count(anchor)}')
          test_path.write_text(text.replace(anchor, replacement, 1))

          boundary_path = Path('src/automation/n2PrivateMarketReadinessCatalogBoundary.test.ts')
          boundary = boundary_path.read_text()
          old = '  assert.match(source, /READINESS_CATALOG_ARTIFACT_FILE_MODE_INVALID/u);'
          new = '  assert.match(source, /\\(stat\\.mode & 0o777\\) !== 0o600/u);'
          if boundary.count(old) != 1:
              raise SystemExit(f'boundary anchor count={boundary.count(old)}')
          boundary_path.write_text(boundary.replace(old, new, 1))
          PY
      - name: Verify focused catalog tests and typecheck
        run: |
          node --test --import tsx src/research-replay/n2TrifectaPrivateMarketReadinessCatalog.test.ts
          node --test --import tsx src/automation/n2PrivateMarketReadinessCatalogBoundary.test.ts
          npm run typecheck
      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research-replay/n2TrifectaPrivateMarketReadinessCatalog.test.ts src/automation/n2PrivateMarketReadinessCatalogBoundary.test.ts
          git rm .github/workflows/tmp-fix-n2-readiness-catalog-tests.yml
          git commit -m "test(research): fix readiness catalog fixtures"
          git push origin HEAD:feat/n2-private-market-readiness-catalog

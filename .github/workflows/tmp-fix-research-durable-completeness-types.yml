name: Finish research durable completeness types

on:
  push:
    branches:
      - feat/research-durable-knowledge-completeness

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-durable-knowledge-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Narrow history directory literal and fixture option
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('src/automation/researchDurableKnowledgeCompleteness.ts')
          text = src.read_text()
          old = '      historyRelativeDir: HISTORY_RELATIVE_DIR,\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'historyRelativeDir anchor count={count}')
          text = text.replace(old, '      historyRelativeDir: HISTORY_RELATIVE_DIR as typeof HISTORY_RELATIVE_DIR,\n')
          src.write_text(text)

          test = Path('src/automation/researchDurableKnowledgeCompleteness.test.ts')
          t = test.read_text()
          old_call = 'buildResearchDurableKnowledgeCompletenessReport({ rootDir: root } as never)'
          if old_call in t:
              t = t.replace(old_call, 'buildResearchDurableKnowledgeCompletenessReport({ repoRoot: root })', 1)
          test.write_text(t)
          PY
      - name: Verify focused completeness tests and typecheck
        run: |
          node --test --import tsx src/automation/researchDurableKnowledgeCompleteness.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompletenessBoundary.test.ts
          npm run typecheck
      - name: Commit validated fix and remove temporary trigger files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation/researchDurableKnowledgeCompleteness.ts src/automation/researchDurableKnowledgeCompleteness.test.ts
          git rm .github/workflows/tmp-fix-research-durable-completeness-types.yml
          if [ -f .github/tmp-durable-completeness-trigger.txt ]; then git rm .github/tmp-durable-completeness-trigger.txt; fi
          git commit -m "fix(research): narrow durable completeness literals"
          git push origin HEAD:feat/research-durable-knowledge-completeness

name: Temporary verify installed N2 trifecta capture agent

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-install-latest-n2-trifecta-capture-agent.yml

permissions:
  contents: read

concurrency:
  group: verify-installed-n2-trifecta-capture-agent
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      AUTHORITY_SHA: 2c100f8aed6403bd8fc9fd43da0f2ea129857216
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
      AGENT_LABEL: com.boatpon.trifecta-private-capture
    steps:
      - name: Checkout exact installed authority
        uses: actions/checkout@v4
        with:
          ref: 2c100f8aed6403bd8fc9fd43da0f2ea129857216
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify existing installation and run one idempotent tick
        working-directory: /Users/m-shogo/Developer/personal/boat-pon
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          AUTH_PATH="$CANONICAL_REPO/data/private/trifecta-capture/authorization.json"
          PLIST_PATH="$HOME/Library/LaunchAgents/$AGENT_LABEL.plist"
          TICK_OUT="$RUNNER_TEMP/n2-installed-agent-verification-tick.json"
          BEFORE_OUT="$RUNNER_TEMP/n2-installed-agent-verification-before.json"

          test -f "$AUTH_PATH"
          test -f "$PLIST_PATH"
          test "$(stat -f '%Lp' "$AUTH_PATH")" = "600"
          test "$(stat -f '%Lp' "$PLIST_PATH")" = "644"
          grep -Fq "$CANONICAL_REPO" "$PLIST_PATH"
          ! grep -Fq '/actions-runner-' "$PLIST_PATH"
          /bin/launchctl print "gui/$(id -u)/$AGENT_LABEL" >/dev/null

          node - <<'NODE' > "$BEFORE_OUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          console.log(JSON.stringify({
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          }));
          NODE

          set +e
          npx tsx scripts/run-n2-trifecta-local-capture-tick.ts --json > "$TICK_OUT"
          tick_exit=$?
          set -e
          test -s "$TICK_OUT"

          AUTH_PATH="$AUTH_PATH" TICK_OUT="$TICK_OUT" BEFORE_OUT="$BEFORE_OUT" TICK_EXIT="$tick_exit" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_OUT, 'utf8'));
          const after = {
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          };
          const auth = JSON.parse(fs.readFileSync(process.env.AUTH_PATH, 'utf8'));
          const tick = JSON.parse(fs.readFileSync(process.env.TICK_OUT, 'utf8'));
          const validityDays = (Date.parse(auth.expiresAt) - Date.parse(auth.issuedAt)) / 86400000;
          const violations = [];
          if (!(validityDays > 29.9 && validityDays <= 30.01)) violations.push('AUTH_DURATION_INVALID');
          if (auth.stage !== 'ONE_VENUE_REVIEW' || auth.maxRequestsPerDay !== 48) violations.push('AUTH_SCOPE_INVALID');
          if (JSON.stringify(auth.checkpointLabels) !== JSON.stringify(['T-30','T-20','T-10','T-5'])) violations.push('CHECKPOINT_POLICY_INVALID');
          if (auth.privateResearchOnly !== true
            || auth.publicRedistributionAuthorized !== false
            || auth.databaseWriteAuthorized !== false
            || auth.currentBuyConnectionAuthorized !== false
            || auth.lineConnectionAuthorized !== false
            || auth.automatedBettingAuthorized !== false) violations.push('AUTH_BOUNDARY_WIDENED');
          if (tick.databaseWriteCount !== 0
            || tick.primaryDbWriteCount !== 0
            || tick.sidecarWriteCount !== 0
            || tick.currentBuyChanged !== false
            || tick.lineChanged !== false
            || tick.publicPublished !== false
            || tick.automatedBettingChanged !== false
            || tick.productionApplyExecuted !== false) violations.push('PROTECTED_BOUNDARY_CHANGED');
          if (JSON.stringify(before) !== JSON.stringify(after)) violations.push('DATABASE_METADATA_CHANGED');
          const summary = {
            evidenceSchemaVersion: 'n2-trifecta-installed-agent-verification-v1',
            status: violations.length === 0 ? 'PASS' : 'BLOCKED',
            violations,
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            authoritySha: process.env.AUTHORITY_SHA,
            canonicalRepoCleanMain: true,
            launchdRegistered: true,
            plistUsesCanonicalRepo: true,
            plistUsesRunnerWorkspace: false,
            authorization: {
              version: auth.authorizationVersion,
              issuedAt: auth.issuedAt,
              expiresAt: auth.expiresAt,
              validityDays,
              stage: auth.stage,
              maxRequestsPerDay: auth.maxRequestsPerDay,
              checkpoints: auth.checkpointLabels,
              privateResearchOnly: auth.privateResearchOnly,
              publicRedistributionAuthorized: auth.publicRedistributionAuthorized,
              databaseWriteAuthorized: auth.databaseWriteAuthorized,
              currentBuyConnectionAuthorized: auth.currentBuyConnectionAuthorized,
              lineConnectionAuthorized: auth.lineConnectionAuthorized,
              automatedBettingAuthorized: auth.automatedBettingAuthorized,
              codeAuthorityBound: typeof auth.authoritySha === 'string',
            },
            verificationTick: {
              exitCode: Number(process.env.TICK_EXIT),
              status: tick.status,
              blockers: tick.blockers,
              dateJst: tick.dateJst,
              selectedVenueCode: tick.selectedVenueCode,
              selectedRaceCount: tick.selectedRaceCount,
              dueEntryCount: tick.dueEntryCount,
              networkRequestCount: tick.networkRequestCount,
              capturedCount: tick.executorReport?.capturedCount ?? 0,
              blockedEvidenceCount: tick.executorReport?.blockedEvidenceCount ?? 0,
            },
            databaseMetadataUnchanged: JSON.stringify(before) === JSON.stringify(after),
            databaseWriteCount: tick.databaseWriteCount,
            primaryDbWriteCount: tick.primaryDbWriteCount,
            sidecarWriteCount: tick.sidecarWriteCount,
            currentBuyChanged: tick.currentBuyChanged,
            lineChanged: tick.lineChanged,
            publicPublished: tick.publicPublished,
            automatedBettingChanged: tick.automatedBettingChanged,
            productionApplyExecuted: tick.productionApplyExecuted,
            rawUploadedOrPublished: false,
          };
          console.log('SANITIZED_INSTALL_VERIFICATION_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('SANITIZED_INSTALL_VERIFICATION_END');
          if (violations.length > 0) process.exit(1);
          NODE

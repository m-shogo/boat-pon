name: N2 official program review bundle validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-official-program-review-bundle-validation.yml"
      - "automation/phase-mapping.json"
      - "automation/task-catalog.json"
      - "docs/architecture/n2-official-program-canary.md"
      - "scripts/automation-commit.sh"
      - "src/automation/n2OfficialProgramCanaryReviewBundle*.ts"
      - "src/automation/taskExecutors.ts"
      - "src/research-replay/n2OfficialProgramCanaryReviewBundle*.ts"

permissions:
  contents: read

concurrency:
  group: n2-official-program-review-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted review-bundle tests
        run: |
          node --test --import tsx \
            src/research-replay/n2OfficialProgramCanaryReviewBundle.test.ts \
            src/automation/n2OfficialProgramCanaryReviewBundleIntegration.test.ts \
            src/research-replay/n2OfficialProgramCanary.test.ts \
            src/research-replay/n2OfficialProgramCanaryIdentity.test.ts \
            src/research-replay/n2OfficialProgramCanaryReader.test.ts

      - name: Execute real read-only review bundle
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync, rmSync, statSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { pathToFileURL } from "node:url";
          import { DatabaseSync } from "node:sqlite";
          import { runN2OfficialProgramCanaryReviewBundleExecutor } from "./src/automation/n2OfficialProgramCanaryReviewBundleExecutor.ts";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const sidecarPath = `${policy.dataRoot}/data/research-replay.sqlite`;
          const primaryPath = join(dirname(sidecarPath), "boat.sqlite");
          const outputPath = "reports/n2/n2-official-program-canary-review-bundle.json";
          rmSync(outputPath, { force: true });
          const primaryBefore = statSync(primaryPath);
          const sidecarBefore = statSync(sidecarPath);
          const approvalDb = new DatabaseSync(`${pathToFileURL(sidecarPath).href}?immutable=1`, { readOnly: true });
          approvalDb.exec("PRAGMA query_only=ON");
          const approvalCountBefore = Number(approvalDb.prepare("SELECT COUNT(*) n FROM rollout_approval_events").get().n);
          approvalDb.close();

          const result = runN2OfficialProgramCanaryReviewBundleExecutor({
            repoRoot: process.cwd(),
            runId: "mac-real-review-bundle-validation",
            requestId: "REQ-MAC-REAL-REVIEW-BUNDLE",
            taskId: "TASK-N2-013",
            sidecarPath,
            historyDir: "reports/automation/history",
            reportsDir: "reports/n2",
            dryRun: false,
            taskStatuses: { "TASK-N2-012": "PASS" },
          });
          if (result.result !== "PASS") throw new Error(`EXECUTOR_NOT_PASS:${JSON.stringify(result)}`);
          const report = JSON.parse(readFileSync(outputPath, "utf8"));
          if (report.status !== "READY_FOR_HUMAN_REVIEW") throw new Error(`REVIEW_STATUS:${report.status}`);
          if (report.writeAuthorized !== false
            || report.productionApplyExecuted !== false
            || report.humanApprovalCreated !== false
            || report.binding.executionContract.productionApplyAuthorized !== false) {
            throw new Error("WRITE_AUTHORIZATION_LEAK");
          }
          if (report.manifest.binding.items.length !== 20
            || report.manifest.binding.sourceRowCount !== 1013
            || report.manifest.binding.eligibleRowCount !== 1011
            || report.manifest.binding.excludedCount !== 2) {
            throw new Error("REAL_MANIFEST_COUNTS_CHANGED");
          }
          if (report.binding.approvalPreview.approved !== false
            || report.binding.approvalPreview.approvalId !== null
            || typeof report.binding.approvalPreview.code !== "string"
            || report.binding.approvalPreview.code === "APPROVED"
            || !Array.isArray(report.binding.approvalPreview.blocks)
            || report.binding.approvalPreview.blocks.length === 0) {
            throw new Error(`UNEXPECTED_APPROVAL_PREVIEW:${JSON.stringify(report.binding.approvalPreview)}`);
          }
          if (report.binding.authoritySha !== report.manifest.binding.codeGitSha
            || report.binding.executionContract.requiredCheckoutSha !== report.binding.authoritySha) {
            throw new Error("CHECKOUT_SHA_BINDING_FAILED");
          }
          const serialized = JSON.stringify(report);
          if (serialized.includes("rawJson") || serialized.includes(policy.dataRoot)) {
            throw new Error("PRIVATE_SOURCE_MATERIAL_LEAKED");
          }
          rmSync(outputPath, { force: true });
          const approvalDbAfter = new DatabaseSync(`${pathToFileURL(sidecarPath).href}?immutable=1`, { readOnly: true });
          approvalDbAfter.exec("PRAGMA query_only=ON");
          const approvalCountAfter = Number(approvalDbAfter.prepare("SELECT COUNT(*) n FROM rollout_approval_events").get().n);
          approvalDbAfter.close();
          const primaryAfter = statSync(primaryPath);
          const sidecarAfter = statSync(sidecarPath);
          if (primaryAfter.size !== primaryBefore.size || primaryAfter.mtimeMs !== primaryBefore.mtimeMs) {
            throw new Error("PRIMARY_DB_CHANGED");
          }
          if (sidecarAfter.size !== sidecarBefore.size || sidecarAfter.mtimeMs !== sidecarBefore.mtimeMs) {
            throw new Error("SIDECAR_DB_CHANGED");
          }
          if (approvalCountAfter !== approvalCountBefore) throw new Error("APPROVAL_ROWS_CHANGED");
          console.log("N2_OFFICIAL_PROGRAM_REVIEW_BUNDLE_REAL_DB");
          console.log(JSON.stringify({
            result: result.result,
            status: report.status,
            selectedRows: report.manifest.binding.items.length,
            sourceRows: report.manifest.binding.sourceRowCount,
            eligibleRows: report.manifest.binding.eligibleRowCount,
            excludedRows: report.manifest.binding.excludedCount,
            approvalCode: report.binding.approvalPreview.code,
            writeAuthorized: report.writeAuthorized,
            productionApplyExecuted: report.productionApplyExecuted,
            humanApprovalCreated: report.humanApprovalCreated,
            primaryWriteCount: report.primaryDatabaseWriteCount,
            sidecarWriteCount: report.sidecarDatabaseWriteCount,
            approvalWriteCount: report.approvalWriteCount,
          }, null, 2));
          NODE
          test -z "$(git status --porcelain)"

      - name: Research governance
        run: pnpm exec tsx scripts/research-governance-check.ts

      - name: Full tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"

name: Patch N2 day index semantic idempotency

on:
  push:
    branches:
      - fix/n2-day-index-semantic-idempotency
    paths:
      - .github/workflows/tmp-patch-n2-day-index-semantic-idempotency.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-patch-n2-day-index-semantic-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/n2-day-index-semantic-idempotency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Make existing verified day index semantic-idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.ts')
          text = src.read_text()
          old = '''        const current = JSON.parse(readFileSync(path, "utf8")) as { indexDigest?: unknown };
                  if (current.indexDigest === input.index.indexDigest) {
                    return { relativePath, changed: false, indexDigest: input.index.indexDigest, fileMode: 0o600 };
                  }'''
          new = '''        const current = JSON.parse(readFileSync(path, "utf8")) as N2TrifectaPrivateMarketFeatureDayIndex;
                  if (typeof current.indexDigest === "string" && /^[0-9a-f]{64}$/u.test(current.indexDigest)
                    && typeof current.generatedAt === "string" && Number.isFinite(Date.parse(current.generatedAt))) {
                    const { indexDigest: currentDigest, ...currentCore } = current;
                    if (canonicalHash(currentCore) === currentDigest) {
                      if (currentDigest === input.index.indexDigest) {
                        return { relativePath, changed: false, indexDigest: currentDigest, fileMode: 0o600 };
                      }
                      const { generatedAt: _currentGeneratedAt, ...currentSemanticCore } = currentCore;
                      const {
                        indexDigest: _nextDigest,
                        generatedAt: _nextGeneratedAt,
                        ...nextSemanticCore
                      } = input.index;
                      if (canonicalHash(currentSemanticCore) === canonicalHash(nextSemanticCore)) {
                        return { relativePath, changed: false, indexDigest: currentDigest, fileMode: 0o600 };
                      }
                    }
                  }'''
          if old not in text:
              raise SystemExit('source narrow anchor not found')
          src.write_text(text.replace(old, new, 1))

          test = Path('src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.test.ts')
          t = test.read_text()
          anchor = 'test("tampered or permission-widened feature artifacts fail closed", () => {'
          if anchor not in t:
              raise SystemExit('test anchor not found')
          addition = '''test("semantically identical index reuses existing digest across generatedAt changes", () => {
            withRoot((root) => {
              writeN2TrifectaPrivateMarketFeatureArtifact({
                rootDir: root,
                report: syntheticReport({ raceNo: 4, status: "PASS", availableCount: 4 }),
                generatedAt: "2026-08-07T02:00:00.000Z",
              });
              const firstIndex = buildN2TrifectaPrivateMarketFeatureDayIndex({
                rootDir: root,
                date: "2026-08-07",
                venueCode: "10",
                generatedAt: "2026-08-07T02:05:00.000Z",
              });
              const first = writeN2TrifectaPrivateMarketFeatureDayIndex({ rootDir: root, index: firstIndex });
              const laterIndex = buildN2TrifectaPrivateMarketFeatureDayIndex({
                rootDir: root,
                date: "2026-08-07",
                venueCode: "10",
                generatedAt: "2026-08-07T02:10:00.000Z",
              });
              assert.notEqual(laterIndex.indexDigest, firstIndex.indexDigest);
              const second = writeN2TrifectaPrivateMarketFeatureDayIndex({ rootDir: root, index: laterIndex });
              assert.equal(second.changed, false);
              assert.equal(second.indexDigest, first.indexDigest);
              const disk = JSON.parse(readFileSync(join(root, second.relativePath), "utf8")) as Record<string, unknown>;
              assert.equal(disk.indexDigest, first.indexDigest);
              assert.equal(disk.generatedAt, firstIndex.generatedAt);
            });
          });

          test("tampered existing index is rebuilt instead of semantically reused", () => {
            withRoot((root) => {
              writeN2TrifectaPrivateMarketFeatureArtifact({
                rootDir: root,
                report: syntheticReport({ raceNo: 4, status: "PASS", availableCount: 4 }),
                generatedAt: "2026-08-07T02:00:00.000Z",
              });
              const firstIndex = buildN2TrifectaPrivateMarketFeatureDayIndex({
                rootDir: root,
                date: "2026-08-07",
                venueCode: "10",
                generatedAt: "2026-08-07T02:05:00.000Z",
              });
              const first = writeN2TrifectaPrivateMarketFeatureDayIndex({ rootDir: root, index: firstIndex });
              const path = join(root, first.relativePath);
              const tampered = JSON.parse(readFileSync(path, "utf8")) as Record<string, unknown>;
              tampered.generatedAt = "2026-08-07T02:06:00.000Z";
              writeFileSync(path, `${JSON.stringify(tampered, null, 2)}\\n`, "utf8");

              const laterIndex = buildN2TrifectaPrivateMarketFeatureDayIndex({
                rootDir: root,
                date: "2026-08-07",
                venueCode: "10",
                generatedAt: "2026-08-07T02:10:00.000Z",
              });
              const second = writeN2TrifectaPrivateMarketFeatureDayIndex({ rootDir: root, index: laterIndex });
              assert.equal(second.changed, true);
              assert.equal(second.indexDigest, laterIndex.indexDigest);
              const disk = JSON.parse(readFileSync(path, "utf8")) as Record<string, unknown>;
              assert.equal(disk.indexDigest, laterIndex.indexDigest);
              assert.equal(disk.generatedAt, laterIndex.generatedAt);
            });
          });

          '''
          test.write_text(t.replace(anchor, addition + anchor, 1))
          PY
      - name: Verify focused tests and typecheck
        run: |
          node --test --import tsx src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.test.ts
          npm run typecheck
      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.ts src/research-replay/n2TrifectaPrivateMarketFeatureDayIndex.test.ts
          git rm .github/workflows/tmp-patch-n2-day-index-semantic-idempotency.yml
          git commit -m "fix(research): keep day index digest stable without feature changes"
          git push origin HEAD:fix/n2-day-index-semantic-idempotency

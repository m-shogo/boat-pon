name: Fix N2 private daily plan summary

on:
  push:
    branches:
      - feat/n2-trifecta-private-daily-plan-cache
    paths:
      - .github/workflows/n2-private-daily-plan-summary-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/n2-trifecta-private-daily-plan-cache
          fetch-depth: 0
      - name: Count only complete 12R/48-entry plans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-n2-trifecta-private-daily-plan.ts')
          text = path.read_text()
          old = '''  const plans = planResults\n    .filter((result) => result.status === "PASS")\n    .map((result) => result.plan);\n  const incompleteVenueCount = planResults.length - plans.length;\n\n  const cache = buildN2TrifectaPrivateDailyPlanCache({\n    date: requestedDate,\n    generatedAt: now.toISOString(),\n    plans,\n    source,\n  });\n'''
          new = '''  const completePlans = planResults\n    .filter((result) => result.status === "PASS"\n      && result.plan.raceCount === 12\n      && result.plan.requestBudget === 48\n      && result.plan.entries.length === 48)\n    .map((result) => result.plan);\n  const incompleteVenueCount = planResults.length - completePlans.length;\n\n  const cache = buildN2TrifectaPrivateDailyPlanCache({\n    date: requestedDate,\n    generatedAt: now.toISOString(),\n    plans: completePlans,\n    source,\n  });\n'''
          if text.count(old) != 1:
            raise SystemExit('generator plan-count anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('completeVenuePlanCount: plans.length,', 'completeVenuePlanCount: completePlans.length,', 1)
          path.write_text(text)
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/n2-private-daily-plan-summary-fix.yml
          git add scripts/generate-n2-trifecta-private-daily-plan.ts
          git commit -m "fix(research): report only complete daily venue plans"
          git push origin HEAD:feat/n2-trifecta-private-daily-plan-cache

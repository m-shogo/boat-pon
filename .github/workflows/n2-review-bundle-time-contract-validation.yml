name: N2 review bundle time contract validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-review-bundle-time-contract-validation.yml"
      - "automation/task-catalog.json"
      - "docs/architecture/n2-official-program-canary.md"
      - "src/automation/n2*Integration.test.ts"
      - "src/automation/n2OfficialProgramCanaryReviewBundleExecutor.ts"
      - "src/research-replay/n2OfficialProgramCanaryReviewBundle*.ts"

permissions:
  contents: read

concurrency:
  group: n2-review-bundle-time-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted time-contract tests
        run: |
          node --test --import tsx \
            src/research-replay/n2OfficialProgramCanaryReviewBundle.test.ts \
            src/automation/n2OfficialProgramCanaryReviewBundleIntegration.test.ts \
            src/automation/n2ObservationIngestReadinessIntegration.test.ts \
            src/automation/n2PitAuditIntegration.test.ts

      - name: Execute real factual-time bundle read-only
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync, rmSync, statSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { pathToFileURL } from "node:url";
          import { DatabaseSync } from "node:sqlite";
          import { runN2OfficialProgramCanaryReviewBundleExecutor } from "./src/automation/n2OfficialProgramCanaryReviewBundleExecutor.ts";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const sidecarPath = `${policy.dataRoot}/data/research-replay.sqlite`;
          const primaryPath = join(dirname(sidecarPath), "boat.sqlite");
          const outputPath = "reports/n2/n2-official-program-canary-review-bundle.json";
          rmSync(outputPath, { force: true });
          const startedAt = new Date();
          const primaryBefore = statSync(primaryPath);
          const sidecarBefore = statSync(sidecarPath);
          const approvalDb = new DatabaseSync(`${pathToFileURL(sidecarPath).href}?immutable=1`, { readOnly: true });
          approvalDb.exec("PRAGMA query_only=ON");
          const approvalCountBefore = Number(approvalDb.prepare("SELECT COUNT(*) n FROM rollout_approval_events").get().n);
          approvalDb.close();

          const result = runN2OfficialProgramCanaryReviewBundleExecutor({
            repoRoot: process.cwd(),
            runId: "mac-factual-time-validation",
            requestId: "REQ-MAC-FACTUAL-TIME",
            taskId: "TASK-N2-013",
            sidecarPath,
            historyDir: "reports/automation/history",
            reportsDir: "reports/n2",
            dryRun: false,
            taskStatuses: { "TASK-N2-012": "PASS" },
          });
          const finishedAt = new Date();
          if (result.result !== "PASS") throw new Error(`EXECUTOR_NOT_PASS:${JSON.stringify(result)}`);
          const report = JSON.parse(readFileSync(outputPath, "utf8"));
          const manifestAt = Date.parse(report.manifest.generatedAt);
          const bundleAt = Date.parse(report.generatedAt);
          if (!Number.isFinite(manifestAt) || !Number.isFinite(bundleAt)) throw new Error("INVALID_GENERATION_TIME");
          if (report.manifest.generatedAt !== report.generatedAt
            || report.binding.manifestGeneratedAt !== report.manifest.generatedAt
            || manifestAt < startedAt.getTime() - 1000
            || bundleAt > finishedAt.getTime() + 1000
            || manifestAt > bundleAt) {
            throw new Error(`FACTUAL_TIME_CONTRACT_FAILED:${JSON.stringify({
              startedAt: startedAt.toISOString(),
              finishedAt: finishedAt.toISOString(),
              manifestAt: report.manifest.generatedAt,
              bundleAt: report.generatedAt,
              bindingAt: report.binding.manifestGeneratedAt,
            })}`);
          }
          if (report.bundleVersion !== "n2-official-program-canary-review-bundle-v2"
            || report.executorContractVersion !== "n2-official-program-canary-review-executor-v2"
            || report.binding.reviewPolicyVersion !== "n2-official-program-canary-review-policy-v2"
            || report.binding.executionContract.manifestGeneratedAtMustNotExceedBundleGeneratedAt !== true) {
            throw new Error("V2_TIME_CONTRACT_NOT_SEALED");
          }
          if (report.status !== "READY_FOR_HUMAN_REVIEW"
            || report.writeAuthorized !== false
            || report.productionApplyExecuted !== false
            || report.humanApprovalCreated !== false) {
            throw new Error("REVIEW_SAFETY_CHANGED");
          }
          if (report.manifest.binding.items.length !== 20
            || report.manifest.binding.sourceRowCount !== 1013
            || report.manifest.binding.eligibleRowCount !== 1011
            || report.manifest.binding.excludedCount !== 2) {
            throw new Error("REAL_MANIFEST_COUNTS_CHANGED");
          }
          rmSync(outputPath, { force: true });
          const approvalDbAfter = new DatabaseSync(`${pathToFileURL(sidecarPath).href}?immutable=1`, { readOnly: true });
          approvalDbAfter.exec("PRAGMA query_only=ON");
          const approvalCountAfter = Number(approvalDbAfter.prepare("SELECT COUNT(*) n FROM rollout_approval_events").get().n);
          approvalDbAfter.close();
          const primaryAfter = statSync(primaryPath);
          const sidecarAfter = statSync(sidecarPath);
          if (primaryAfter.size !== primaryBefore.size || primaryAfter.mtimeMs !== primaryBefore.mtimeMs) throw new Error("PRIMARY_DB_CHANGED");
          if (sidecarAfter.size !== sidecarBefore.size || sidecarAfter.mtimeMs !== sidecarBefore.mtimeMs) throw new Error("SIDECAR_DB_CHANGED");
          if (approvalCountAfter !== approvalCountBefore) throw new Error("APPROVAL_ROWS_CHANGED");
          console.log("N2_REVIEW_BUNDLE_FACTUAL_TIME_REAL_DB");
          console.log(JSON.stringify({
            result: result.result,
            status: report.status,
            manifestGeneratedAt: report.manifest.generatedAt,
            bundleGeneratedAt: report.generatedAt,
            selectedRows: report.manifest.binding.items.length,
            writeAuthorized: report.writeAuthorized,
            productionApplyExecuted: report.productionApplyExecuted,
            humanApprovalCreated: report.humanApprovalCreated,
          }, null, 2));
          NODE
          test -z "$(git status --porcelain)"

      - name: Research governance
        run: pnpm exec tsx scripts/research-governance-check.ts

      - name: Full tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"

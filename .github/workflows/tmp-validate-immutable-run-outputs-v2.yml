name: Temporary immutable run output validation v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.head_ref == 'feat/research-immutable-run-outputs-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: feat/research-immutable-run-outputs-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Patch scanner and runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scanner = Path('src/automation/researchDurableKnowledgeCompleteness.ts')
          s = scanner.read_text()
          old = '''export type ResearchDurableOutputIntegrity =
  | "REGISTRY_SELF_DIGEST_VERIFIED"
'''
          new = '''export type ResearchDurableOutputIntegrity =
  | "RETAINED_CONTENT_DIGEST_VERIFIED"
  | "REGISTRY_SELF_DIGEST_VERIFIED"
'''
          if old not in s: raise SystemExit('integrity union anchor missing')
          s = s.replace(old, new, 1)
          old = '  rootClass: "REPORT" | "REGISTRY" | "CONTROL";\n'
          new = '  rootClass: "REPORT" | "REGISTRY" | "CONTROL" | "RETAINED";\n'
          if old not in s: raise SystemExit('rootClass anchor missing')
          s = s.replace(old, new, 1)
          old = '''function outputRootClass(relativePath: string): ResearchDurableOutputAssessment["rootClass"] {
  if (relativePath.startsWith("research/registries/")) return "REGISTRY";
'''
          new = '''function outputRootClass(relativePath: string): ResearchDurableOutputAssessment["rootClass"] {
  if (relativePath.startsWith("reports/automation/retained-outputs/")) return "RETAINED";
  if (relativePath.startsWith("research/registries/")) return "REGISTRY";
'''
          if old not in s: raise SystemExit('root classifier anchor missing')
          s = s.replace(old, new, 1)
          anchor = '''  const text = readFileSync(absolutePath, "utf8");
  const contentDigest = sha256Text(text);
  if (!input.relativePath.endsWith(".json")) {
'''
          insert = '''  const text = readFileSync(absolutePath, "utf8");
  const contentDigest = sha256Text(text);
  if (rootClass === "RETAINED") {
    const retainedMatch = input.relativePath.match(
      /^reports\\/automation\\/retained-outputs\\/[0-9A-Za-z._-]+\\/([0-9a-f]{64})-[^/]+$/u,
    );
    const expectedContentDigest = retainedMatch?.[1] ?? null;
    if (expectedContentDigest == null) {
      return { relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null, complete: false, issues: ["DURABLE_RETAINED_PATH_INVALID"], warnings };
    }
    if (expectedContentDigest !== contentDigest) {
      return { relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null, complete: false, issues: ["DURABLE_RETAINED_CONTENT_DIGEST_MISMATCH"], warnings };
    }
    let retainedEmbeddedDigest: string | null = null;
    if (input.relativePath.endsWith(".json")) {
      try {
        const retainedValue = objectValue(JSON.parse(text) as unknown);
        if (!retainedValue) throw new Error("not object");
        retainedEmbeddedDigest = typeof retainedValue.outputDigest === "string" && SHA256_RE.test(retainedValue.outputDigest) ? retainedValue.outputDigest : null;
      } catch {
        return { relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: null, historyDigestMatchesEmbedded: null, complete: false, issues: ["DURABLE_OUTPUT_JSON_INVALID"], warnings };
      }
    }
    if (retainedEmbeddedDigest != null && retainedEmbeddedDigest !== input.historyOutputDigest) {
      return { relativePath: input.relativePath, rootClass, integrity: null, exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: retainedEmbeddedDigest, historyDigestMatchesEmbedded: false, complete: false, issues: ["DURABLE_RETAINED_HISTORY_DIGEST_MISMATCH"], warnings };
    }
    return { relativePath: input.relativePath, rootClass, integrity: "RETAINED_CONTENT_DIGEST_VERIFIED", exists: true, regularFile: true, bytes: stat.size, contentDigest, embeddedDigest: retainedEmbeddedDigest, historyDigestMatchesEmbedded: retainedEmbeddedDigest == null ? null : true, complete: true, issues, warnings };
  }
  if (!input.relativePath.endsWith(".json")) {
'''
          if anchor not in s: raise SystemExit('retained assessment anchor missing')
          scanner.write_text(s.replace(anchor, insert, 1))

          runner = Path('scripts/run-intent-task.ts')
          r = runner.read_text()
          import_anchor = 'import { EXECUTOR_REGISTRY_VERSION, resolveExecutor, type ExecutorResult } from "../src/automation/taskExecutors";\n'
          if import_anchor not in r: raise SystemExit('runner import anchor missing')
          r = r.replace(import_anchor, import_anchor + 'import { retainExecutorOutputs } from "../src/automation/researchRetainedOutputs";\n', 1)
          result_anchor = '''  const attempts = state.tasks[task.taskId]?.attemptCount ?? 1;
'''
          retention_block = '''  let historyOutputs: string[];
  try {
    historyOutputs = retainExecutorOutputs({ repoRoot: root, runId, outputPaths: exec.outputs }).historyOutputs;
  } catch {
    const retentionBlock = "DURABLE_OUTPUT_RETENTION_FAILED";
    updateState(task.taskId, { status: "BLOCKED", lastFailure: { code: retentionBlock, at: nowIso() } });
    const retentionEvidencePath = `reports/automation/history/${runId}-${task.taskId}.json`;
    writeJsonAtomic(join(HISTORY_DIR, `${runId}-${task.taskId}.json`), {
      runId, requestId: request.requestId, intentId, taskId: task.taskId, taskType: task.taskType,
      safetyLevel: request.safetyLevel, executorVersion: exec.executorVersion, executed: true, result: "BLOCKED",
      blocks: [retentionBlock], outputs: exec.outputs, outputDigest: exec.outputDigest,
      summary: { retentionStatus: "BLOCKED", executorResult: exec.result }, authoritySha: request.authoritySha,
      idempotencyKey, startedAt: new Date(startedMs).toISOString(), completedAt: nowIso(), elapsedMs: Date.now() - startedMs,
    });
    appendLedgers(intentId, request.requestId, "BLOCKED", idempotencyKey, retentionEvidencePath);
    finish("BLOCKED", 3, {
      lastRequestId: request.requestId, lastIntentId: intentId, lastTaskId: task.taskId,
      authoritySha: request.authoritySha, stateVersion: state.stateVersion, stateDigest: computeStateDigest(state),
      blocks: [retentionBlock], elapsedMs: Date.now() - startedMs, evidencePath: retentionEvidencePath,
      outputs: exec.outputs, outputDigest: exec.outputDigest, taskStatus: "BLOCKED",
      nextCandidate: pickNext(mergeCatalogAndState(catalog, state)),
    });
  }

  const attempts = state.tasks[task.taskId]?.attemptCount ?? 1;
'''
          if result_anchor not in r: raise SystemExit('runner retention insertion anchor missing')
          r = r.replace(result_anchor, retention_block, 1)
          old = '    evidenceLinks: [...new Set([...(state.tasks[task.taskId]?.evidenceLinks ?? []), evidencePath, ...exec.outputs])],\n'
          new = '    evidenceLinks: [...new Set([...(state.tasks[task.taskId]?.evidenceLinks ?? []), evidencePath, ...exec.outputs, ...historyOutputs])],\n'
          if old not in r: raise SystemExit('runner evidenceLinks anchor missing')
          r = r.replace(old, new, 1)
          old = '    executorVersion: exec.executorVersion, executed: true, result: exec.result, blocks: exec.blocks, outputs: exec.outputs,\n'
          new = '    executorVersion: exec.executorVersion, executed: true, result: exec.result, blocks: exec.blocks, outputs: historyOutputs,\n'
          if old not in r: raise SystemExit('runner history outputs anchor missing')
          r = r.replace(old, new, 1)
          old = '    blocks: exec.blocks, elapsedMs: Date.now() - startedMs, evidencePath, outputs: exec.outputs, outputDigest: exec.outputDigest,\n'
          new = '    blocks: exec.blocks, elapsedMs: Date.now() - startedMs, evidencePath, outputs: historyOutputs, outputDigest: exec.outputDigest,\n'
          if old not in r: raise SystemExit('runner finish outputs anchor missing')
          runner.write_text(r.replace(old, new, 1))
          PY
      - name: Verify focused regression and typecheck
        run: |
          node --test --import tsx src/automation/researchRetainedOutputs.test.ts
          node --test --import tsx src/automation/researchRetainedOutputScanner.test.ts
          node --test --import tsx src/automation/researchRetainedOutputsBoundary.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompleteness.test.ts
          node --test --import tsx src/automation/researchDurableKnowledgeCompletenessBoundary.test.ts
          npm run typecheck
      - name: Commit validated runtime changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-validate-immutable-run-outputs-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation/researchDurableKnowledgeCompleteness.ts scripts/run-intent-task.ts
          git commit -m "feat(research): retain immutable run outputs"
          git push origin HEAD:feat/research-immutable-run-outputs-v2

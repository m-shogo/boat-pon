# boat-pon local research — one-shot dispatch only.
#
# 重要: `on.schedule` は使用しない（禁止）。毎時ループは ChatGPT Scheduled Task 側が
# 1 回ずつ dispatch する。このworkflowは1 dispatch = 1 task しか実行せず、
# 自分自身を再 dispatch しない。
name: boat-pon local research (one-shot)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "TASK-xxx or NEXT"
        required: true
        type: string
      requested_action:
        description: "run-task | run-next | status-only | dry-run"
        required: true
        default: "dry-run"
        type: choice
        options: [run-task, run-next, status-only, dry-run]
      safety_level:
        description: "L0 | L1 | L2 (L3 requires an existing grant; L4 always rejected)"
        required: true
        default: "L0"
        type: choice
        options: [L0, L1, L2, L3]
      authority_sha:
        description: "expected main SHA (short or full)"
        required: true
        type: string
      max_duration_seconds:
        description: "60..21600"
        required: true
        default: "1800"
        type: string
      request_reference:
        description: "free-form reference (e.g. chatgpt scheduled task run id)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: boat-pon-local-research
  cancel-in-progress: false

jobs:
  guard:
    # 外部 fork / 非 owner / 非 main からの起動を runner に到達させない。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SAFETY: ${{ inputs.safety_level }}
        run: |
          set -euo pipefail
          # GitHub expression は env 経由でのみ参照し、shell へ直接展開しない。
          echo "actor=$ACTOR repo=$REPO ref=$REF event=$EVENT safety=$SAFETY"
          [ "$REPO" = "m-shogo/boat-pon" ] || { echo "::error::repo not allowed"; exit 1; }
          [ "$ACTOR" = "m-shogo" ] || { echo "::error::actor not in allowlist"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::only main is dispatchable"; exit 1; }
          [ "$EVENT" = "workflow_dispatch" ] || { echo "::error::unsupported event"; exit 1; }
          case "$SAFETY" in
            L0|L1|L2|L3) : ;;
            *) echo "::error::L4 or unknown safety level is never automated"; exit 1 ;;
          esac
          echo "ok=true" >> "$GITHUB_OUTPUT"

  run-one-task:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 120
    steps:
      - name: Checkout (main only, no fork code)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build request from inputs (validated, no shell interpolation)
        env:
          TASK_ID: ${{ inputs.task_id }}
          REQUESTED_ACTION: ${{ inputs.requested_action }}
          SAFETY_LEVEL: ${{ inputs.safety_level }}
          AUTHORITY_SHA: ${{ inputs.authority_sha }}
          MAX_DURATION: ${{ inputs.max_duration_seconds }}
          REQUEST_REFERENCE: ${{ inputs.request_reference }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p data/tmp/automation
          node scripts/build-research-request.mjs > data/tmp/automation/request.json
          echo "--- request ---"; cat data/tmp/automation/request.json

      - name: Validate request (strict schema + digest)
        run: pnpm automation:validate-request -- --request=data/tmp/automation/request.json

      - name: Run exactly one task
        run: pnpm automation:task -- --request=data/tmp/automation/request.json
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Show status
        if: always()
        run: pnpm automation:status || true

      - name: Commit automation results (allowlisted paths only)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/automation-commit.sh

  daily-retention-snapshot:
    # The existing ChatGPT hourly dispatch remains the only scheduler. This hosted
    # follow-up is a time gate, not another schedule, and does no Mac/private-data IO.
    needs: [guard, run-one-task]
    if: always() && needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate to JST 23 hour
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          JST_HOUR="$(TZ=Asia/Tokyo date +%H)"
          echo "jst_hour=$JST_HOUR"
          if [ "$JST_HOUR" = "23" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main retention authority
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Materialize latest automation state read-only
        if: steps.gate.outputs.run == 'true'
        id: state
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/boat-pon-research
          SOURCE_SHA="$(git rev-parse origin/automation/boat-pon-research)"
          STATE_DIR="/tmp/boat-pon-retention-state-$RUN_ID"
          rm -rf "$STATE_DIR"
          git worktree add --detach "$STATE_DIR" "$SOURCE_SHA"
          test -z "$(git -C "$STATE_DIR" status --porcelain)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "state_dir=$STATE_DIR" >> "$GITHUB_OUTPUT"
          echo "source_state_sha=$SOURCE_SHA"

      - name: Build sanitized retention snapshot
        if: steps.gate.outputs.run == 'true'
        id: persist
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
          STATE_DIR: ${{ steps.state.outputs.state_dir }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          set +e
          node --import tsx scripts/persist-research-durable-retention-snapshot.ts \
            --repo-root="$STATE_DIR" \
            --source-state-sha="$SOURCE_SHA" \
            --main-authority-sha="$MAIN_SHA" \
            --observed-at="$OBSERVED_AT" > /tmp/retention-persist.json
          AUDIT_RC=$?
          set -e
          if [ "$AUDIT_RC" -ne 0 ] && [ "$AUDIT_RC" -ne 3 ]; then
            cat /tmp/retention-persist.json || true
            exit "$AUDIT_RC"
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('/tmp/retention-persist.json', 'utf8'));
          const allowed = /^reports\/automation\/retention\/durable-knowledge\/\d{4}-\d{2}-\d{2}\/[0-9a-f]{64}\.json$/;
          if (!allowed.test(d.relativePath)) throw new Error(`unsafe retention path: ${d.relativePath}`);
          if (typeof d.changed !== 'boolean') throw new Error('changed must be boolean');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${d.changed}\nrelative_path=${d.relativePath}\naudit_status=${d.auditStatus}\nevidence_digest=${d.evidenceDigest}\n`);
          console.log(JSON.stringify({
            changed: d.changed,
            relativePath: d.relativePath,
            auditStatus: d.auditStatus,
            historyFileCount: d.historyFileCount,
            durableCompleteCount: d.durableCompleteCount,
            strongDurableCompleteCount: d.strongDurableCompleteCount,
            incompleteCount: d.incompleteCount,
            invalidHistoryCount: d.invalidHistoryCount,
            missingOutputReferenceCount: d.missingOutputReferenceCount,
            invalidOutputReferenceCount: d.invalidOutputReferenceCount,
            mutableSupersededReferenceCount: d.mutableSupersededReferenceCount,
            legacyCompatibilityCount: d.legacyCompatibilityCount,
            evidenceDigest: d.evidenceDigest,
          }, null, 2));
          NODE
          echo "audit_rc=$AUDIT_RC" >> "$GITHUB_OUTPUT"

      - name: Verify retention mutation scope
        if: steps.gate.outputs.run == 'true'
        env:
          CHANGED: ${{ steps.persist.outputs.changed }}
          EXPECTED_PATH: ${{ steps.persist.outputs.relative_path }}
          STATE_DIR: ${{ steps.state.outputs.state_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PATHS < <(git -C "$STATE_DIR" status --porcelain -uall | sed 's/^...//' | sort -u)
          if [ "$CHANGED" = "false" ]; then
            [ "${#CHANGED_PATHS[@]}" -eq 0 ] || { printf 'unexpected change: %s\n' "${CHANGED_PATHS[@]}"; exit 1; }
            exit 0
          fi
          [ "${#CHANGED_PATHS[@]}" -eq 1 ] || { printf 'unexpected change set: %s\n' "${CHANGED_PATHS[@]}"; exit 1; }
          [ "${CHANGED_PATHS[0]}" = "$EXPECTED_PATH" ] || { echo "::error::unexpected changed path ${CHANGED_PATHS[0]}"; exit 1; }
          case "$EXPECTED_PATH" in
            reports/automation/retention/durable-knowledge/*) : ;;
            *) echo "::error::retention path outside allowlist"; exit 1 ;;
          esac

      - name: Append retention snapshot with CAS
        if: steps.gate.outputs.run == 'true' && steps.persist.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source_sha }}
          STATE_DIR: ${{ steps.state.outputs.state_dir }}
          EXPECTED_PATH: ${{ steps.persist.outputs.relative_path }}
          EVIDENCE_DIGEST: ${{ steps.persist.outputs.evidence_digest }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/boat-pon-research
          REMOTE_SHA="$(git rev-parse origin/automation/boat-pon-research)"
          if [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::automation state advanced during retention audit ($SOURCE_SHA -> $REMOTE_SHA); refusing to retry or overwrite"
            exit 1
          fi
          git -C "$STATE_DIR" config user.name "boat-pon-retention-audit"
          git -C "$STATE_DIR" config user.email "retention-audit@boat-pon.invalid"
          git -C "$STATE_DIR" add -- "$EXPECTED_PATH"
          STAGED="$(git -C "$STATE_DIR" diff --cached --name-only)"
          [ "$STAGED" = "$EXPECTED_PATH" ] || { echo "::error::unexpected staged path(s): $STAGED"; exit 1; }
          DATE_JST="$(echo "$EXPECTED_PATH" | cut -d/ -f5)"
          git -C "$STATE_DIR" commit -q -m "report(automation): durable retention ${DATE_JST} ${EVIDENCE_DIGEST:0:12}"
          git -C "$STATE_DIR" push origin HEAD:automation/boat-pon-research --quiet
          echo "appended $EXPECTED_PATH"

      - name: Fail visibly after retaining BLOCKED audit evidence
        if: steps.gate.outputs.run == 'true' && steps.persist.outputs.audit_rc == '3'
        run: |
          echo "::error::durable retention audit is BLOCKED; sanitized snapshot was retained before failing"
          exit 3

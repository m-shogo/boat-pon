name: N2-013 v2 intent guard validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-013-v2-intent-guard-validation.yml"
      - "automation/requests/intents/INTENT-20260806-r7m2v9k4qx.json"

permissions:
  contents: read

concurrency:
  group: n2-013-v2-intent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-guard:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install guard dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Replay prospective push guard only
        env:
          ACTOR: m-shogo
          REPO: m-shogo/boat-pon
          EVENT: push
          BEFORE_SHA: c09a9f96fc1043339c5ded59cd2e06a9ea503dde
          AFTER_SHA: 9f87ced6465dbf713535a5d64fb000b185f05337
          COMMIT_AUTHOR: m-shogo
          COMMIT_COMMITTER: web-flow
          CANONICAL_REQUEST_PATH: canonical-request.json
        run: |
          set -euo pipefail
          pnpm automation:guard-intent
          node scripts/assert-canonical-request.mjs canonical-request.json
          node -e 'const r=require("./canonical-request.json"); if(r.taskId!=="TASK-N2-013"||r.requestId!=="REQ-20260806-r7m2v9k4qx"||r.safetyLevel!=="L0") process.exit(1)'

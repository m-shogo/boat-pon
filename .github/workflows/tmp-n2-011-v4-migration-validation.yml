name: temporary N2-011 v4 migration validation

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: tmp-n2-011-v4-migration-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/n2-011-v4-cas-migration-tool
          fetch-depth: 0

      - name: Prevent evidence commit recursion
        id: gate
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = "test: record Mac N2-011 migration validation" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert exact runner stateVersion correction
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          grep -Fq 'authoritySha: request.authoritySha, stateVersion: state.stateVersion, stateDigest: computeStateDigest(state),' scripts/run-intent-task.ts
          if grep -Fq 'stateVersion: state.stateVersion + 1' scripts/run-intent-task.ts; then
            echo '::error::runner still invents a current-run stateVersion increment'
            exit 1
          fi

      - name: Assert isolated change boundary
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | tee /tmp/n2-011-migration-files.txt
          grep -Fxq 'src/automation/n2QueueMigration.ts' /tmp/n2-011-migration-files.txt
          grep -Fxq 'src/automation/n2QueueMigration.test.ts' /tmp/n2-011-migration-files.txt
          grep -Fxq 'src/automation/runIntentStateVersion.test.ts' /tmp/n2-011-migration-files.txt
          grep -Fxq 'scripts/migrate-n2-011-v4-queue.ts' /tmp/n2-011-migration-files.txt
          grep -Fxq 'scripts/run-intent-task.ts' /tmp/n2-011-migration-files.txt
          if grep -E '^(src/(domain|decision|app_settings|production|sidecar)/|data/|backups/)' /tmp/n2-011-migration-files.txt; then
            echo '::error::forbidden production/data path changed'
            exit 1
          fi

      - name: Capture pre-validation runtime fingerprint
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def collect():
              candidates = []
              for root_name in ("data", "backups"):
                  root = Path(root_name)
                  if root.exists():
                      candidates.extend(path for path in root.rglob("*") if path.is_file() or path.is_symlink())
              for pattern in ("*.sqlite", "*.sqlite-wal", "*.sqlite-shm", "*.db", "*.db-wal", "*.db-shm"):
                  candidates.extend(path for path in Path(".").glob(pattern) if path.is_file() or path.is_symlink())
              rows = []
              for path in sorted(set(candidates), key=lambda p: p.as_posix()):
                  if path.is_symlink():
                      rows.append({"path": path.as_posix(), "type": "symlink", "target": str(path.readlink())})
                  else:
                      body = path.read_bytes()
                      rows.append({"path": path.as_posix(), "type": "file", "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
              return rows

          rows = collect()
          payload = json.dumps(rows, ensure_ascii=False, separators=(",", ":"), sort_keys=True)
          Path("/tmp/n2-runtime-before.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n")
          Path("/tmp/n2-runtime-before.sha256").write_text(hashlib.sha256(payload.encode()).hexdigest() + "\n")
          PY

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.gate.outputs.skip != 'true'
        run: npm run typecheck

      - name: Targeted migration and state alignment tests
        if: steps.gate.outputs.skip != 'true'
        run: node --import tsx --test src/automation/n2QueueMigration.test.ts src/automation/runIntentStateVersion.test.ts

      - name: Full repository tests
        if: steps.gate.outputs.skip != 'true'
        run: npm test

      - name: Research governance
        if: steps.gate.outputs.skip != 'true'
        run: npm run research:governance-check

      - name: Product and BUY/LINE boundaries
        if: steps.gate.outputs.skip != 'true'
        run: |
          node scripts/verify-product-boundaries.mjs
          node scripts/verify-buy-line-learning-boundaries.mjs

      - name: Research Replay golden
        if: steps.gate.outputs.skip != 'true'
        run: npm run research:golden:verify

      - name: Production build
        if: steps.gate.outputs.skip != 'true'
        run: npm run build

      - name: Assert no DB/runtime writes
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def collect():
              candidates = []
              for root_name in ("data", "backups"):
                  root = Path(root_name)
                  if root.exists():
                      candidates.extend(path for path in root.rglob("*") if path.is_file() or path.is_symlink())
              for pattern in ("*.sqlite", "*.sqlite-wal", "*.sqlite-shm", "*.db", "*.db-wal", "*.db-shm"):
                  candidates.extend(path for path in Path(".").glob(pattern) if path.is_file() or path.is_symlink())
              rows = []
              for path in sorted(set(candidates), key=lambda p: p.as_posix()):
                  if path.is_symlink():
                      rows.append({"path": path.as_posix(), "type": "symlink", "target": str(path.readlink())})
                  else:
                      body = path.read_bytes()
                      rows.append({"path": path.as_posix(), "type": "file", "bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()})
              return rows

          before = json.loads(Path("/tmp/n2-runtime-before.json").read_text())
          after = collect()
          Path("/tmp/n2-runtime-after.json").write_text(json.dumps(after, ensure_ascii=False, indent=2) + "\n")
          if after != before:
              print("::error::DB/runtime fingerprint changed during migration validation")
              print(json.dumps({"before": before, "after": after}, ensure_ascii=False, indent=2))
              raise SystemExit(1)
          payload = json.dumps(after, ensure_ascii=False, separators=(",", ":"), sort_keys=True)
          digest = hashlib.sha256(payload.encode()).hexdigest()
          with open(Path("/tmp/n2-runtime-fingerprint.env"), "w") as handle:
              handle.write(f"RUNTIME_FINGERPRINT_SHA256={digest}\n")
              handle.write(f"RUNTIME_FILE_COUNT={len(after)}\n")
          PY
          cat /tmp/n2-runtime-fingerprint.env >> "$GITHUB_ENV"
          if git status --porcelain --untracked-files=all | grep -E '(^| )((data|backups)/|.*\.sqlite(-wal|-shm)?$|.*\.db(-wal|-shm)?$)'; then
            echo '::error::tracked or untracked DB/runtime files changed during validation'
            git status --short
            exit 1
          fi

      - name: Record immutable Mac validation evidence
        if: steps.gate.outputs.skip != 'true'
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME_VALUE: ${{ runner.name }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p reports/automation/validation
          VALIDATED_COMMIT="$(git rev-parse HEAD)"
          export VALIDATED_COMMIT
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "evidenceSchemaVersion": "n2-011-v4-migration-mac-validation-v1",
              "workflowRunId": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflowRunAttempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "validatedCommit": os.environ["VALIDATED_COMMIT"],
              "executionLocation": "Mac self-hosted",
              "runner": {
                  "name": os.environ["RUNNER_NAME_VALUE"],
                  "os": os.environ["RUNNER_OS_VALUE"],
                  "arch": os.environ["RUNNER_ARCH_VALUE"]
              },
              "checks": {
                  "isolatedChangeBoundary": "PASS",
                  "runnerStateVersionAlignment": "PASS",
                  "typecheck": "PASS",
                  "targetedMigrationTests": "PASS",
                  "fullRepositoryTests": "PASS",
                  "researchGovernance": "PASS",
                  "productBoundary": "PASS",
                  "buyLineBoundary": "PASS",
                  "researchReplayGolden": "PASS",
                  "productionRolloutReadiness": "NOT_RUN_APPROVAL_GATED_NOT_REQUIRED",
                  "productionBuild": "PASS",
                  "dbRuntimeWriteGuard": "PASS"
              },
              "runtimeFingerprintSha256": os.environ["RUNTIME_FINGERPRINT_SHA256"],
              "runtimeFileCount": int(os.environ["RUNTIME_FILE_COUNT"]),
              "dbWriteCount": 0,
              "primaryDbWriteCount": 0,
              "sidecarWriteCount": 0,
              "taskAttemptConsumed": False,
              "approvalCreated": False,
              "productionApplyExecuted": False,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          }
          Path("reports/automation/validation/n2-011-v4-migration-mac.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n"
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/automation/validation/n2-011-v4-migration-mac.json
          git diff --cached --check
          git commit -m 'test: record Mac N2-011 migration validation'
          git push origin HEAD:agent/n2-011-v4-cas-migration-tool

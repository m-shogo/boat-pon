name: N2 official program canary validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-official-program-canary-validation.yml"
      - "src/domain/officialLinks.ts"
      - "src/research-replay/n2OfficialProgramCanary*.ts"

permissions:
  contents: read

concurrency:
  group: n2-official-program-canary-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted canary tests
        run: |
          node --test --import tsx \
            src/research-replay/n2OfficialProgramCanary.test.ts \
            src/research-replay/n2OfficialProgramCanaryReader.test.ts

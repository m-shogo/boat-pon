name: N2 official program canary validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-official-program-canary-validation.yml"
      - "docs/architecture/n2-official-program-canary.md"
      - "src/domain/officialLinks.ts"
      - "src/research-replay/n2OfficialProgramCanary*.ts"

permissions:
  contents: read

concurrency:
  group: n2-official-program-canary-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted canary tests
        run: |
          node --test --import tsx \
            src/research-replay/n2OfficialProgramCanary.test.ts \
            src/research-replay/n2OfficialProgramCanaryIdentity.test.ts \
            src/research-replay/n2OfficialProgramCanaryReader.test.ts

      - name: Inspect real Mac canary eligibility without writes
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { buildOfficialProgramCanaryManifest } from "./src/research-replay/n2OfficialProgramCanary.ts";
          import { readOfficialProgramCanarySource } from "./src/research-replay/n2OfficialProgramCanaryReader.ts";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const codeGitSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const read = readOfficialProgramCanarySource({
            primaryDbPath: `${policy.dataRoot}/data/boat.sqlite`,
          });
          const manifest = buildOfficialProgramCanaryManifest({
            rows: read.rows,
            cohort: read.cohort,
            sourceReadTruncated: read.truncated,
            maxRaces: 20,
            codeGitSha,
            generatedAt: `${read.cohort.dateTo}T23:59:59.000Z`,
          });
          const exclusionReasons = {};
          for (const item of manifest.excluded) {
            exclusionReasons[item.reason] = (exclusionReasons[item.reason] ?? 0) + 1;
          }
          const serialized = JSON.stringify(manifest);
          if (serialized.includes("rawJson") || serialized.includes(policy.dataRoot)) {
            throw new Error("PRIVATE_SOURCE_MATERIAL_LEAKED_INTO_MANIFEST");
          }
          if (read.primaryWriteCount !== 0 || !read.readOnly || !read.queryOnly) {
            throw new Error("PRIMARY_READ_ONLY_CONTRACT_FAILED");
          }
          if (manifest.binding.items.length !== 20) {
            throw new Error(`REAL_CANARY_SELECTION_NOT_20:${manifest.binding.items.length}`);
          }
          console.log("N2_OFFICIAL_PROGRAM_CANARY_REAL_DB");
          console.log(JSON.stringify({
            cohort: read.cohort,
            sourceRows: manifest.binding.sourceRowCount,
            eligibleRows: manifest.binding.eligibleRowCount,
            excludedRows: manifest.binding.excludedCount,
            selectedRows: manifest.binding.items.length,
            exclusionReasons,
            truncated: read.truncated,
            manifestDigest: manifest.manifestDigest,
            primaryWriteCount: read.primaryWriteCount,
          }, null, 2));
          NODE
          test -z "$(git status --porcelain)"

      - name: Rehearse exact 20-race canary in RUNNER_TEMP only
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdtempSync, readFileSync, rmSync, statSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { recordApprovalGrant } from "./src/research-replay/approval.ts";
          import {
            applyOfficialProgramCanary,
            buildOfficialProgramCanaryManifest,
            officialProgramCanaryApprovalTarget,
          } from "./src/research-replay/n2OfficialProgramCanary.ts";
          import { readOfficialProgramCanarySource } from "./src/research-replay/n2OfficialProgramCanaryReader.ts";
          import { RawStore } from "./src/research-replay/rawStore.ts";
          import { ResearchReplayRepository } from "./src/research-replay/repository.ts";
          import { initializeRolloutSchema, openRolloutDatabase } from "./src/research-replay/schema.ts";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const primaryDbPath = `${policy.dataRoot}/data/boat.sqlite`;
          const primaryBefore = statSync(primaryDbPath);
          const codeGitSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const read = readOfficialProgramCanarySource({ primaryDbPath });
          const manifest = buildOfficialProgramCanaryManifest({
            rows: read.rows,
            cohort: read.cohort,
            sourceReadTruncated: read.truncated,
            maxRaces: 20,
            codeGitSha,
            generatedAt: `${read.cohort.dateTo}T23:59:59.000Z`,
          });
          if (manifest.binding.items.length !== 20) throw new Error("REHEARSAL_COHORT_NOT_20");

          const tempBase = process.env.RUNNER_TEMP || tmpdir();
          const dir = mkdtempSync(join(tempBase, "n2-official-program-canary-rehearsal-"));
          let db;
          try {
            const sidecarPath = join(dir, "sidecar.sqlite");
            db = openRolloutDatabase(sidecarPath);
            const initializedAt = `${read.cohort.dateTo}T23:59:59.000Z`;
            initializeRolloutSchema(db, initializedAt);
            const approvalId = "runner-temp-official-program-canary-approval";
            const approvedAt = `${read.cohort.dateFrom}T00:00:00.000Z`;
            const rolloutStartedAt = `${read.cohort.dateFrom}T01:00:00.000Z`;
            recordApprovalGrant(db, {
              approvalId,
              ...officialProgramCanaryApprovalTarget(manifest.manifestDigest),
              approvalSource: "human",
              approvalReference: "rehearsal://runner-temp-only",
              approvedAt,
              approvalMode: "production",
            }, initializedAt);

            let sequence = 0;
            const repository = new ResearchReplayRepository(
              db,
              new RawStore(join(dir, "raw")),
              () => `runner-temp-canary-${++sequence}`,
              () => initializedAt,
            );
            const gateInput = {
              executionMode: "production",
              rolloutStartedAt,
              approvalGrantId: approvalId,
              onDisk: {
                codeGitSha,
                hasActiveWal: false,
                diskFreeBytes: Number.MAX_SAFE_INTEGER,
                neededBytes: 1,
                shadowWriteEnabled: false,
                killSwitchEngaged: false,
              },
            };
            const first = applyOfficialProgramCanary({
              db,
              repository,
              manifest,
              primaryRows: read.rows,
              gateInput,
            });
            const replay = applyOfficialProgramCanary({
              db,
              repository,
              manifest,
              primaryRows: read.rows,
              gateInput,
            });
            const observationCount = Number(db.prepare(`
              SELECT COUNT(*) n FROM domain_observations WHERE observation_type='official_program'
            `).get().n);
            const captureCount = Number(db.prepare(`
              SELECT COUNT(*) n FROM capture_attempts WHERE source_type='official_program'
            `).get().n);
            const typedCount = Number(db.prepare(`
              SELECT COUNT(*) n FROM typed_observation_payloads WHERE payload_type='official_program'
            `).get().n);
            if (first.insertedCount !== 20 || first.reusedCount !== 0 || first.primaryWriteCount !== 0) {
              throw new Error(`FIRST_REHEARSAL_RESULT_INVALID:${JSON.stringify(first)}`);
            }
            if (replay.insertedCount !== 0 || replay.reusedCount !== 20 || replay.primaryWriteCount !== 0) {
              throw new Error(`REPLAY_REHEARSAL_RESULT_INVALID:${JSON.stringify(replay)}`);
            }
            if (observationCount !== 20 || captureCount !== 20 || typedCount !== 20) {
              throw new Error(`TEMP_SIDECAR_COUNTS_INVALID:${observationCount}:${captureCount}:${typedCount}`);
            }
            console.log("N2_OFFICIAL_PROGRAM_CANARY_TEMP_REHEARSAL");
            console.log(JSON.stringify({
              selectedRows: manifest.binding.items.length,
              firstInserted: first.insertedCount,
              replayReused: replay.reusedCount,
              observationCount,
              captureCount,
              typedCount,
              primaryWriteCount: first.primaryWriteCount + replay.primaryWriteCount,
              globalShadowWriteEnabled: first.globalShadowWriteEnabled,
              rehearsalPathClass: "RUNNER_TEMP",
            }, null, 2));
          } finally {
            if (db) db.close();
            rmSync(dir, { recursive: true, force: true });
          }
          const primaryAfter = statSync(primaryDbPath);
          if (primaryAfter.size !== primaryBefore.size || primaryAfter.mtimeMs !== primaryBefore.mtimeMs) {
            throw new Error("PRIMARY_DB_CHANGED_DURING_REHEARSAL");
          }
          NODE
          test -z "$(git status --porcelain)"

      - name: Research governance
        run: pnpm exec tsx scripts/research-governance-check.ts

      - name: Full tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"

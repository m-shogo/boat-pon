name: temporary N2 trifecta report diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-n2-trifecta-report-diagnostic-manual
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-market-readonly-foundation
          fetch-depth: 0

      - run: npm ci

      - name: Capture report error and immutable schema
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p reports/automation/validation
          set +e
          npx tsx scripts/report-n2-trifecta-market-foundation.ts >/tmp/trifecta-report.stdout 2>/tmp/trifecta-report.stderr
          REPORT_CODE=$?
          set -e
          export REPORT_CODE
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { DatabaseSync } from 'node:sqlite';

          const root = process.cwd();
          const policy = JSON.parse(readFileSync(join(root, 'config/research-automation-policy.json'), 'utf8'));
          const dataRoot = resolve(String(policy.dataRoot ?? policy.repoPath ?? root));
          const primary = join(dataRoot, 'data/boat.sqlite');
          const sidecar = join(dataRoot, 'data/research-replay.sqlite');
          const meta = (path) => ({
            path,
            exists: existsSync(path),
            bytes: existsSync(path) ? statSync(path).size : null,
            walBytes: existsSync(`${path}-wal`) ? statSync(`${path}-wal`).size : 0,
          });
          const diagnostic = {
            evidenceSchemaVersion: 'n2-trifecta-market-report-diagnostic-v1',
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            validatedCommit: process.env.GITHUB_SHA,
            reportExitCode: Number(process.env.REPORT_CODE),
            stdout: readFileSync('/tmp/trifecta-report.stdout', 'utf8').slice(0, 12000),
            stderr: readFileSync('/tmp/trifecta-report.stderr', 'utf8').slice(0, 12000),
            primary: meta(primary),
            sidecar: meta(sidecar),
            tables: {},
            queryError: null,
            taskAttemptConsumed: false,
            approvalCreated: false,
            productionApplyExecuted: false,
          };
          try {
            if (diagnostic.primary.exists && diagnostic.primary.walBytes === 0) {
              const db = new DatabaseSync(`${pathToFileURL(primary).href}?immutable=1`, { readOnly: true });
              db.exec('PRAGMA query_only=ON');
              const names = db.prepare("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").all().map((row) => String(row.name));
              for (const name of names.filter((n) => ['official_programs','trifecta_market_raw_snapshots','odds_timeseries_snapshots','odds_timeseries'].includes(n))) {
                diagnostic.tables[name] = db.prepare(`PRAGMA table_info("${name.replaceAll('"','""')}")`).all();
              }
              db.close();
            }
          } catch (error) {
            diagnostic.queryError = error instanceof Error ? error.message : String(error);
          }
          writeFileSync('reports/automation/validation/n2-trifecta-market-report-diagnostic.json', `${JSON.stringify(diagnostic, null, 2)}\n`);
          NODE

      - name: Commit diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/automation/validation/n2-trifecta-market-report-diagnostic.json
          git diff --cached --check
          git commit -m 'test: record trifecta report diagnostic'
          git push origin HEAD:agent/n2-trifecta-market-readonly-foundation

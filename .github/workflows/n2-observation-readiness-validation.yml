name: N2 observation readiness validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/n2-observation-readiness-validation.yml"
      - "automation/task-catalog.json"
      - "automation/phase-mapping.json"
      - "docs/architecture/n2-observation-ingest-readiness.md"
      - "scripts/automation-commit.sh"
      - "src/automation/n2ObservationIngestReadiness*.ts"
      - "src/automation/taskExecutors.ts"
      - "src/research-replay/n2ObservationIngestReadiness*.ts"

permissions:
  contents: read

concurrency:
  group: n2-observation-readiness-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted readiness tests
        run: |
          node --test --import tsx \
            src/research-replay/n2ObservationIngestReadiness.test.ts \
            src/research-replay/n2ObservationIngestReadinessReader.test.ts \
            src/automation/n2ObservationIngestReadinessExecutor.test.ts \
            src/automation/n2ObservationIngestReadinessIntegration.test.ts \
            src/automation/n2PitAuditRegistration.test.ts \
            src/automation/n2PitAuditIntegration.test.ts

      - name: Read real Mac readiness without writes
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { buildN2ObservationIngestReadiness } from "./src/research-replay/n2ObservationIngestReadiness.ts";
          import { readN2ObservationIngestReadiness } from "./src/research-replay/n2ObservationIngestReadinessReader.ts";

          const policy = JSON.parse(readFileSync("config/research-automation-policy.json", "utf8"));
          const read = readN2ObservationIngestReadiness({
            primaryDbPath: `${policy.dataRoot}/data/boat.sqlite`,
            sidecarDbPath: `${policy.dataRoot}/data/research-replay.sqlite`,
          });
          const summary = buildN2ObservationIngestReadiness(read.input);
          console.log("N2_OBSERVATION_READINESS_REAL_DB");
          console.log(JSON.stringify({
            sourceIdentity: read.sourceIdentity,
            cohort: summary.cohort,
            overallStatus: summary.overallStatus,
            writeAuthorized: summary.writeAuthorized,
            autoEnableShadowWrite: summary.autoEnableShadowWrite,
            officialProgram: summary.officialProgram,
            trifectaMarket: summary.trifectaMarket,
            rollout: summary.rollout,
            sidecar: summary.sidecar,
            nextActions: summary.nextActions,
          }, null, 2));
          if (summary.writeAuthorized !== false || summary.autoEnableShadowWrite !== false) process.exit(1);
          NODE
          test -z "$(git status --porcelain)"

      - name: Research governance
        run: pnpm exec tsx scripts/research-governance-check.ts

      - name: Full tests
        run: pnpm test

      - name: Build
        run: pnpm build

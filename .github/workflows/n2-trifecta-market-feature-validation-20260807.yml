name: N2 trifecta market feature validation 20260807

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/n2-trifecta-market-feature-validation-20260807.yml

permissions:
  contents: read

concurrency:
  group: n2-trifecta-market-feature-validation-20260807
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restrict one-shot validation
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [ "$REPO" = "m-shogo/boat-pon" ]
          [ "$ACTOR" = "m-shogo" ]
          [ "$EVENT" = "pull_request" ]
          [ "$HEAD_REF" = "ops/n2-trifecta-market-feature-validation-20260807" ]
          [ "$BASE_REF" = "main" ]

  validate-private-features:
    needs: guard
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 20
    steps:
      - name: Verify reviewed canonical main
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Users/m-shogo/Developer/personal/boat-pon"
          TARGET="6e297602ff34d6cc853ff0e7088ae5a3e56fcfb7"
          cd "$ROOT"
          [ "$(git branch --show-current)" = "main" ]
          [ "$(git rev-parse HEAD)" = "$TARGET" ]
          [ -z "$(git status --porcelain)" ]

      - name: Load real private market features for all Mikuni races
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Users/m-shogo/Developer/personal/boat-pon"
          cd "$ROOT"
          mkdir -p "$RUNNER_TEMP/n2-feature-summaries"
          for race in $(seq 1 12); do
            node --import tsx scripts/build-n2-trifecta-private-market-features.ts \
              --date 2026-08-07 \
              --venue 10 \
              --race "$race" \
              > "$RUNNER_TEMP/n2-feature-summaries/race-${race}.json"
          done

      - name: Write private full feature artifacts for multi-checkpoint races when absent
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/Users/m-shogo/Developer/personal/boat-pon"
          cd "$ROOT"
          for race in 2 3; do
            status=$(python3 - "$RUNNER_TEMP/n2-feature-summaries/race-${race}.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["status"])
          PY
          )
            rel="data/private/trifecta-market-features/2026-08-07/10/$(printf '%02d' "$race").json"
            if [ "$status" = "PASS" ] || [ "$status" = "PARTIAL" ]; then
              if [ ! -e "$ROOT/$rel" ]; then
                node --import tsx scripts/build-n2-trifecta-private-market-features.ts \
                  --date 2026-08-07 \
                  --venue 10 \
                  --race "$race" \
                  --write-private \
                  > "$RUNNER_TEMP/n2-feature-summaries/race-${race}-write.json"
              fi
              [ -f "$ROOT/$rel" ]
              [ "$(stat -f '%Lp' "$ROOT/$rel")" = "600" ]
            fi
          done

      - name: Emit sanitized real-data validation summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os

          root = "/Users/m-shogo/Developer/personal/boat-pon"
          temp = os.environ["RUNNER_TEMP"]
          races = []
          total_snapshots = 0
          total_transitions = 0
          total_accepted = 0
          blocked = []
          for race in range(1, 13):
              path = os.path.join(temp, "n2-feature-summaries", f"race-{race}.json")
              data = json.load(open(path))
              total_snapshots += data["loadedSnapshotCount"]
              total_transitions += data["transitionCount"]
              total_accepted += data["acceptedMarkerCount"]
              if data["status"] == "BLOCKED":
                  blocked.append(data["raceIdentity"])
              private_rel = f"data/private/trifecta-market-features/2026-08-07/10/{race:02d}.json"
              private_exists = os.path.isfile(os.path.join(root, private_rel))
              private_mode = None
              if private_exists:
                  private_mode = oct(os.stat(os.path.join(root, private_rel)).st_mode & 0o777)[2:].zfill(3)
              races.append({
                  "raceIdentity": data["raceIdentity"],
                  "status": data["status"],
                  "acceptedMarkerCount": data["acceptedMarkerCount"],
                  "loadedSnapshotCount": data["loadedSnapshotCount"],
                  "availableCheckpoints": data["availableCheckpoints"],
                  "missingCheckpoints": data["missingCheckpoints"],
                  "transitionCount": data["transitionCount"],
                  "sourceLoadDigest": data["sourceLoadDigest"],
                  "privateFullFeatureExists": private_exists,
                  "privateFullFeatureMode": private_mode,
              })

          core = {
              "reportVersion": "n2-trifecta-real-market-feature-validation-v1",
              "status": "PASS" if not blocked else "BLOCKED",
              "date": "2026-08-07",
              "venueCode": "10",
              "raceCountScanned": 12,
              "acceptedMarkerCount": total_accepted,
              "loadedSnapshotCount": total_snapshots,
              "transitionCount": total_transitions,
              "blockedRaceIdentities": blocked,
              "races": races,
              "networkRequestCount": 0,
              "databaseReadCount": 0,
              "databaseWriteCount": 0,
              "rawOddsValuesPrinted": False,
              "rawOddsValuesPublished": False,
              "currentBuyChanged": False,
              "lineChanged": False,
              "publicPublished": False,
              "automatedBettingChanged": False,
          }
          digest_input = json.dumps(core, sort_keys=True, separators=(",", ":")).encode()
          core["validationDigest"] = hashlib.sha256(digest_input).hexdigest()
          print(json.dumps(core, indent=2, sort_keys=True))
          if blocked:
              raise SystemExit(1)
          PY

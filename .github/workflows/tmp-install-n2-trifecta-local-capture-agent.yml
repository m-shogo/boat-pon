name: Temporary install N2 trifecta local capture agent

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-install-n2-trifecta-local-capture-agent.yml

permissions:
  contents: read

concurrency:
  group: install-n2-trifecta-local-capture-agent
  cancel-in-progress: true

jobs:
  install:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout exact merged authority
        uses: actions/checkout@v4
        with:
          ref: 367991e3c03c444792b5a6ff90dafc0bad6e82ba
          fetch-depth: 1

      - name: Assert exact authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "367991e3c03c444792b5a6ff90dafc0bad6e82ba"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve paths and record DB metadata before
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="$(node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const policy = JSON.parse(fs.readFileSync('config/research-automation-policy.json', 'utf8'));
          console.log(path.resolve(String(policy.dataRoot ?? policy.repoPath ?? process.cwd())));
          NODE
          )"
          echo "DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"
          echo "AUTH_PATH=$DATA_ROOT/data/private/trifecta-capture/authorization.json" >> "$GITHUB_ENV"
          echo "PLIST_PATH=$HOME/Library/LaunchAgents/com.boatpon.trifecta-private-capture.plist" >> "$GITHUB_ENV"
          echo "BEFORE_PATH=$RUNNER_TEMP/n2-local-install-before.json" >> "$GITHUB_ENV"
          echo "AFTER_PATH=$RUNNER_TEMP/n2-local-install-after.json" >> "$GITHUB_ENV"
          echo "INSTALL_PATH=$RUNNER_TEMP/n2-local-install-output.json" >> "$GITHUB_ENV"
          echo "TICK_PATH=$RUNNER_TEMP/n2-local-install-tick.json" >> "$GITHUB_ENV"
          echo "SUMMARY_PATH=$RUNNER_TEMP/n2-local-install-summary.json" >> "$GITHUB_ENV"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          const root = process.env.DATA_ROOT;
          const result = {
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          };
          fs.writeFileSync(process.env.BEFORE_PATH, `${JSON.stringify(result, null, 2)}\n`);
          NODE

      - name: Install and authorize for 30 days
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/install-n2-trifecta-local-capture-agent.ts \
            --authorize --days 30 > "$INSTALL_PATH"

      - name: Verify launchd and execute one idempotent tick
        shell: bash
        run: |
          set -euo pipefail
          test -f "$AUTH_PATH"
          test -f "$PLIST_PATH"
          test "$(stat -f '%Lp' "$AUTH_PATH")" = "600"
          test "$(stat -f '%Lp' "$PLIST_PATH")" = "644"
          /bin/launchctl print "gui/$(id -u)/com.boatpon.trifecta-private-capture" \
            > "$RUNNER_TEMP/n2-local-install-launchctl.txt"
          set +e
          npx tsx scripts/run-n2-trifecta-local-capture-tick.ts > "$TICK_PATH"
          code=$?
          set -e
          echo "$code" > "$RUNNER_TEMP/n2-local-install-tick-exit.txt"

      - name: Build and enforce sanitized installation evidence
        shell: bash
        env:
          VALIDATED_MAIN_SHA: 367991e3c03c444792b5a6ff90dafc0bad6e82ba
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          const root = process.env.DATA_ROOT;
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_PATH, 'utf8'));
          const after = {
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          };
          fs.writeFileSync(process.env.AFTER_PATH, `${JSON.stringify(after, null, 2)}\n`);
          const install = JSON.parse(fs.readFileSync(process.env.INSTALL_PATH, 'utf8'));
          const tick = JSON.parse(fs.readFileSync(process.env.TICK_PATH, 'utf8'));
          const tickExitCode = Number(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'n2-local-install-tick-exit.txt'), 'utf8',
          ).trim());
          const auth = JSON.parse(fs.readFileSync(process.env.AUTH_PATH, 'utf8'));
          const validityDays = (Date.parse(auth.expiresAt) - Date.parse(auth.issuedAt)) / 86400000;
          const dbMetadataUnchanged = JSON.stringify(before) === JSON.stringify(after);
          const violations = [];
          if (install.status !== 'INSTALLED') violations.push('INSTALL_NOT_CONFIRMED');
          if (!dbMetadataUnchanged) violations.push('DATABASE_METADATA_CHANGED');
          if (!(validityDays > 0 && validityDays <= 30.01)) violations.push('AUTH_DURATION_INVALID');
          if (auth.stage !== 'ONE_VENUE_REVIEW' || auth.maxRequestsPerDay !== 48) {
            violations.push('AUTH_SCOPE_INVALID');
          }
          if (auth.publicRedistributionAuthorized !== false
            || auth.databaseWriteAuthorized !== false
            || auth.currentBuyConnectionAuthorized !== false
            || auth.lineConnectionAuthorized !== false
            || auth.automatedBettingAuthorized !== false) {
            violations.push('AUTH_BOUNDARY_WIDENED');
          }
          if (tick.databaseWriteCount !== 0
            || tick.primaryDbWriteCount !== 0
            || tick.sidecarWriteCount !== 0
            || tick.currentBuyChanged !== false
            || tick.lineChanged !== false
            || tick.publicPublished !== false
            || tick.automatedBettingChanged !== false
            || tick.productionApplyExecuted !== false) {
            violations.push('PROTECTED_BOUNDARY_CHANGED');
          }
          const summary = {
            evidenceSchemaVersion: 'n2-trifecta-local-capture-install-v1',
            status: violations.length === 0 ? 'PASS' : 'BLOCKED',
            violations,
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            validatedMainSha: process.env.VALIDATED_MAIN_SHA,
            installStatus: install.status,
            launchAgentLabel: install.label,
            launchdRegistered: true,
            authorization: {
              version: auth.authorizationVersion,
              id: auth.authorizationId,
              issuedAt: auth.issuedAt,
              expiresAt: auth.expiresAt,
              validityDays,
              stage: auth.stage,
              maxRequestsPerDay: auth.maxRequestsPerDay,
              checkpoints: auth.checkpointLabels,
              privateResearchOnly: auth.privateResearchOnly,
              publicRedistributionAuthorized: auth.publicRedistributionAuthorized,
              databaseWriteAuthorized: auth.databaseWriteAuthorized,
              currentBuyConnectionAuthorized: auth.currentBuyConnectionAuthorized,
              lineConnectionAuthorized: auth.lineConnectionAuthorized,
              automatedBettingAuthorized: auth.automatedBettingAuthorized,
            },
            tick: {
              exitCode: tickExitCode,
              status: tick.status,
              blockers: tick.blockers,
              selectedVenueCode: tick.selectedVenueCode,
              selectedRaceCount: tick.selectedRaceCount,
              dueEntryCount: tick.dueEntryCount,
              networkRequestCount: tick.networkRequestCount,
              capturedCount: tick.capturedCount,
              blockedEvidenceCount: tick.blockedEvidenceCount,
            },
            before,
            after,
            dbMetadataUnchanged,
            rawUploadedOrPublished: false,
            databaseWriteCount: tick.databaseWriteCount,
            primaryDbWriteCount: tick.primaryDbWriteCount,
            sidecarWriteCount: tick.sidecarWriteCount,
            currentBuyChanged: tick.currentBuyChanged,
            lineChanged: tick.lineChanged,
            publicPublished: tick.publicPublished,
            automatedBettingChanged: tick.automatedBettingChanged,
            productionApplyExecuted: tick.productionApplyExecuted,
          };
          fs.writeFileSync(process.env.SUMMARY_PATH, `${JSON.stringify(summary, null, 2)}\n`);
          if (violations.length > 0) throw new Error(violations.join(','));
          NODE

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: n2-trifecta-local-capture-install-sanitized
          path: |
            ${{ runner.temp }}/n2-local-install-summary.json
            ${{ runner.temp }}/n2-local-install-before.json
            ${{ runner.temp }}/n2-local-install-after.json
            ${{ runner.temp }}/n2-local-install-output.json
            ${{ runner.temp }}/n2-local-install-tick.json
            ${{ runner.temp }}/n2-local-install-tick-exit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Print sanitized evidence
        run: cat "$SUMMARY_PATH"

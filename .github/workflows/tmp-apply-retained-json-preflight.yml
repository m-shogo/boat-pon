name: Temporary apply retained JSON preflight

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/research-retained-json-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/research-retained-json-preflight
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Bind executor digest into retention preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-intent-task.ts')
          text = p.read_text()
          old = 'historyOutputs = retainExecutorOutputs({ repoRoot: root, runId, outputPaths: exec.outputs }).historyOutputs;'
          new = 'historyOutputs = retainExecutorOutputs({ repoRoot: root, runId, outputPaths: exec.outputs, historyOutputDigest: exec.outputDigest }).historyOutputs;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('retainExecutorOutputs runner call anchor not found')
          p.write_text(text)
          PY
      - name: Verify JSON preflight contract
        run: |
          node --test --import tsx src/automation/researchRetainedOutputs.test.ts
          node --test --import tsx src/automation/researchRetainedOutputsBoundary.test.ts
          node --test --import tsx src/automation/researchRetainedOutputScanner.test.ts
          npm run typecheck
      - name: Commit validated runner binding
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/run-intent-task.ts; then
            echo 'runner already bound'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-intent-task.ts
          git commit -m 'fix(research): preflight retained JSON against executor digest'
          git push origin HEAD:fix/research-retained-json-preflight

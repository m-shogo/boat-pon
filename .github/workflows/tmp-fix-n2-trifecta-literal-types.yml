name: temporary fix N2 trifecta literal types

on:
  push:
    branches:
      - agent/n2-trifecta-market-readonly-foundation

permissions:
  contents: write

concurrency:
  group: tmp-fix-n2-trifecta-literal-types
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix(research): preserve trifecta foundation literal versions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-market-readonly-foundation
          fetch-depth: 0

      - name: Apply exact two-line type fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/research-replay/n2TrifectaMarketFoundation.ts')
          source = path.read_text()
          replacements = {
              '    manifestVersion: N2_TRIFECTA_MARKET_CANARY_MANIFEST_VERSION,':
                  '    manifestVersion: N2_TRIFECTA_MARKET_CANARY_MANIFEST_VERSION as typeof N2_TRIFECTA_MARKET_CANARY_MANIFEST_VERSION,',
              '    foundationVersion: N2_TRIFECTA_MARKET_FOUNDATION_VERSION,':
                  '    foundationVersion: N2_TRIFECTA_MARKET_FOUNDATION_VERSION as typeof N2_TRIFECTA_MARKET_FOUNDATION_VERSION,',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}, got {source.count(old)}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git diff --check
          git diff -- src/research-replay/n2TrifectaMarketFoundation.ts

      - name: Verify typecheck and targeted tests
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          node --import tsx --test \
            src/research-replay/n2TrifectaMarketFoundation.test.ts \
            src/research-replay/n2TrifectaMarketSourceInventoryReader.test.ts

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research-replay/n2TrifectaMarketFoundation.ts
          git diff --cached --check
          git commit -m 'fix(research): preserve trifecta foundation literal versions'
          git push origin HEAD:agent/n2-trifecta-market-readonly-foundation

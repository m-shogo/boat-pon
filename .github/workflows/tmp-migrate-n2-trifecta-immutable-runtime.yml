name: Temporary migrate N2 trifecta immutable runtime

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-migrate-n2-trifecta-immutable-runtime.yml

permissions:
  contents: read

concurrency:
  group: migrate-n2-trifecta-immutable-runtime
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: [self-hosted, macOS, boat-pon-local]
    timeout-minutes: 60
    env:
      AUTHORITY_SHA: 8d99eab54a7ff243491d46bb4e94f255fd47274b
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
      AGENT_LABEL: com.boatpon.trifecta-private-capture
    steps:
      - name: Checkout exact migration authority
        uses: actions/checkout@v4
        with:
          ref: 8d99eab54a7ff243491d46bb4e94f255fd47274b
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fast-forward canonical repository to exact authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -d "$CANONICAL_REPO/.git"
          test "$(git -C "$CANONICAL_REPO" branch --show-current)" = "main"
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"
          git -C "$CANONICAL_REPO" fetch --no-tags origin main
          git -C "$CANONICAL_REPO" merge --ff-only "$AUTHORITY_SHA"
          test "$(git -C "$CANONICAL_REPO" rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -z "$(git -C "$CANONICAL_REPO" status --porcelain)"

      - name: Install canonical dependencies
        working-directory: /Users/m-shogo/Developer/personal/boat-pon
        run: npm ci

      - name: Record database metadata before migration
        shell: bash
        run: |
          set -euo pipefail
          echo "AUTH_PATH=$CANONICAL_REPO/data/private/trifecta-capture/authorization.json" >> "$GITHUB_ENV"
          echo "RUNTIME_AUTH_PATH=$CANONICAL_REPO/data/private/trifecta-capture/runtime-authority.json" >> "$GITHUB_ENV"
          echo "PLIST_PATH=$HOME/Library/LaunchAgents/$AGENT_LABEL.plist" >> "$GITHUB_ENV"
          echo "INSTALL_OUT=$RUNNER_TEMP/n2-immutable-runtime-install.json" >> "$GITHUB_ENV"
          echo "TICK_OUT=$RUNNER_TEMP/n2-immutable-runtime-tick.json" >> "$GITHUB_ENV"
          echo "BEFORE_OUT=$RUNNER_TEMP/n2-immutable-runtime-before.json" >> "$GITHUB_ENV"
          node - <<'NODE' > "$RUNNER_TEMP/n2-immutable-runtime-before.json"
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          console.log(JSON.stringify({
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          }));
          NODE

      - name: Create immutable release and renew explicit 30-day authority
        working-directory: /Users/m-shogo/Developer/personal/boat-pon
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npx tsx scripts/install-n2-trifecta-local-capture-agent.ts \
            --renew --authorize --days 30 > "$INSTALL_OUT"
          test -s "$INSTALL_OUT"

      - name: Verify private binding, immutable worktree and launchd
        shell: bash
        run: |
          set -euo pipefail
          test -f "$AUTH_PATH"
          test -f "$RUNTIME_AUTH_PATH"
          test -f "$PLIST_PATH"
          test "$(stat -f '%Lp' "$AUTH_PATH")" = "600"
          test "$(stat -f '%Lp' "$RUNTIME_AUTH_PATH")" = "600"
          test "$(stat -f '%Lp' "$PLIST_PATH")" = "644"

          RUNTIME_ROOT="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNTIME_AUTH_PATH,'utf8')).runtimeRoot")"
          BOUND_SHA="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNTIME_AUTH_PATH,'utf8')).authoritySha")"
          test "$BOUND_SHA" = "$AUTHORITY_SHA"
          test -d "$RUNTIME_ROOT"
          test ! -L "$RUNTIME_ROOT"
          case "$RUNTIME_ROOT" in
            "$CANONICAL_REPO"|"$CANONICAL_REPO"/*) echo "runtime inside mutable repository"; exit 1 ;;
          esac
          case "$RUNTIME_ROOT" in
            *actions-runner-*|*/_work/*) echo "runtime inside runner workspace"; exit 1 ;;
          esac
          test "$(git -C "$RUNTIME_ROOT" rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -z "$(git -C "$RUNTIME_ROOT" status --porcelain --untracked-files=no)"
          if git -C "$RUNTIME_ROOT" symbolic-ref -q HEAD >/dev/null 2>&1; then
            echo "runtime HEAD is not detached"
            exit 1
          fi
          test -f "$RUNTIME_ROOT/node_modules/tsx/dist/cli.mjs"
          test -f "$RUNTIME_ROOT/scripts/run-n2-trifecta-local-capture-tick.ts"
          grep -Fq "$RUNTIME_ROOT" "$PLIST_PATH"
          grep -Fq "$AUTHORITY_SHA" "$PLIST_PATH"
          grep -Fq "$RUNTIME_AUTH_PATH" "$PLIST_PATH"
          ! grep -Fq '/actions-runner-' "$PLIST_PATH"
          /bin/launchctl print "gui/$(id -u)/$AGENT_LABEL" >/dev/null
          echo "RUNTIME_ROOT=$RUNTIME_ROOT" >> "$GITHUB_ENV"

      - name: Execute one sanitized immutable-runtime verification tick
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNTIME_ROOT"
          set +e
          BOAT_PON_DATA_ROOT="$CANONICAL_REPO" \
          BOAT_PON_LOCAL_CAPTURE_AUTH_PATH="$AUTH_PATH" \
          BOAT_PON_LOCAL_CAPTURE_RUNTIME_AUTH_PATH="$RUNTIME_AUTH_PATH" \
          BOAT_PON_LOCAL_CAPTURE_AUTHORITY_SHA="$AUTHORITY_SHA" \
          BOAT_PON_LOCAL_CAPTURE_RUNTIME_ROOT="$RUNTIME_ROOT" \
          node "$RUNTIME_ROOT/node_modules/tsx/dist/cli.mjs" \
            "$RUNTIME_ROOT/scripts/run-n2-trifecta-local-capture-tick.ts" --json > "$TICK_OUT"
          code=$?
          set -e
          echo "TICK_EXIT=$code" >> "$GITHUB_ENV"
          test -s "$TICK_OUT"

      - name: Print sanitized migration evidence and enforce boundaries
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.CANONICAL_REPO;
          function meta(file) {
            const stat = fs.existsSync(file) ? fs.statSync(file) : null;
            const wal = `${file}-wal`;
            return {
              exists: Boolean(stat),
              bytes: stat?.size ?? null,
              modifiedMs: stat?.mtimeMs ?? null,
              walBytes: fs.existsSync(wal) ? fs.statSync(wal).size : 0,
            };
          }
          const before = JSON.parse(fs.readFileSync(process.env.BEFORE_OUT, 'utf8'));
          const after = {
            primary: meta(path.join(root, 'data/boat.sqlite')),
            sidecar: meta(path.join(root, 'data/research-replay.sqlite')),
          };
          const install = JSON.parse(fs.readFileSync(process.env.INSTALL_OUT, 'utf8'));
          const authorization = JSON.parse(fs.readFileSync(process.env.AUTH_PATH, 'utf8'));
          const binding = JSON.parse(fs.readFileSync(process.env.RUNTIME_AUTH_PATH, 'utf8'));
          const tick = JSON.parse(fs.readFileSync(process.env.TICK_OUT, 'utf8'));
          const validityDays = (Date.parse(authorization.expiresAt) - Date.parse(authorization.issuedAt)) / 86400000;
          const violations = [];
          if (install.status !== 'INSTALLED') violations.push('INSTALL_NOT_CONFIRMED');
          if (install.authoritySha !== process.env.AUTHORITY_SHA) violations.push('INSTALL_AUTHORITY_SHA_MISMATCH');
          if (install.runtimeRoot !== process.env.RUNTIME_ROOT) violations.push('INSTALL_RUNTIME_ROOT_MISMATCH');
          if (!(validityDays > 29.9 && validityDays <= 30.01)) violations.push('AUTH_DURATION_INVALID');
          if (authorization.stage !== 'ONE_VENUE_REVIEW' || authorization.maxRequestsPerDay !== 48) violations.push('AUTH_SCOPE_INVALID');
          if (JSON.stringify(authorization.checkpointLabels) !== JSON.stringify(['T-30','T-20','T-10','T-5'])) violations.push('CHECKPOINT_POLICY_INVALID');
          if (binding.authorizationId !== authorization.authorizationId
            || binding.issuedAt !== authorization.issuedAt
            || binding.expiresAt !== authorization.expiresAt) violations.push('BINDING_AUTHORIZATION_MISMATCH');
          if (binding.authoritySha !== process.env.AUTHORITY_SHA
            || binding.runtimeRoot !== process.env.RUNTIME_ROOT) violations.push('BINDING_RUNTIME_MISMATCH');
          if (binding.privateResearchOnly !== true
            || binding.databaseWriteAuthorized !== false
            || binding.currentBuyConnectionAuthorized !== false
            || binding.lineConnectionAuthorized !== false
            || binding.publicPublishAuthorized !== false
            || binding.automatedBettingAuthorized !== false) violations.push('BINDING_BOUNDARY_WIDENED');
          if (tick.runtimeAuthorityStatus !== 'PASS') violations.push('RUNTIME_AUTHORITY_NOT_PASS');
          if (tick.authoritySha !== process.env.AUTHORITY_SHA
            || tick.runtimeRoot !== process.env.RUNTIME_ROOT) violations.push('TICK_RUNTIME_MISMATCH');
          if (tick.databaseWriteCount !== 0
            || tick.primaryDbWriteCount !== 0
            || tick.sidecarWriteCount !== 0
            || tick.currentBuyChanged !== false
            || tick.lineChanged !== false
            || tick.publicPublished !== false
            || tick.automatedBettingChanged !== false
            || tick.productionApplyExecuted !== false) violations.push('PROTECTED_BOUNDARY_CHANGED');
          if (JSON.stringify(before) !== JSON.stringify(after)) violations.push('DATABASE_METADATA_CHANGED');
          const summary = {
            evidenceSchemaVersion: 'n2-trifecta-immutable-runtime-migration-v1',
            status: violations.length === 0 ? 'PASS' : 'BLOCKED',
            violations,
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            authoritySha: process.env.AUTHORITY_SHA,
            canonicalRepoHead: process.env.AUTHORITY_SHA,
            installStatus: install.status,
            immutableRuntime: {
              runtimeRoot: process.env.RUNTIME_ROOT,
              outsideCanonicalRepo: true,
              outsideRunnerWorkspace: true,
              detachedHead: true,
              trackedWorktreeClean: true,
              dependenciesInstalled: true,
            },
            authorization: {
              version: authorization.authorizationVersion,
              issuedAt: authorization.issuedAt,
              expiresAt: authorization.expiresAt,
              validityDays,
              stage: authorization.stage,
              maxRequestsPerDay: authorization.maxRequestsPerDay,
              checkpoints: authorization.checkpointLabels,
            },
            runtimeBinding: {
              version: binding.authorityVersion,
              authorizationMatched: binding.authorizationId === authorization.authorizationId,
              intervalMatched: binding.issuedAt === authorization.issuedAt && binding.expiresAt === authorization.expiresAt,
              authorityShaMatched: binding.authoritySha === process.env.AUTHORITY_SHA,
              runtimeRootMatched: binding.runtimeRoot === process.env.RUNTIME_ROOT,
              privateResearchOnly: binding.privateResearchOnly,
              databaseWriteAuthorized: binding.databaseWriteAuthorized,
              currentBuyConnectionAuthorized: binding.currentBuyConnectionAuthorized,
              lineConnectionAuthorized: binding.lineConnectionAuthorized,
              publicPublishAuthorized: binding.publicPublishAuthorized,
              automatedBettingAuthorized: binding.automatedBettingAuthorized,
            },
            verificationTick: {
              exitCode: Number(process.env.TICK_EXIT),
              status: tick.status,
              blockers: tick.blockers,
              dateJst: tick.dateJst,
              runtimeAuthorityStatus: tick.runtimeAuthorityStatus,
              selectedVenueCode: tick.selectedVenueCode,
              selectedRaceCount: tick.selectedRaceCount,
              dueEntryCount: tick.dueEntryCount,
              networkRequestCount: tick.networkRequestCount,
              capturedCount: tick.capturedCount,
              blockedEvidenceCount: tick.blockedEvidenceCount,
            },
            databaseMetadataUnchanged: JSON.stringify(before) === JSON.stringify(after),
            databaseWriteCount: tick.databaseWriteCount,
            primaryDbWriteCount: tick.primaryDbWriteCount,
            sidecarWriteCount: tick.sidecarWriteCount,
            currentBuyChanged: tick.currentBuyChanged,
            lineChanged: tick.lineChanged,
            publicPublished: tick.publicPublished,
            automatedBettingChanged: tick.automatedBettingChanged,
            productionApplyExecuted: tick.productionApplyExecuted,
            oldRuntimeCleanupExecuted: false,
            rawUploadedOrPublished: false,
          };
          console.log('SANITIZED_IMMUTABLE_RUNTIME_MIGRATION_BEGIN');
          console.log(JSON.stringify(summary, null, 2));
          console.log('SANITIZED_IMMUTABLE_RUNTIME_MIGRATION_END');
          if (violations.length > 0) process.exit(1);
          NODE

name: Temporary run N2 immutable migration unique

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-run-n2-immutable-migration-unique.yml

permissions:
  contents: read

concurrency:
  group: migrate-n2-trifecta-immutable-runtime-unique-20260807
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      AUTHORITY_SHA: 8d99eab54a7ff243491d46bb4e94f255fd47274b
      CANONICAL_REPO: /Users/m-shogo/Developer/personal/boat-pon
      AGENT_LABEL: com.boatpon.trifecta-private-capture
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d99eab54a7ff243491d46bb4e94f255fd47274b
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Extract reviewed migration script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ops/migrate-n2-trifecta-immutable-runtime --quiet
          git show origin/ops/migrate-n2-trifecta-immutable-runtime:.github/workflows/tmp-migrate-n2-trifecta-immutable-runtime-standard.yml > "$RUNNER_TEMP/source.yml"
          python3 - <<'PY'
          from pathlib import Path
          lines = Path(__import__('os').environ['RUNNER_TEMP'] + '/source.yml').read_text().splitlines()
          marker = '      - name: Migrate and verify immutable runtime'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |') + 1
          body = []
          for line in lines[run_index:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          target = Path(__import__('os').environ['RUNNER_TEMP'] + '/run-migration.sh')
          target.write_text('#!/usr/bin/env bash\n' + '\n'.join(body) + '\n')
          target.chmod(0o700)
          PY

      - name: Execute reviewed migration script
        shell: bash
        run: "$RUNNER_TEMP/run-migration.sh"

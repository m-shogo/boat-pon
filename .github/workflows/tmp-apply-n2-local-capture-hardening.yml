          cli, count = re.subn(
              r'console\.log\(JSON\.stringify\(\{[\s\S]*?\}, null, 2\)\);',
              '''const summary = {
  reportVersion: report.reportVersion,
  status: report.status,
  blockers: report.blockers,
  now: report.now,
  dateJst: report.dateJst,
  selectedVenueCode: report.selectedVenueCode,

name: Temporary fix N2 real plan null chain

on:
  push:
    branches:
      - agent/n2-trifecta-real-plan-preflight
    paths:
      - .github/workflows/tmp-fix-n2-real-plan-null-chain.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/n2-trifecta-real-plan-preflight
          fetch-depth: 0

      - name: Apply exact null-chain fix and remove workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/research-replay/n2TrifectaRealPlanPreflight.ts")
          source = path.read_text()
          old = "planDigest: selected?.plan.manifestDigest ?? null,"
          new = "planDigest: selected?.plan?.manifestDigest ?? null,"
          if source.count(old) != 1:
              raise SystemExit(f"exact replacement count must be 1, got {source.count(old)}")
          path.write_text(source.replace(old, new))
          Path(".github/workflows/tmp-fix-n2-real-plan-null-chain.yml").unlink()
          PY

      - name: Commit exact fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research-replay/n2TrifectaRealPlanPreflight.ts \
            .github/workflows/tmp-fix-n2-real-plan-null-chain.yml
          git commit -m "fix(research): guard nullable selected plan digest"
          git push origin HEAD:agent/n2-trifecta-real-plan-preflight

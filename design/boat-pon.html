// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-source="ui.jsx">
// ============================================================
// Small reusable UI bits
// ============================================================

const { useState, useEffect, useMemo, useRef } = React;

// --- Status chip --------------------------------------------
function StatusChip({ s, sm }) {
  const m = {
    BUY:   { c: "buy",    label: "BUY" },
    WATCH: { c: "watch",  label: "WATCH" },
    SKIP:  { c: "skip",   label: "SKIP" },
    PASS:  { c: "buy",    label: "PASS" },
    HIT:   { c: "buy",    label: "HIT" },
    MISS:  { c: "skip",   label: "MISS" },
    SENT:  { c: "info",   label: "SENT" },
    RISK:  { c: "danger", label: "RISK" },
  };
  const v = m[s] || { c: "skip", label: s };
  return (
    <span className={"chip " + v.c} style={sm ? { fontSize: 9, padding: "1px 5px" } : null}>
      <span className="dot"></span>
      {v.label}
    </span>
  );
}

// --- Boat number tile ---------------------------------------
function Boat({ n, sm }) {
  return <span className={"boat" + (sm ? " boat--sm" : "")} data-n={n}>{n}</span>;
}

function BetNums({ bet, sm }) {
  return (
    <span className="bet-line__nums" style={sm ? { fontSize: 13, gap: 3 } : null}>
      {bet.map((n, i) => (
        <React.Fragment key={i}>
          <Boat n={n} sm={sm} />
          {i < bet.length - 1 && <span className="sep">-</span>}
        </React.Fragment>
      ))}
    </span>
  );
}

// --- Countdown timer (mm:ss) --------------------------------
function useCountdown(initMin, initSec, paused) {
  const [t, setT] = useState(initMin * 60 + initSec);
  useEffect(() => { setT(initMin * 60 + initSec); }, [initMin, initSec]);
  useEffect(() => {
    if (paused) return;
    const id = setInterval(() => setT((x) => Math.max(0, x - 1)), 1000);
    return () => clearInterval(id);
  }, [paused]);
  const mm = Math.floor(t / 60);
  const ss = t % 60;
  return { t, mm, ss, fmt: `${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}` };
}

// --- Odds gauge ----------------------------------------------
function OddsGauge({ req, current, status }) {
  // domain: 0 → max(req*2, current*1.2)
  const max = Math.max(req * 2, (current || req) * 1.2);
  const reqPct = Math.min(100, (req / max) * 100);
  const curPct = current ? Math.min(100, (current / max) * 100) : 0;
  const cls =
    status === "BUY" ? "" :
    status === "WATCH" ? "is-watch" :
    "is-skip";
  return (
    <div className={"odds-gauge " + cls}>
      <div className="odds-gauge__top">
        <span>0倍</span>
        <span className="dim">必要オッズ {req.toFixed(1)} ▼</span>
        <span>{max.toFixed(0)}倍</span>
      </div>
      <div className="odds-gauge__bar">
        {current != null && (
          <div className="odds-gauge__current" style={{ width: curPct + "%" }}></div>
        )}
        <div className="odds-gauge__threshold" style={{ left: reqPct + "%" }}></div>
      </div>
      <div className="odds-gauge__labels">
        <span>取得: {current != null ? <b>{current.toFixed(1)}倍</b> : <span className="dim">未取得</span>}</span>
        <span>{current != null && (
          current >= req
            ? <span style={{color:"var(--buy)"}}>+{(current - req).toFixed(1)} ({((current/req - 1) * 100).toFixed(0)}%)</span>
            : <span style={{color:"var(--danger)"}}>−{(req - current).toFixed(1)}</span>
        )}</span>
      </div>
    </div>
  );
}

// --- KPI tile ------------------------------------------------
function Kpi({ label, value, unit, sub, deltaPos, deltaNeg, bar, barCls, accent }) {
  return (
    <div className="kpi">
      <div className="kpi__head" style={accent ? { color: accent } : null}>
        <span className="dot"></span> {label}
      </div>
      <div className="kpi__value">
        <span className="num">{value}</span>
        {unit && <span className="unit">{unit}</span>}
      </div>
      {(sub || deltaPos || deltaNeg) && (
        <div className="kpi__sub">
          {deltaPos && <span className="delta-pos">▲ {deltaPos}</span>}
          {deltaNeg && <span className="delta-neg">▼ {deltaNeg}</span>}
          {sub && <span>{sub}</span>}
        </div>
      )}
      {bar != null && (
        <div className={"kpi__bar " + (barCls || "")}>
          <div className="fill" style={{ width: Math.min(100, bar) + "%" }}></div>
        </div>
      )}
    </div>
  );
}

// --- Panel ---------------------------------------------------
function Panel({ title, code, meta, pulse, children, body = true, bracketed = true, className }) {
  return (
    <div className={"panel" + (bracketed ? " bracketed" : "") + (className ? " " + className : "")}>
      {(title || code) && (
        <div className="panel__head">
          <span className="corner">┌</span>
          {code && <span className="corner">[{code}]</span>}
          <span className="title">{title}</span>
          <span className="spacer"></span>
          {pulse && <span className="pulse" title="live"></span>}
          {meta && <span className="meta">{meta}</span>}
        </div>
      )}
      {body ? <div className="panel__body">{children}</div> : children}
    </div>
  );
}

// --- Race card -----------------------------------------------
function RaceCard({ race, onOpen, compact }) {
  const cd = useCountdown(race.closeMin, race.closeSec);
  const near = cd.t <= 600 && cd.t > 300;
  const imm  = cd.t <= 300;
  const statusCls = race.status === "BUY" ? "is-buy" : race.status === "WATCH" ? "is-watch" : "is-skip";

  return (
    <div className={"racecard " + statusCls} onClick={() => onOpen?.(race)}>
      <div className="racecard__head">
        <span className="racecard__venue">{race.venueName}</span>
        <span className="racecard__race">{race.raceNo}R · {race.betType}</span>
        <span className={"racecard__close" + (imm ? " is-imminent" : near ? " is-near" : "")}>
          締切 <span className="countdown num">{cd.fmt}</span> <span className="dim">({race.closeAt})</span>
        </span>
      </div>
      <div className="racecard__body">
        <div className="row" style={{ marginBottom: 10 }}>
          <StatusChip s={race.status} />
          {race.suggestedAmount > 0 && <span className="chip info"><span className="dot"></span>推奨 ¥{race.suggestedAmount}</span>}
          {!race.samplesEnough && <span className="chip skip">サンプル不足</span>}
          {race.curOdds == null && <span className="chip skip">オッズ未取得</span>}
          <span className="tag">{race.bet.join("-")}</span>
        </div>

        <div className="bet-line">
          <span className="bet-line__label">買い目</span>
          <BetNums bet={race.bet} />
          <span className="bet-line__type">{race.betType}</span>
        </div>

        <div className="metric-row">
          <div className="metric-row__cell">
            <div className="l">推定的中率</div>
            <div className="v">{(race.pHat * 100).toFixed(1)}<span className="u">%</span></div>
          </div>
          <div className="metric-row__cell">
            <div className="l">必要オッズ</div>
            <div className="v">{race.reqOdds.toFixed(1)}<span className="u">倍</span></div>
          </div>
          <div className="metric-row__cell">
            <div className="l">現在オッズ</div>
            <div className="v">{race.curOdds != null ? <>{race.curOdds.toFixed(1)}<span className="u">倍</span></> : <span className="dim">—</span>}</div>
          </div>
          <div className={"metric-row__cell " + (race.ev >= 1.25 ? "is-good" : race.ev != null && race.ev < 1.05 ? "is-bad" : "")}>
            <div className="l">EV</div>
            <div className="v">{race.ev != null ? race.ev.toFixed(3) : <span className="dim">—</span>}</div>
          </div>
        </div>

        {!compact && <OddsGauge req={race.reqOdds} current={race.curOdds} status={race.status} />}

        {race.notes && (
          <div className="dim" style={{ fontSize: 10.5, marginTop: 8, lineHeight: 1.6 }}>
            ※ {race.notes}
          </div>
        )}
      </div>
      <div className="racecard__foot">
        {race.status === "BUY" ? (
          <>
            <span className="amount">推奨 <b>¥{race.suggestedAmount}</b> · 1点のみ</span>
            <span className="spacer flex--1"></span>
            <a
              href="https://www.boatrace.jp/owpc/pc/race/odds3t"
              target="_blank"
              rel="noopener noreferrer"
              className="btn btn--primary btn--xs"
              onClick={(e) => e.stopPropagation()}
            >
              公式で確認して購入 <span className="ext"></span>
            </a>
          </>
        ) : (
          <>
            <span className="amount dim">記録のみ · 購入対象外</span>
            <span className="spacer flex--1"></span>
            <button className="btn btn--ghost btn--xs" onClick={(e) => { e.stopPropagation(); onOpen?.(race); }}>
              詳細 →
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// --- Tiny sparkline ------------------------------------------
function Spark({ data, w = 80, h = 20, color = "var(--muted)" }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => `${(i * step).toFixed(1)},${(h - ((v - min) / range) * h).toFixed(1)}`).join(" ");
  return (
    <svg width={w} height={h} style={{ display: "block" }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.2" />
      <circle cx={w} cy={h - ((data[data.length-1] - min) / range) * h} r="2" fill={color} />
    </svg>
  );
}

// --- Toggle + Seg controls -----------------------------------
function Seg({ value, onChange, options }) {
  return (
    <div className="seg">
      {options.map((o) => (
        <button key={o.value} className={value === o.value ? "is-active" : ""} onClick={() => onChange(o.value)}>{o.label}</button>
      ))}
    </div>
  );
}

function Toggle({ on, onChange }) {
  return <div className={"toggle " + (on ? "is-on" : "")} onClick={() => onChange(!on)}></div>;
}

// --- ASCII title divider --------------------------------------
function AsciiBox({ children, label }) {
  return (
    <pre className="ascii dim" style={{ margin: 0, fontSize: 10, lineHeight: 1.1 }}>
      {`┌─ ${label} `}{"─".repeat(Math.max(4, 40 - label.length))}{`┐\n`}
      {children}
      {`\n└${"─".repeat(45)}┘`}
    </pre>
  );
}

// Expose all to window for cross-file React usage
Object.assign(window, {
  StatusChip, Boat, BetNums, useCountdown, OddsGauge, Kpi, Panel,
  RaceCard, Spark, Seg, Toggle, AsciiBox,
});

</script>

function PassRationale({ races, settings }) {
  const reasons = [
    { label: "EV不足 (1.05〜1.24)", count: races.filter(r => r.ev != null && r.ev >= 1.05 && r.ev < 1.25).length },
    { label: "EV不足 (<1.05)",       count: races.filter(r => r.ev != null && r.ev < 1.05).length },
    { label: "オッズ未取得",          count: races.filter(r => r.curOdds == null).length },
    { label: "サンプル不足",          count: races.filter(r => !r.samplesEnough).length },
    { label: "締切5分以内",           count: 0 },

  return (
    <div className="grid grid--2">
      <div>
        <div className="success-strip" style={{ marginBottom: 12 }}>

          <div>
            <b>全レース見送り = 成功</b>

              買わなかったことが今日のベストな判断です。

          </div>

          EV ≥ <b className="bright">{settings.targetEV.toFixed(2)}</b> を満たす候補は
          <b style={{ color: "var(--buy-2)" }}> 0件</b>。
          BUY基準を緩めれば候補は出ますが、過去90日の検証では基準を下げるほど ROI が悪化するため、見送ります。
        </div>
        <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px dashed var(--border)", fontSize: 11 }}>
          <div className="dim" style={{ marginBottom: 6 }}>本日の予算消化</div>
          <div className="row">
            <pre className="ascii" style={{ fontSize: 11, color: "var(--buy)", margin: 0 }}>
{`[░░░░░░░░░░░░░░░░░░░░] 0/${settings.budget} 円`}
            </pre>
          </div>
        </div>
      </div>
      <div>
        <div className="dim" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>

          {reasons.filter(r => r.count > 0).map((r, i) => (

              <span>{r.label}</span>
              <span className="num bright">{r.count}件</span>

}

const VERDICT_ASCII_PASS = `   ┌─────────┐
   │  PASS   │
   │  ✓✓✓  │
   │  ─────  │
   │  0/0/0  │

const VERDICT_ASCII_BUY = `   ┌─────────┐

// =============================================================
// BUY LIST (all candidates)
// =============================================================
function ScreenBuyList({ mode, settings, onOpen }) {

  return (

        <span className="dim" style={{ fontSize: 11 }}>
          並び替え:

            { value: "close", label: "締切順" },
            { value: "ev", label: "EV順" },

      </div>

}

// =============================================================
// RACE DETAIL
// =============================================================
function ScreenDetail({ race, onBack }) {
  if (!race) return null;
  const cd = useCountdown(race.closeMin, race.closeSec);
  const gap = race.curOdds != null ? race.curOdds - race.reqOdds : null;
  const evColor = race.ev >= 1.25 ? "var(--buy-2)" : race.ev != null && race.ev >= 1.05 ? "var(--watch-2)" : "var(--danger)";

  return (
    <div className="stack">
      <div className="row" style={{ gap: 8 }}>
        <button className="btn btn--ghost btn--xs" onClick={onBack}>← 一覧へ戻る</button>
        <span className="dim" style={{ fontSize: 11 }}>raceId: {race.raceId}</span>
      </div>

      {/* === Header strip === */}
      <Panel className="panel" code="DETAIL" title={`${race.venueName} ${race.raceNo}R`}
        meta={`締切 ${cd.fmt} (${race.closeAt})`} pulse>
        <div className="row" style={{ gap: 16, flexWrap: "wrap" }}>
          <div>
            <div className="dim" style={{ fontSize: 10, textTransform: "uppercase" }}>判定</div>
            <div style={{ marginTop: 4 }}><StatusChip s={race.status} /></div>
          </div>
          <div style={{ borderLeft: "1px dashed var(--border-2)", paddingLeft: 16 }}>

          </div>
          <div style={{ borderLeft: "1px dashed var(--border-2)", paddingLeft: 16 }}>
            <div className="dim" style={{ fontSize: 10, textTransform: "uppercase" }}>EV</div>
            <div style={{ marginTop: 4, fontSize: 22, fontWeight: 600, color: evColor, fontVariantNumeric: "tabular-nums" }}>
              {race.ev != null ? race.ev.toFixed(3) : "—"}
            </div>
          </div>
          <span className="spacer flex--1"></span>
          {race.status === "BUY" ? (
            <a className="btn btn--primary" href="https://www.boatrace.jp/owpc/pc/race/odds3t" target="_blank" rel="noopener noreferrer">
              公式で確認して購入 <span className="ext"></span>
            </a>
          ) : (
            <a className="btn" href="https://kyotei24.jp/sp/" target="_blank" rel="noopener noreferrer">
              kyotei24で確認 <span className="ext"></span>
            </a>
          )}
        </div>
      </Panel>

      <div className="grid grid--12">
        {/* === EV breakdown === */}
        <div className="col-7">
          <Panel title="EV の内訳" code="EV.CALC">
            <div style={{ marginBottom: 16 }}>
              <pre className="ascii" style={{ fontSize: 12, lineHeight: 1.7, color: "var(--text)", margin: 0, overflowX: "auto" }}>
{`  EV  =  推定的中率  ×  オッズ
      =  ${(race.pHat * 100).toFixed(2)}%        ×  ${race.curOdds != null ? race.curOdds.toFixed(2) + "倍" : "未取得"}
      =  ${race.ev != null ? race.ev.toFixed(3) : "—"}

  必要オッズ  =  目標EV / 推定的中率
              =  ${race.targetEV.toFixed(2)} / ${(race.pHat * 100).toFixed(2)}%
              =  ${race.reqOdds.toFixed(2)}倍`}
              </pre>
            </div>

            <OddsGauge req={race.reqOdds} current={race.curOdds} status={race.status} />

            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
              <h3 style={{ marginBottom: 10 }}>判定ルールの適合</h3>
              <div className="stack" style={{ gap: 6, fontSize: 11 }}>
                <RuleCheck ok={race.ev != null && race.ev >= 1.25}
                  label="EV ≥ 1.25" v={race.ev != null ? race.ev.toFixed(3) : "—"} />
                <RuleCheck ok={race.samplesEnough}
                  label="サンプル数十分 (n ≥ 600)" v={`n=${race.sampleN}`} />
                <RuleCheck ok={cd.t >= 300}
                  label="締切まで5分以上" v={cd.fmt} />
                <RuleCheck ok={true}
                  label="同レース通知済みでない" v="未通知" />
                <RuleCheck ok={race.suggestedAmount <= 100}
                  label="1点 ¥100 ルール" v={`¥${race.suggestedAmount}`} />
                <RuleCheck ok={race.curOdds != null}
                  label="オッズ取得済み" v={race.curOdds != null ? "kyotei24" : "未取得"} />
              </div>
            </div>
          </Panel>
        </div>

        {/* === Right side === */}
        <div className="col-5 stack" style={{ gap: "var(--gap)" }}>
          <Panel title="推定的中率の根拠" code="P.HAT">
            <div className="stack" style={{ gap: 6, fontSize: 11 }}>
              {(race.reasoning || []).map((r, i) => (
                <div key={i} className="row" style={{ justifyContent: "space-between", padding: "4px 0", borderBottom: i < race.reasoning.length - 1 ? "1px dashed var(--border)" : "none" }}>
                  <span className="muted">{r.k}</span>
                  <span className="bright num">{r.v}</span>
                </div>
              ))}
              <div className="row" style={{ marginTop: 6, padding: "8px 10px", background: "var(--bg)", border: "1px dashed var(--border-2)", fontSize: 10.5 }}>
                <span className="dim">サンプル数</span>
                <span className="spacer flex--1"></span>
                <span className="bright num">{race.sampleN.toLocaleString()}件</span>
              </div>
            </div>
          </Panel>

          {race.status === "BUY" ? (
            <Panel title="通知プレビュー" code="NOTIF" meta="Discord">
              <NotifPreview race={race} />
            </Panel>
          ) : (
            <Panel title="通知しない理由" code="SKIP">
              <div className="stack" style={{ gap: 8, fontSize: 11 }}>
                <div className="row" style={{ gap: 6, padding: "6px 0" }}>
                  <span style={{ color: "var(--watch)" }}>⚠</span>
                  <span>{race.notes}</span>
                </div>
                <div className="dim" style={{ fontSize: 10.5, lineHeight: 1.7 }}>
                  通知は BUY 条件をすべて満たした時のみ送信されます。
                  WATCH / SKIP の場合は記録のみで通知は発生しません。
                </div>
              </div>
            </Panel>
          )}
        </div>
      </div>
    </div>
  );
}

function RuleCheck({ ok, label, v }) {
  return (
    <div className="row" style={{ justifyContent: "space-between", padding: "5px 0", borderBottom: "1px dashed var(--border)" }}>
      <span className="row" style={{ gap: 8 }}>
        <span style={{ color: ok ? "var(--buy)" : "var(--danger)", width: 12, fontFamily: "var(--mono)" }}>{ok ? "✓" : "✗"}</span>
        <span className={ok ? "" : "muted"}>{label}</span>
      </span>
      <span className="bright num" style={{ fontSize: 11 }}>{v}</span>
    </div>
  );
}

function NotifPreview({ race }) {
  return (
    <div className="notif">
      <div className="head">
        <span className="icon">🚤</span>
        <span>BUY候補あり</span>
        <span className="app">Boat EV Notifier · 今</span>
      </div>
      <div className="body">
        <div style={{ marginBottom: 6 }}>
          <b>{race.venueName} {race.raceNo}R</b>
          <span className="dim" style={{ marginLeft: 8, fontSize: 10 }}>締切 {race.closeAt}</span>
        </div>
        <div className="row" style={{ gap: 6, marginBottom: 8 }}>
          <span className="dim" style={{ fontSize: 10 }}>買い目</span>
          <BetNums bet={race.bet} sm />
        </div>
        <div className="dim" style={{ fontSize: 11, lineHeight: 1.8 }}>
          推定的中率 <b className="bright num">{(race.pHat * 100).toFixed(1)}%</b><br />
          必要オッズ <b className="bright num">{race.reqOdds.toFixed(1)}倍 以上</b><br />
          取得オッズ <b className="bright num">{race.curOdds != null ? race.curOdds.toFixed(1) + "倍" : "—"}</b><br />
          EV <b style={{ color: "var(--buy-2)" }} className="num">{race.ev != null ? race.ev.toFixed(2) : "—"}</b>
        </div>
        <div className="meta">
          <span>推奨 ¥{race.suggestedAmount}</span>
          <span>1点のみ</span>
          <span style={{ marginLeft: "auto", color: "var(--watch)" }}>公式オッズで最終確認</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { ScreenDashboard, ScreenBuyList, ScreenDetail });

</script>
<script type="text/babel" data-source="screens-aux.jsx">
// ============================================================
// History/Backtest + Notifications + Settings screens
// ============================================================

// Aliased to avoid top-level identifier clashes across <script type="text/babel"> files.
const HIST    = window.BoatData.HISTORY;
const EVB     = window.BoatData.EV_BUCKETS;
const VR_LIST = window.BoatData.VENUE_ROI;
const N_LIST  = window.BoatData.NOTIFS;

// =============================================================
// HISTORY / BACKTEST
// =============================================================
function ScreenHistory() {
  const buys = HIST.filter(h => h.status === "BUY");
  const watches = HIST.filter(h => h.status === "WATCH");
  const passes = HIST.filter(h => h.status === "PASS");
  const hits = buys.filter(h => h.result === "HIT").length;
  const totalAmount = buys.reduce((s, h) => s + h.amount, 0);
  const totalPayout = buys.reduce((s, h) => s + h.payout, 0);
  const roi = totalAmount > 0 ? totalPayout / totalAmount : 0;
  const hitRate = buys.length > 0 ? hits / buys.length : 0;

  // would-have-bought analysis
  const watchHits = watches.filter(w => w.result === "HIT").length;

  return (
    <div className="stack">

             sub={`${hits} / ${buys.length}`}
             bar={hitRate * 100 * 2}
             barCls={hitRate >= 0.3 ? "" : "is-watch"} />
        <Kpi label="ROI"
             value={(roi * 100).toFixed(1)} unit="%"

                  <th className="num" style={{textAlign:"right"}}>的中率</th>
                  <th>ROI</th>
                  <th className="num" style={{textAlign:"right"}}>ROI%</th>

                {EVB.map((b, i) => {

                    <tr key={i} style={goodCutoff ? { background: "var(--buy-bg)" } : null}>

                      <td className="num" style={{textAlign:"right"}}>{b.n}</td>
                      <td className="num" style={{textAlign:"right"}}>{b.hit}</td>
                      <td className="num" style={{textAlign:"right"}}>{(b.hitRate * 100).toFixed(1)}%</td>
                      <td style={{ width: 140 }}>
                        <div style={{ height: 8, background: "var(--bg)", border: "1px solid var(--border)", position: "relative", overflow: "hidden" }}>

                      <td className="num" style={{textAlign:"right", color, fontWeight: 600}}>{(b.roi * 100).toFixed(0)}</td>

              <br />→ <b style={{ color: "var(--watch-2)" }}>買わなくて正解</b>
            </div>
          </div>
          <div className="flex--1">
            <pre className="ascii dim" style={{ fontSize: 11, margin: 0, lineHeight: 1.6 }}>

<script type="text/babel" data-source="app.jsx">
// ============================================================
// Boat EV Notifier — main app shell
// ============================================================

const { useState: useS, useEffect: useE } = React;

const NAV = [
  { id: "dash",    n: "01", label: "ダッシュボード",  short: "DASH" },
  { id: "buy",     n: "02", label: "候補レース",      short: "CAND" },

];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "buy",
  "theme": "dark",
  "density": "dense",
  "targetEV": 1.25,
  "budget": 1000
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useE(() => {
    document.documentElement.setAttribute("data-theme", t.theme);

    targetEV: t.targetEV,

        <TweakSection title="デモ状態">
          <TweakRadio

              { value: "buy",   label: "BUY候補日" },

          />

          <TweakRadio
            value={t.targetEV}

              { value: 1.20, label: "1.20" },

            value={t.budget}

        <TweakSection title="表示">

            value={t.theme}

              { value: "loose", label: "ゆったり" },

        · BOAT RACE 公式 (DL)<br />
        · kyotei24.jp (候補のみ)<br />
        · ローカル SQLite<br />
        <span className="warn">⚠ 自動購入は実装なし</span>
      </div>
    </aside>
  );
}

// ---- Mobile bottom nav ----------------------------------
function MobileNav({ current, onNav, buyN }) {
  return (
    <nav className="mobile-nav">
      {NAV.map(n => (
        <button
          key={n.id}
          className={"nav__item" + (current === n.id || (n.id === "buy" && current === "detail") ? " is-active" : "")}
          onClick={() => onNav(n.id)}>
          <span className="label">{n.short}</span>
          {n.id === "buy" && buyN > 0 && <span className="badge" style={{ fontSize: 9 }}>{buyN}</span>}
        </button>
      ))}
    </nav>
  );
}

// ---- Page head ------------------------------------------
function PageHead({ view, settings, mode }) {
  const titles = {
    dash:     ["DASHBOARD",  "本日の判定 (2026-05-21)"],
    buy:      ["CANDIDATES", "候補レース一覧"],
    detail:   ["RACE DETAIL", "レース詳細"],
    history:  ["BACKTEST",   "判定履歴 / バックテスト"],
    notif:    ["NOTIF",      "通知センター"],
    settings: ["CONFIG",     "設定 / 安全装置"],
  };
  const [code, t] = titles[view.screen] || ["", ""];
  return (
    <div className="page__head">
      <h1>
        <span className="brk">[</span>
        <span style={{ color: "var(--buy)", fontSize: 14, fontWeight: 500 }}>{code}</span>
        <span className="brk">]</span>
        <span>{t}</span>
      </h1>
      <span className="spacer flex--1"></span>
      <span className="meta">
        EV target: <b>{settings.targetEV.toFixed(2)}</b> · 予算: <b>¥{settings.budget}</b> · モード: <b>{mode === "buy" ? "BUY-day" : "PASS-day"}</b>
      </span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
